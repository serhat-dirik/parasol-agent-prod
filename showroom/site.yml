---
site:
  title: 'AI Agents: From localhost to Production'
  start_page: modules::index.adoc

content:
  sources:
    # Point Antora straight at the published repository. This is portable (it does not depend
    # on where the content is checked out in the build container) and reads the committed
    # content from the main branch.
    - url: https://github.com/serhat-dirik/parasol-agent-prod
      start_path: showroom/content
      branches: main

ui:
  bundle:
    url: https://github.com/rhpds/rhdp_showroom_theme/releases/download/latest/ui-bundle.zip
    snapshot: true

output:
  dir: ./www
