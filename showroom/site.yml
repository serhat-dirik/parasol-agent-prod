---
site:
  title: 'AI Agents: From localhost to Production'
  start_page: modules::index.adoc

content:
  sources:
    # The in-cluster build (quay.io/rhpds/showroom-content) clones the whole repo and runs
    # `antora showroom/site.yml` from the repo root, so start_path is relative to the repo root.
    - url: .
      start_path: showroom/content

ui:
  bundle:
    url: https://github.com/rhpds/rhdp_showroom_theme/releases/download/latest/ui-bundle.zip
    snapshot: true

output:
  dir: ./www
