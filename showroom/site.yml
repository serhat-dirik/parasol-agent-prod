---
site:
  title: 'AI Agents: From localhost to Production'
  start_page: modules::index.adoc

content:
  sources:
    # The in-cluster build (quay.io/rhpds/showroom-content) runs `antora showroom/site.yml`.
    # Antora resolves a relative content url against the playbook's own directory (showroom/),
    # so url:.. points at the git repo root, and start_path is relative to that root.
    - url: ..
      start_path: showroom/content

ui:
  bundle:
    url: https://github.com/rhpds/rhdp_showroom_theme/releases/download/latest/ui-bundle.zip
    snapshot: true

output:
  dir: ./www
