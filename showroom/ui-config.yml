---
type: showroom
theme: rh-one-2025

# Left column (the guide) takes 30% of the width, leaving the framed tabs as wide as possible.
default_width: 30
# Persist the URL state so a browser refresh does not reset the UI.
persist_url_state: true

view_switcher:
  enabled: true
  default_mode: split

antora:
  name: modules
  dir: antora
  modules:
    - name: index
    - name: 01-architecture
    - name: 02-before-you-start
    - name: 03-scenario1-colleague
    - name: 04-scenario2-document
    - name: 05-scenario3-confidential-document
    - name: 06-scenario4-night-shift
    - name: 07-scenario5-eval-gate
    - name: 08-scenario6-poisoned-tool
    - name: 09-incident-forensics
    - name: 10-supply-chain
    - name: 11-reset-troubleshooting

# CLUSTER_DOMAIN is replaced per cluster in the deployed copy (gitops/platform/showroom).
tabs:
  # The two Parasol portals are our own app and can be framed inline.
  - name: Portal unsecured
    url: 'https://portal-free.apps.CLUSTER_DOMAIN'
  - name: Portal secured
    url: 'https://portal.apps.CLUSTER_DOMAIN'

  # The platform consoles are framed like the portals. Their own X-Frame-Options / CSP would
  # block that, so scripts/showroom-framing.sh (run by bootstrap.sh) rewrites both headers on the
  # default IngressController to allow this Showroom origin only.
  - name: Keycloak
    url: 'https://sso.apps.CLUSTER_DOMAIN/admin/master/console/#/parasol'
  - name: OpenShift AI
    url: 'https://rh-ai.apps.CLUSTER_DOMAIN'
  - name: OpenShift Console
    url: 'https://console-openshift-console.apps.CLUSTER_DOMAIN'
  - name: Argo CD
    url: 'https://openshift-gitops-server-openshift-gitops.apps.CLUSTER_DOMAIN'
  - name: MLflow
    url: 'https://rh-ai.apps.CLUSTER_DOMAIN/mlflow'

  # Terminal served by the ttyd sidecar, reverse-proxied at /wetty/ on the Route host.
  - name: Terminal
    path: /wetty/
    port: 443
