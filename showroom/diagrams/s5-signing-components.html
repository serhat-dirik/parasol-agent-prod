<rect width="1240" height="620" fill="#fff"/><text class="lane" x="20" y="34" text-anchor="start">WHO SIGNS</text><text class="lane" x="450" y="34" text-anchor="start">TRUSTED ARTIFACT SIGNER  (runs in this cluster)</text><text class="lane" x="900" y="34" text-anchor="start">WHO VERIFIES</text><rect class="ctl" x="44" y="52" width="356" height="146" rx="10"/><text class="t" x="222.0" y="78" text-anchor="middle">Tekton Chains</text><text class="c" x="222.0" y="99" text-anchor="middle">controller outside the pipeline (openshift-pipelines)</text><text class="s" x="222.0" y="119" text-anchor="middle">signs every image a TaskRun built</text><text class="s" x="222.0" y="139" text-anchor="middle">and its SLSA provenance, keyless;</text><text class="s" x="222.0" y="159" text-anchor="middle">no pipeline step holds a signing key</text><rect class="box" x="44" y="270" width="356" height="106" rx="10"/><text class="t" x="222.0" y="296" text-anchor="middle">SPIRE</text><text class="s" x="222.0" y="317" text-anchor="middle">Zero Trust Workload Identity Manager:</text><text class="s" x="222.0" y="337" text-anchor="middle">gives Chains a short-lived identity token</text><text class="s" x="222.0" y="357" text-anchor="middle">spiffe://.../sa/tekton-chains-controller</text><rect class="box" x="450" y="52" width="400" height="86" rx="10"/><text class="t" x="650.0" y="78" text-anchor="middle">Fulcio</text><text class="s" x="650.0" y="99" text-anchor="middle">certificate authority: identity token in,</text><text class="s" x="650.0" y="119" text-anchor="middle">certificate valid 10 minutes out</text><rect class="box" x="450" y="160" width="400" height="86" rx="10"/><text class="t" x="650.0" y="186" text-anchor="middle">CT log</text><text class="s" x="650.0" y="207" text-anchor="middle">certificate transparency: every certificate</text><text class="s" x="650.0" y="227" text-anchor="middle">Fulcio issued</text><rect class="box" x="450" y="268" width="400" height="86" rx="10"/><text class="t" x="650.0" y="294" text-anchor="middle">Rekor</text><text class="s" x="650.0" y="315" text-anchor="middle">transparency log: every signature and</text><text class="s" x="650.0" y="335" text-anchor="middle">attestation with its time, append-only</text><rect class="box" x="450" y="376" width="400" height="86" rx="10"/><text class="t" x="650.0" y="402" text-anchor="middle">TUF</text><text class="s" x="650.0" y="423" text-anchor="middle">trust roots (Fulcio, Rekor, CT log)</text><text class="s" x="650.0" y="443" text-anchor="middle">for signers and verifiers</text><rect class="ctl" x="900" y="52" width="320" height="146" rx="10"/><text class="t" x="1060.0" y="78" text-anchor="middle">Conforma</text><text class="c" x="1060.0" y="99" text-anchor="middle">task verify-conforma, before</text><text class="s" x="1060.0" y="119" text-anchor="middle">promote: Chains signature and</text><text class="s" x="1060.0" y="139" text-anchor="middle">provenance, expected pipeline,</text><text class="s" x="1060.0" y="159" text-anchor="middle">pinned digest; else no promote</text><rect class="ctl" x="900" y="236" width="320" height="146" rx="10"/><text class="t" x="1060.0" y="262" text-anchor="middle">Policy controller</text><text class="c" x="1060.0" y="283" text-anchor="middle">admission webhook, every pod in</text><text class="s" x="1060.0" y="303" text-anchor="middle">parasol-secured: Chains' identity</text><text class="s" x="1060.0" y="323" text-anchor="middle">+ Rekor entry (ClusterImage-</text><text class="s" x="1060.0" y="343" text-anchor="middle">Policy); else refused</text><rect class="run" x="20" y="506" width="1200" height="70" rx="10"/><text class="t" x="620.0" y="532" text-anchor="middle">Image registry</text><text class="s" x="620.0" y="553" text-anchor="middle">the image by digest, with Chains' signature (.sig) and SLSA provenance (.att) stored next to it</text><path class="arr" d="M222,270 L222,202"/><text class="s" x="234" y="242" text-anchor="start">identity</text><path
