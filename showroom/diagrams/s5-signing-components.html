<rect width="1240" height="620" fill="#fff"/><text class="lane" x="20" y="34" text-anchor="start">WHO SIGNS</text><text class="lane" x="450" y="34" text-anchor="start">TRUSTED ARTIFACT SIGNER  (runs in this cluster)</text><text class="lane" x="900" y="34" text-anchor="start">WHO VERIFIES</text><rect class="ctl" x="44" y="52" width="356" height="126" rx="10"/><text class="t" x="222.0" y="78" text-anchor="middle">Tekton Chains</text><text class="c" x="222.0" y="99" text-anchor="middle">controller outside the pipeline (openshift-pipelines)</text><text class="s" x="222.0" y="119" text-anchor="middle">signs every image a TaskRun built,</text><text class="s" x="222.0" y="139" text-anchor="middle">and attests its SLSA provenance;</text><text class="s" x="222.0" y="159" text-anchor="middle">only Chains can read its key</text><rect class="box" x="44" y="214" width="356" height="106" rx="10"/><text class="t" x="222.0" y="240" text-anchor="middle">keyless-sign task</text><text class="s" x="222.0" y="261" text-anchor="middle">the pipeline's own identity, no stored key:</text><text class="s" x="222.0" y="281" text-anchor="middle">signs the image and its SBOM</text><text class="s" x="222.0" y="301" text-anchor="middle">(service account keyless-signer)</text><rect class="box" x="44" y="356" width="356" height="106" rx="10"/><text class="t" x="222.0" y="382" text-anchor="middle">SPIRE</text><text class="s" x="222.0" y="403" text-anchor="middle">Zero Trust Workload Identity Manager:</text><text class="s" x="222.0" y="423" text-anchor="middle">gives the pod a short-lived identity token</text><text class="s" x="222.0" y="443" text-anchor="middle">spiffe://parasol-demo/ns/parasol-build/sa/keyless-signer</text><rect class="box" x="450" y="52" width="400" height="86" rx="10"/><text class="t" x="650.0" y="78" text-anchor="middle">Fulcio</text><text class="s" x="650.0" y="99" text-anchor="middle">certificate authority: identity token in,</text><text class="s" x="650.0" y="119" text-anchor="middle">certificate valid 10 minutes out</text><rect class="box" x="450" y="268" width="400" height="86" rx="10"/><text class="t" x="650.0" y="294" text-anchor="middle">Rekor</text><text class="s" x="650.0" y="315" text-anchor="middle">transparency log: every keyless signature,</text><text class="s" x="650.0" y="335" text-anchor="middle">append-only, tamper-evident</text><rect class="box" x="450" y="160" width="400" height="86" rx="10"/><text class="t" x="650.0" y="186" text-anchor="middle">CT log</text><text class="s" x="650.0" y="207" text-anchor="middle">certificate transparency: every certificate</text><text class="s" x="650.0" y="227" text-anchor="middle">Fulcio issued</text><rect class="box" x="450" y="376" width="196" height="86" rx="10"/><text class="t" x="548.0" y="402" text-anchor="middle">Time-stamp</text><text class="s" x="548.0" y="423" text-anchor="middle">dates each keyless</text><text class="s" x="548.0" y="443" text-anchor="middle">signature (RFC 3161)</text><rect class="box" x="654" y="376" width="196" height="86" rx="10"/><text class="t" x="752.0" y="402" text-anchor="middle">TUF</text><text class="s" x="752.0" y="423" text-anchor="middle">trust roots for</text><text class="s" x="752.0" y="443" text-anchor="middle">signers and verifiers</text><rect class="ctl" x="900" y="52" width="320" height="146" rx="10"/><text class="t" x="1060.0" y="78" text-anchor="middle">Conforma</text><text class="c" x="1060.0" y="99" text-anchor="middle">task verify-enterprise-contract,</text><text class="s" x="1060.0" y="119" text-anchor="middle">before promote: Chains signature,</text><text class="s" x="1060.0" y="139" text-anchor="middle">provenance from this pipeline,</text><text class="s" x="1060.0" y="159" text-anchor="middle">image by digest; else no promote</text><rect class="ctl" x="900" y="236" width="320" height="146" rx="10"/><text class="t" x="1060.0" y="262" text-anchor="middle">Policy controller</text><text class="c" x="1060.0" y="283" text-anchor="middle">admission webhook, every pod in</text><text class="s" x="1060.0" y="303" text-anchor="middle">parasol-secured: keyless identity</text><text class="s" x="1060.0" y="323" text-anchor="middle">+ trusted timestamp (Cluster-</text><text class="s" x="1060.0" y="343" text-anchor="middle">ImagePolicy); else refused</text><rect class="run" x="20" y="506" width="1200" height="70" rx="10"/><text class="t" x="620.0" y="532" text-anchor="middle">Image registry</text><text class="s" x="620.0" y="553" text-anchor="middle">the image by digest, with its signatures (.sig) and attestations (.att: SLSA provenance, SBOM) stored next to it</text><path class="arr" d="M222,356 L222,324"/><text class="s" x="234" y="344" text-anchor="start">identity</text><path class="arr" d="M400,250 L446,104"/><path class="arr" d="M400,292 L446,308"/><path class="arr" d="M425,419 L446,419"/><path class="arr" d="M650,138 L650,156"/><path class="arr" d="M850,419 C880,419 880,330 896,320"/><path class="arr" d="M850,405 C890,380 870,160 896,140"/><path class="arr" d="M44,115 L28,115 L28,502"/><path class="arr" d="M400,306 L425,306 L425,502"/><path class="arr" d="M1060,502 L1060,386"/><path class="arr" d="M1180,502 L1180,202"/><text class="s" x="20" y="606" text-anchor="start">No stored key in the pipeline: Chains holds the only build key; keyless signing uses a 10-minute certificate and a trusted timestamp. Nothing calls the public Sigstore services.</text></svg></body></html>
