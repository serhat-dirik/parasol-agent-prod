ss="s" x="1030" y="296" text-anchor="middle">not reached</text><text class="l" x="40" y="340">Rebecca + fraud agent: approve_claim, beyond that agent's limit</text><rect class="ok" x="130" y="354" width="160" height="34" rx="8"/><text class="g" x="210" y="376" text-anchor="middle">pass</text><rect class="bad" x="540" y="354" width="160" height="34" rx="8"/><text class="r" x="620" y="376" text-anchor="middle">blocked</text><rect class="ext" x="950" y="354" width="160" height="34" rx="8"/><text class="s" x="1030" y="376" text-anchor="middle">not reached</text><text class="l" x="40" y="420">Rebecca + claims agent: read a claim assigned to another adjuster</text><rect class="ok" x="130" y="434" width="160" height="34" rx="8"/><text class="g" x="210" y="456" text-anchor="middle">pass</text><rect class="ok" x="540" y="434" width="160" height="34" rx="8"/><text class="g" x="620" y="456" text-anchor="middle">pass</text><rect class="bad" x="950" y="434" width="160" height="34" rx="8"/><text class="r" x="1030" y="456" text-anchor="middle">blocked</text><text class="s" x="40" y="522">Gates 1 and 2 are combined by Keycloak when the agent exchanges the user's token: it carries only the tool roles in both, and the gateway refuses a call without the role.</text><text class="s" x="40" y="542">Gate 3: claims-db verifies the same token (signature, issuer, audience) and reads the user and groups from it.</text></svg></body></html>
