<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#fff;font-family:"Red Hat Text","Helvetica Neue",Arial,sans-serif}
svg text{font-family:inherit}
.box{fill:#fff;stroke:#4d4d4d;stroke-width:1.5}
.ctl{fill:#fff4e5;stroke:#c46100;stroke-width:1.5}
.ext{fill:#f2f2f2;stroke:#8a8d90;stroke-width:1.5;stroke-dasharray:6 4}
.run{fill:#e7f1fa;stroke:#0066cc;stroke-width:2}
.bad{fill:#fdecea;stroke:#c9190b;stroke-width:1.5}
.ok{fill:#f3faf2;stroke:#3e8635;stroke-width:1.5}
.t{font-size:16px;font-weight:700;fill:#151515}
.s{font-size:13px;fill:#3c3f42}
.c{font-size:13px;fill:#8a4100}
.r{font-size:13px;fill:#a30000;font-weight:700}
.g{font-size:13px;fill:#2a6a22;font-weight:700}
.lane{font-size:13px;font-weight:700;fill:#6a6e73;letter-spacing:.06em}
.arr{stroke:#4d4d4d;stroke-width:2;fill:none;marker-end:url(#a)}
.no{stroke:#c9190b;stroke-width:2;fill:none;stroke-dasharray:6 4;marker-end:url(#n)}
.yes{stroke:#3e8635;stroke-width:2;fill:none;marker-end:url(#y)}
</style></head><body><svg width="1260" height="450" viewBox="0 0 1260 450" xmlns="http://www.w3.org/2000/svg"><defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4d4d4d"/></marker>
<marker id="n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c9190b"/></marker>
<marker id="y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3e8635"/></marker>
</defs>
<rect width="1260" height="450" fill="#fff"/><text class="lane" x="20" y="34" text-anchor="start">KEYLESS SIGNING BY TEKTON CHAINS, STEP BY STEP  (seconds after the build task finishes)</text><rect class="box" x="20" y="56" width="230" height="150" rx="10"/><text class="t" x="135.0" y="82" text-anchor="middle">1  Build finishes</text><text class="s" x="135.0" y="103" text-anchor="middle">a TaskRun reports</text><text class="s" x="135.0" y="123" text-anchor="middle">IMAGE_URL + IMAGE_DIGEST;</text><text class="s" x="135.0" y="143" text-anchor="middle">Chains picks it up</text><text class="s" x="135.0" y="163" text-anchor="middle">outside the pipeline</text><rect class="box" x="270" y="56" width="230" height="150" rx="10"/><text class="t" x="385.0" y="82" text-anchor="middle">2  Who are you?</text><text class="s" x="385.0" y="103" text-anchor="middle">Chains asks SPIRE for a token:</text><text class="s" x="385.0" y="123" text-anchor="middle">spiffe://parasol-demo/ns/</text><text class="s" x="385.0" y="143" text-anchor="middle">openshift-pipelines/sa/</text><text class="s" x="385.0" y="163" text-anchor="middle">tekton-chains-controller</text><rect class="box" x="520" y="56" width="230" height="150" rx="10"/><text class="t" x="635.0" y="82" text-anchor="middle">3  Fulcio checks</text><text class="s" x="635.0" y="103" text-anchor="middle">the token against SPIRE's</text><text class="s" x="635.0" y="123" text-anchor="middle">published keys, then issues a</text><text class="s" x="635.0" y="143" text-anchor="middle">certificate valid 10 minutes;</text><text class="s" x="635.0" y="163" text-anchor="middle">the CT log records it</text><rect class="box" x="770" y="56" width="230" height="150" rx="10"/><text class="t" x="885.0" y="82" text-anchor="middle">4  Sign</text><text class="s" x="885.0" y="103" text-anchor="middle">a throwaway key signs the</text><text class="s" x="885.0" y="123" text-anchor="middle">image and the SLSA provenance;</text><text class="s" x="885.0" y="143" text-anchor="middle">both pushed next to the image;</text><text class="s" x="885.0" y="163" text-anchor="middle">the key is discarded</text><rect class="box" x="1020" y="56" width="230" height="150" rx="10"/><text class="t" x="1135.0" y="82" text-anchor="middle">5  Record</text><text class="s" x="1135.0" y="103" text-anchor="middle">Rekor logs the signature and</text><text class="s" x="1135.0" y="123" text-anchor="middle">the provenance with their</text><text class="s" x="1135.0" y="143" text-anchor="middle">time, so both verify after</text><text class="s" x="1135.0" y="163" text-anchor="middle">the certificate expires</text><path class="arr" d="M250,131.0 L266,131.0"/><path class="arr" d="M500,131.0 L516,131.0"/><path class="arr" d="M750,131.0 L766,131.0"/><path class="arr" d="M1000,131.0 L1016,131.0"/><text class="lane" x="20" y="252" text-anchor="start">VERIFYING IT</text><rect class="ok" x="20" y="270" width="600" height="126" rx="10"/><text class="t" x="320.0" y="296" text-anchor="middle">Conforma, admission and cosign verify</text><text class="s" x="320.0" y="317" text-anchor="middle">read the signature and certificate from the registry;</text><text class="s" x="320.0" y="337" text-anchor="middle">the certificate must chain to Fulcio's root (from TUF);</text><text class="s" x="320.0" y="357" text-anchor="middle">its identity must be Chains' SPIFFE ID in the policy</text><rect class="ok" x="660" y="270" width="580" height="126" rx="10"/><text class="t" x="950.0" y="296" text-anchor="middle">Valid after the certificate expires</text><text class="s" x="950.0" y="317" text-anchor="middle">Rekor's entry time proves the signature was made while the</text><text class="s" x="950.0" y="337" text-anchor="middle">10-minute certificate was valid, so a pod that restarts days</text><text class="s" x="950.0" y="357" text-anchor="middle">later is still admitted</text><text class="s" x="20" y="430" text-anchor="start">No secret to steal or rotate: the private key exists for one signature. The proof is the identity in the certificate and the entries in Rekor, all in this cluster.</text></svg></body></html>
