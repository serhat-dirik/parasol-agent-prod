<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#fff;font-family:"Red Hat Text","Helvetica Neue",Arial,sans-serif}

<rect width="1400" height="550" fill="#fff"/><text class="lane" x="20" y="34">THE PARTNER BANK'S RELEASES</text><rect class="ext" x="20" y="50" width="220" height="100" rx="10"/><text class="t" x="130.0" y="76" text-anchor="middle">Bank's registry</text><text class="s" x="130.0" y="97" text-anchor="middle">currency-converter 1.4.2</text><text class="s" x="130.0" y="118" text-anchor="middle">and 1.4.3 (demo: built in</text><text class="s" x="130.0" y="139" text-anchor="middle">parasol-build)</text><text class="lane" x="300" y="34">UNSECURED: RUN WHAT THE BANK PUBLISHED</text><rect class="ext" x="300" y="50" width="260" height="100" rx="10"/><text class="t" x="430.0" y="76" text-anchor="middle">parasol-thirdparty</text><text class="s" x="430.0" y="97" text-anchor="middle">runs the bank's latest image,</text><text class="s" x="430.0" y="118" text-anchor="middle">restarts on a new release</text><rect class="bad" x="600" y="50" width="250" height="100" rx="10"/><text class="t" x="725.0" y="76" text-anchor="middle">Unsecured assistant</text><text class="s" x="725.0" y="97" text-anchor="middle">plugged in by URL;</text><text class="r" x="725.0" y="118" text-anchor="middle">1.4.3's description pays</text><path class="arr" d="M240,100 L296,100"/><path class="arr" d="M560,100 L596,100"/><text class="lane" x="220" y="200">SECURED: ONBOARDING PIPELINE  parasol-tool-onboarding &lt;version&gt;  (parasol-build)</text><rect class="box" x="20" y="215" width="150" height="120" rx="10"/><text class="t" x="95.0" y="241" text-anchor="middle">Resolve</text><text class="s" x="95.0" y="262" text-anchor="middle">the version's</text><text class="s" x="95.0" y="283" text-anchor="middle">image digest</text><text class="s" x="95.0" y="304" text-anchor="middle">+ policy from Git</text><rect class="box" x="200" y="215" width="140" height="120" rx="10"/><text class="t" x="270.0" y="241" text-anchor="middle">Scan</text><text class="s" x="270.0" y="262" text-anchor="middle">Trivy</text><text class="s" x="270.0" y="283" text-anchor="middle">(reused task)</text><rect class="ctl" x="370" y="215" width="330" height="175" rx="10"/><text class="t" x="535.0" y="241" text-anchor="middle">Tool check</text><text class="s" x="535.0" y="262" text-anchor="middle">image runs as a sidecar: no token,</text><text class="s" x="535.0" y="283" text-anchor="middle">egress only to DNS and NeMo</text><text class="s" x="535.0" y="304" text-anchor="middle">version, pin per version (Git),</text><text class="s" x="535.0" y="325" text-anchor="middle">no Parasol tool names,</text><text class="c" x="535.0" y="346" text-anchor="middle">NeMo parasol-tool-descriptions,</text><text class="c" x="535.0" y="367" text-anchor="middle">contract calls + parasol-tool-results</text><rect class="box" x="730" y="215" width="170" height="120" rx="10"/><text class="t" x="815.0" y="241" text-anchor="middle">Sign + attest</text><text class="s" x="815.0" y="262" text-anchor="middle">Parasol's key;</text><text class="s" x="815.0" y="283" text-anchor="middle">the check report</text><text class="s" x="815.0" y="304" text-anchor="middle">as attestation</text><rect class="ctl" x="930" y="215" width="190" height="120" rx="10"/><text class="t" x="1025.0" y="241" text-anchor="middle">Promote</text><text class="s" x="1025.0" y="262" text-anchor="middle">digest pinned on</text><text class="c" x="1025.0" y="283" text-anchor="middle">Argo CD</text><text class="c" x="1025.0" y="304" text-anchor="middle">env-secured-tools</text><rect class="run" x="1150" y="215" width="230" height="150" rx="10"/><text class="t" x="1265.0" y="241" text-anchor="middle">parasol-secured</text><text class="s" x="1265.0" y="262" text-anchor="middle">admission: Parasol-signed only</text><text class="s" x="1265.0" y="283" text-anchor="middle">MCP gateway registration:</text><text class="s" x="1265.0" y="304" text-anchor="middle">pin, roles, NeMo on results</text><text class="s" x="1265.0" y="325" text-anchor="middle">no egress</text><text class="g" x="1265.0" y="346" text-anchor="middle">the assistant uses 1.4.2</text><path class="arr" d="M95,150 L95,211"/><path class="arr" d="M170,275 L196,275"/><path class="arr" d="M340,275 L366,275"/><path class="yes" d="M700,275 L726,275"/><path class="arr" d="M900,275 L926,275"/><path class="arr" d="M1120,275 L1146,275"/><rect class="bad" x="370" y="425" width="330" height="105" rx="10"/><text class="t" x="535.0" y="451" text-anchor="middle">1.4.3 refused</text><text class="r" x="535.0" y="472" text-anchor="middle">no pin, names approve_payout,</text><text class="r" x="535.0" y="493" text-anchor="middle">NeMo blocks the description</text><text class="s" x="535.0" y="514" text-anchor="middle">sign and promote skipped</text><path class="no" d="M535,390 L535,421"/><rect class="bad" x="930" y="425" width="450" height="105" rx="10"/><text class="t" x="1155.0" y="451" text-anchor="middle">Bypass: run 1.4.3 in parasol-secured directly</text><text class="r" x="1155.0" y="472" text-anchor="middle">denied by admission:</text><text class="s" x="1155.0" y="493" text-anchor="middle">parasol-vendor-tools-must-be-onboarded,</text><text class="s" x="1155.0" y="514" text-anchor="middle">no Parasol signature</text><rect class="box" x="20" y="425" width="320" height="105" rx="10"/><text class="t" x="180.0" y="451" text-anchor="middle">Second line: runtime scanner</text><text class="s" x="180.0" y="472" text-anchor="middle">re-reads every server's tools every 30 s;</text><text class="s" x="180.0" y="493" text-anchor="middle">alerts MCPToolDefinitionDrift</text></svg></body></html>
