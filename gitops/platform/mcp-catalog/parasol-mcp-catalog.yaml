# Parasol's MCP servers in the OpenShift AI catalog (AI hub > MCP servers): each server with its tools and
# whether a tool reads or writes (approve_payout, approve_claim and release_payment write). deploymentMode remote: the
# servers already run behind the MCP gateway, so the catalog describes them, it does not deploy them.
# Tool names, descriptions and parameters are taken verbatim from the gateway's tools/list.
# mcp-catalog-sources is the user slot the model-catalog server mounts at /data/user-mcp-sources.
# Applied by bootstrap.sh (step 11) with envsubst '$CLUSTER_DOMAIN'; not Argo-synced (operator namespace).
apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-catalog-sources
  namespace: rhoai-model-registries
data:
  sources.yaml: |
    mcp_catalogs:
    - name: Parasol MCP Servers
      id: parasol_mcp_servers
      type: yaml
      enabled: true
      properties:
        yamlCatalogPath: /data/user-mcp-sources/parasol-mcp-servers.yaml
      labels:
      - Parasol
    labels:
    - name: Parasol
      assetType: mcp_servers
      displayName: Parasol MCP servers
      description: Parasol Insurance's own MCP servers, served through the Parasol MCP
        gateway.
  parasol-mcp-servers.yaml: |
    source: Parasol MCP
    mcp_servers:
    - name: parasol/claims-db
      provider: Parasol Insurance
      license: apache-2.0
      license_link: https://www.apache.org/licenses/LICENSE-2.0
      description: 'Parasol claims database: read claims, their history and uploaded documents, and approve payouts.'
      readme: |
        # Parasol claims-db

        Parasol claims database: read claims, their history and uploaded documents; approve claims and release payments.

        ## Access

        Served through the Parasol MCP gateway (Red Hat Connectivity Link). Every call carries the user's identity, exchanged by an approved agent; the gateway shows and allows only the tools the person's Keycloak roles grant.

        Read tools: adjusters, claims managers, contractors (role `tool:<name>` on client `claims-db`).
        Two-stage approval (secured): `approve_claim` (adjusters and claims managers) sets a claim to Ready for payment, no money moves; `release_payment` (claims managers only) pays it, and only from a claims manager's Release payment click, never from the chat assistant. `approve_payout` (one-step payout) is the unsecured environment's tool; no role grants it in secured.
      version: 1.0.0
      transports:
      - http
      documentationUrl: https://github.com/serhat-dirik/parasol-agent-prod
      repositoryUrl: https://github.com/serhat-dirik/parasol-agent-prod
      sourceCode: serhat-dirik/parasol-agent-prod/apps/mcp-servers/claims-db
      publishedDate: '2026-10-31T00:00:00Z'
      deploymentMode: remote
      endpoints:
        http: https://mcp.apps.$CLUSTER_DOMAIN/mcp
      tags:
      - parasol
      - insurance
      - claims
      tools:
      - name: get_claim
        description: Look up a single Parasol Insurance claim by its claim number (for example CLM-1001). Returns the
          claimant, line of business (auto/home/life), workflow status, claimed amount in USD, assigned adjuster and
          incident date. Use this to answer questions about the status or details of a specific claim.
        accessType: read_only
        parameters:
        - name: claimNumber
          type: string
          description: The claim number, e.g. CLM-1001
          required: true
      - name: list_claims_by_status
        description: 'List the Parasol claims currently in a given workflow status. Valid statuses are exactly: Submitted,
          UnderReview, ReadyForPayment, Approved, Denied. Returns each matching claim with its number, claimant, type, amount and adjuster.'
        accessType: read_only
        parameters:
        - name: status
          type: string
          description: 'One of: Submitted, UnderReview, ReadyForPayment, Approved, Denied'
          required: true
      - name: get_claim_history
        description: Return the audit timeline for a claim (submitted, adjuster assigned, documents requested/received,
          under review, approved/denied, payment issued), oldest event first. Use this when asked what has happened
          to a claim over time.
        accessType: read_only
        parameters:
        - name: claimNumber
          type: string
          description: The claim number, e.g. CLM-1001
          required: true
      - name: get_claim_documents
        description: Return the text of the documents a customer uploaded to a claim (for example a repair estimate).
          Use this when asked to read, summarise or check the documents, uploads or attachments on a claim.
        accessType: read_only
        parameters:
        - name: claimNumber
          type: string
          description: The claim number, e.g. CLM-1004
          required: true
      - name: approve_claim
        description: 'Approve a Parasol Insurance claim: the claim is valid and the amount is agreed. Sets an UnderReview
          claim to ReadyForPayment and records who approved it. It does NOT pay: a claims manager releases the payment
          afterwards. Call this when asked to approve a claim. If no amount is given the full claimed amount is approved;
          it may not exceed the claimed amount.'
        accessType: read_write
        parameters:
        - name: claimNumber
          type: string
          description: The claim number, e.g. CLM-1001
          required: true
        - name: amount
          type: number
          description: Amount in USD to approve; omit to approve the full claimed amount
          required: false
      - name: release_payment
        description: 'Release the payment of a Parasol Insurance claim that is ReadyForPayment (approved): sets it to
          Approved and issues the approved amount. Claims managers only.'
        accessType: read_write
        parameters:
        - name: claimNumber
          type: string
          description: The claim number, e.g. CLM-1001
          required: true
      - name: approve_payout
        description: Approve a Parasol Insurance claim for payment and issue the payout. Sets the claim status to Approved
          and records the payment in the claim timeline. Call this when asked to approve, pay, pay out or settle a claim.
          If no amount is given the full claimed amount is paid.
        accessType: read_write
        parameters:
        - name: actor
          type: string
          description: The user who authorized this approval; omit when the assistant approves autonomously
          required: false
        - name: amount
          type: number
          description: Amount in USD to pay; omit to pay the full claimed amount
          required: false
        - name: claimNumber
          type: string
          description: The claim number, e.g. CLM-1004
          required: true
      securityIndicators:
        readOnlyTools: false
        secureEndpoint: true
        verifiedSource: true
    - name: parasol/policy-docs
      provider: Parasol Insurance
      license: apache-2.0
      license_link: https://www.apache.org/licenses/LICENSE-2.0
      description: 'Parasol policy documents: search and read coverage, deductibles and claim workflow rules.'
      readme: |
        # Parasol policy-docs

        Parasol policy documents: search and read coverage, deductibles and claim workflow rules.

        ## Access

        Served through the Parasol MCP gateway (Red Hat Connectivity Link). Every call carries the user's identity, exchanged by an approved agent; the gateway shows and allows only the tools the person's Keycloak roles grant.

        All Parasol staff and contractors.
      version: 1.0.0
      transports:
      - http
      documentationUrl: https://github.com/serhat-dirik/parasol-agent-prod
      repositoryUrl: https://github.com/serhat-dirik/parasol-agent-prod
      sourceCode: serhat-dirik/parasol-agent-prod/apps/mcp-servers/policy-docs
      publishedDate: '2026-10-31T00:00:00Z'
      deploymentMode: remote
      endpoints:
        http: https://mcp.apps.$CLUSTER_DOMAIN/mcp
      tags:
      - parasol
      - insurance
      - claims
      tools:
      - name: search_policies
        description: Search the Parasol Insurance policy documents for passages relevant to a question about coverage,
          deductibles, required documentation, claim workflow, service levels or payout timing. Returns the most relevant
          policy passages (with id, title and text) to ground the answer. Always call this before answering a policy
          question, and base the answer only on the returned passages.
        accessType: read_only
        parameters:
        - name: maxResults
          type: integer
          description: Maximum passages to return (default 3, max 8)
          required: false
        - name: query
          type: string
          description: The natural-language question or keywords to search for
          required: true
      - name: get_policy
        description: Fetch a single Parasol policy document in full by its id, e.g. POL-AUTO-01.
        accessType: read_only
        parameters:
        - name: policyId
          type: string
          description: The policy document id, e.g. POL-HOME-01
          required: true
      - name: list_policies
        description: 'List the available Parasol policy documents (id, title and category) so you know what coverage
          areas exist. Categories: auto, home, life, claims.'
        accessType: read_only
        parameters: []
      securityIndicators:
        readOnlyTools: true
        secureEndpoint: true
        verifiedSource: true
    - name: parasol/fraud-check
      provider: Parasol Insurance
      license: apache-2.0
      license_link: https://www.apache.org/licenses/LICENSE-2.0
      description: 'Fraud-check agent: scores a claim''s fraud risk from the claim record and its documents.'
      readme: |
        # Parasol fraud-check

        Fraud-check agent: scores a claim's fraud risk from the claim record and its documents.

        ## Access

        Served through the Parasol MCP gateway (Red Hat Connectivity Link). Every call carries the user's identity, exchanged by an approved agent; the gateway shows and allows only the tools the person's Keycloak roles grant.

        Adjusters and claims managers (`tool:fraud_check`); not contractors.
      version: 1.0.0
      transports:
      - http
      documentationUrl: https://github.com/serhat-dirik/parasol-agent-prod
      repositoryUrl: https://github.com/serhat-dirik/parasol-agent-prod
      sourceCode: serhat-dirik/parasol-agent-prod/apps/mcp-servers/fraud-check
      publishedDate: '2026-10-31T00:00:00Z'
      deploymentMode: remote
      endpoints:
        http: https://mcp.apps.$CLUSTER_DOMAIN/mcp
      tags:
      - parasol
      - insurance
      - claims
      tools:
      - name: fraud_check
        description: Assess the fraud risk of a Parasol Insurance claim before any payout. Looks up the claim record
          and the documents the customer uploaded, then compares the amount requested in the documents against the amount
          on the claim record and checks the documents for anything suspicious. Returns a risk verdict (HIGH, MEDIUM
          or LOW) with the specific figures and the reasons. Call this before approving or paying a claim, especially
          when a document asks for a different or larger amount than the claim record. The claim number looks like CLM-1004.
        accessType: read_only
        parameters:
        - name: claimNumber
          type: string
          description: The claim number to assess, e.g. CLM-1004
          required: true
      securityIndicators:
        readOnlyTools: true
        secureEndpoint: true
        verifiedSource: true
    - name: parasol/knowledge-base
      provider: Parasol Insurance
      license: apache-2.0
      license_link: https://www.apache.org/licenses/LICENSE-2.0
      description: 'Parasol internal knowledge base: retrieval as the signed-in user.'
      readme: |
        # Parasol knowledge-base

        Parasol internal knowledge base: retrieval as the signed-in user.

        ## Access

        Served through the Parasol MCP gateway (Red Hat Connectivity Link). Every call carries the user's identity, exchanged by an approved agent; the gateway shows and allows only the tools the person's Keycloak roles grant.

        Everyone may search; each result is filtered by the person's group, so restricted documents never reach the model for someone who may not read them.
      version: 1.0.0
      transports:
      - http
      documentationUrl: https://github.com/serhat-dirik/parasol-agent-prod
      repositoryUrl: https://github.com/serhat-dirik/parasol-agent-prod
      sourceCode: serhat-dirik/parasol-agent-prod/apps/mcp-servers/knowledge-base
      publishedDate: '2026-10-31T00:00:00Z'
      deploymentMode: remote
      endpoints:
        http: https://mcp.apps.$CLUSTER_DOMAIN/mcp
      tags:
      - parasol
      - insurance
      - claims
      tools:
      - name: search_knowledge
        description: |-
          Search Parasol's internal knowledge base (claims process, policy FAQs, claims handling guidelines,
              repair-vendor rate card, escalation process, staff and HR matters). Returns cited passages (doc_id,
              title, classification, snippet) the user is entitled to read, and how many matching passages were
              withheld. Answer only from the returned passages and cite their titles.
        accessType: read_only
        parameters:
        - name: query
          type: string
          description: ''
          required: true
      securityIndicators:
        readOnlyTools: true
        secureEndpoint: true
        verifiedSource: true
