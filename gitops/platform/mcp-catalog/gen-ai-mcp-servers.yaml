# The Parasol MCP gateway as an AI asset of the OpenShift AI dashboard: Gen AI studio > AI asset endpoints >
# MCP servers, and the MCP server picker of every project's playground. The gen-ai BFF (3.5) lists MCP servers
# ONLY from this ConfigMap (name fixed, dashboard namespace; schema per key: url, transport, description, logo).
# It deploys nothing. One entry: the gateway is a single aggregating endpoint (tools of claims-db, policy-docs,
# knowledge-base and fraud-check), so per-server entries would all resolve to the same URL. The per-server
# view (cards, tools, read/write) is the MCP catalog: AI hub > MCP servers > Catalog (parasol-mcp-catalog.yaml).
# Tool calls need a token issued to an approved agent on behalf of a user (the gateway's AuthPolicy checks azp);
# the playground's own OpenShift token is not one, so tools/list answers 401 until a token is pasted in the
# playground's authorize dialog (scripts/agent-token.sh <user>). The listing itself needs no token.
# Applied by bootstrap.sh (step 11): envsubst '$CLUSTER_DOMAIN' < this file | oc apply -f -
apiVersion: v1
kind: ConfigMap
metadata:
  name: gen-ai-aa-mcp-servers
  namespace: redhat-ods-applications
data:
  Parasol-MCP-Gateway: |
    {
      "url": "https://mcp.apps.$CLUSTER_DOMAIN/mcp",
      "transport": "streamable-http",
      "description": "Parasol MCP gateway (Red Hat Connectivity Link): claims-db, policy-docs, knowledge-base and fraud-check tools. Calls need a user's token exchanged by an approved agent; the gateway lists and allows only the tools that person's roles grant."
    }
