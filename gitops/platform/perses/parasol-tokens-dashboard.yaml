# Perses dashboard "Parasol Assistant Token Spend": the governance evidence of the Showroom scenarios.
# Every row is "agent X on behalf of user Y". Rendered by the Cluster Observability Operator's console
# Perses backend (UIPlugin "monitoring"), which lives in openshift-operators: the perses-operator pushes
# each PersesDashboard to perses.<its-namespace>.svc, so this CR must sit there. OpenShift console:
# Observe > Dashboards, project openshift-operators. Queries use the project default datasource
# (thanos-querier, UWM-aware). Counters are cumulative since their process started (portal, guardrails
# proxy, Authorino, Limitador); see the guide's reset page for what resets them.
apiVersion: perses.dev/v1alpha2
kind: PersesDashboard
metadata:
  name: parasol-assistant-tokens
  namespace: openshift-operators
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  labels:
    app.kubernetes.io/part-of: parasol
spec:
  config:
    display:
      name: Parasol Assistant Token Spend
      description: 'Agent X on behalf of user Y: token spend, model calls, tool calls, gateway rejections, guardrail hits, knowledge-base retrievals and the spend alert'
    duration: 1h
    variables:
    - kind: ListVariable
      spec:
        name: user
        display:
          name: User
        allowAllValue: true
        allowMultiple: true
        defaultValue:
        - $__all
        sort: alphabetical-asc
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            labelName: user
            matchers:
            - parasol_agent_tokens_total{user!=""}
    - kind: ListVariable
      spec:
        name: agent
        display:
          name: Agent
        allowAllValue: true
        allowMultiple: true
        defaultValue:
        - $__all
        sort: alphabetical-asc
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            labelName: agent
            matchers:
            - parasol_agent_tokens_total{agent!=""}
    panels:
      spendRate:
        kind: Panel
        spec:
          display:
            name: Token spend per user and agent (tokens/min), alert at 5000
            description: 'sum by (user, agent) (rate(parasol_agent_tokens_total[2m])) * 60: the ParasolAssistantTokenSpendHigh expression'
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: right
              visual:
                display: line
                lineWidth: 1.5
                areaOpacity: 0.2
              yAxis:
                format:
                  unit: decimal
              thresholds:
                steps:
                - value: 5000
                  color: '#d9534f'
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum by (user, agent) (rate(parasol_agent_tokens_total{user=~"$user", agent=~"$agent"}[2m])) * 60
                  seriesNameFormat: '{{user}} via {{agent}}'
      spendTable:
        kind: Panel
        spec:
          display:
            name: Tokens by user and agent (since the portal started)
            description: 'sum by (user, agent, env) (parasol_agent_tokens_total): each row reads agent X on behalf of user Y'
          plugin:
            kind: Table
            spec:
              density: compact
              columnSettings:
              - name: timestamp
                hide: true
              - name: user
                header: user
              - name: agent
                header: agent
              - name: env
                header: env
              - name: value
                header: tokens
                sort: desc
                enableSorting: true
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum by (user, agent, env) (parasol_agent_tokens_total{user=~"$user", agent=~"$agent"})
                  seriesNameFormat: ''
      modelCalls:
        kind: Panel
        spec:
          display:
            name: Model calls per agent and user (calls/min)
            description: sum by (agent, user) (rate(parasol_agent_model_calls_total[5m])) * 60
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: right
              visual:
                display: line
                lineWidth: 1.5
                areaOpacity: 0.2
              yAxis:
                format:
                  unit: decimal
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum by (agent, user) (rate(parasol_agent_model_calls_total{user=~"$user", agent=~"$agent"}[5m])) * 60
                  seriesNameFormat: '{{user}} via {{agent}}'
      latencyP95:
        kind: Panel
        spec:
          display:
            name: Assistant turn latency P95 per agent (seconds)
            description: histogram_quantile(0.95, sum by (le, agent) (rate(parasol_agent_latency_seconds_bucket[5m])))
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: right
              visual:
                display: line
                lineWidth: 1.5
                areaOpacity: 0.2
              yAxis:
                format:
                  unit: seconds
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: histogram_quantile(0.95, sum by (le, agent) (rate(parasol_agent_latency_seconds_bucket{user=~"$user", agent=~"$agent"}[5m])))
                  seriesNameFormat: P95 {{agent}}
      toolTable:
        kind: Panel
        spec:
          display:
            name: Tool calls by tool, user, agent and status
            description: 'sum by (tool, user, agent, status) (parasol_tool_calls_total): 200 = reached the tool through the gateway, 403 = refused (Approve without the role)'
          plugin:
            kind: Table
            spec:
              density: compact
              columnSettings:
              - name: timestamp
                hide: true
              - name: tool
                header: tool
              - name: user
                header: user
              - name: agent
                header: agent
              - name: status
                header: status
              - name: value
                header: count
                sort: desc
                enableSorting: true
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum by (tool, user, agent, status) (parasol_tool_calls_total{user=~"$user", agent=~"$agent"})
                  seriesNameFormat: ''
      toolStatus:
        kind: Panel
        spec:
          display:
            name: Tool calls by status (cumulative)
            description: sum by (status) (parasol_tool_calls_total)
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: right
              visual:
                display: line
                lineWidth: 1.5
                areaOpacity: 0.2
              yAxis:
                format:
                  unit: decimal
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum by (status) (parasol_tool_calls_total{user=~"$user", agent=~"$agent"})
                  seriesNameFormat: status {{status}}
      rejectTable:
        kind: Panel
        spec:
          display:
            name: Gateway rejections by reason
            description: Authorino evaluator denials (approved-agent / tool-access-check rules), the portal's per-user 429s, Limitador's 429s and claims-db record refusals (parasol_claims_access_denied_total), cumulative
          plugin:
            kind: Table
            spec:
              density: compact
              columnSettings:
              - name: timestamp
                hide: true
              - name: reason
                header: reason
              - name: user
                header: user
              - name: agent
                header: agent
              - name: value
                header: count
                sort: desc
                enableSorting: true
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: label_replace(sum(auth_server_evaluator_denied{evaluator_name="approved-agent"}), "reason", "403 not via an approved agent (MCP gateway)", "", "") or label_replace(sum(auth_server_evaluator_denied{evaluator_name="tool-access-check"}),
                    "reason", "403 role does not allow the tool (MCP gateway)", "", "") or label_replace(sum by (user, agent) (parasol_agent_rejections_total{reason="usage_limit"}), "reason", "429 usage
                    limit (MaaS token budget)", "", "") or label_replace(sum(limited_calls), "reason", "429 all models, all users (Limitador)", "", "") or label_replace(sum by (user, agent) (parasol_claims_access_denied_total), "reason", "denied, claim not assigned to the user (claims-db record access)", "", "")
                  seriesNameFormat: ''
      rejectSeries:
        kind: Panel
        spec:
          display:
            name: Gateway rejections by reason (cumulative)
            description: the same counters over time; a step is a refusal
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: right
              visual:
                display: line
                lineWidth: 1.5
                areaOpacity: 0.2
              yAxis:
                format:
                  unit: decimal
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: label_replace(sum(auth_server_evaluator_denied{evaluator_name="approved-agent"}), "reason", "403 not via an approved agent (MCP gateway)", "", "") or label_replace(sum(auth_server_evaluator_denied{evaluator_name="tool-access-check"}),
                    "reason", "403 role does not allow the tool (MCP gateway)", "", "") or label_replace(sum by (user, agent) (parasol_agent_rejections_total{reason="usage_limit"}), "reason", "429 usage
                    limit (MaaS token budget)", "", "") or label_replace(sum(limited_calls), "reason", "429 all models, all users (Limitador)", "", "")
                  seriesNameFormat: '{{reason}} {{user}}'
      rejectNote:
        kind: Panel
        spec:
          display:
            name: Who was refused at the gateway
          plugin:
            kind: Markdown
            spec:
              text: 'The gateway counters say *why*; the Authorino log says *who*, one line per refusal:


                `oc logs -n kuadrant-system deploy/authorino | grep -E ''approved agent|denied for''`


                * `not via an approved agent: rebecca azp=parasol-demo-cli`: a login token presented without an agent

                * `tool approve_payout denied for rebecca azp=parasol-claims-agent`: the agent asked, the person lacks the role


                Record refusals (the tool was allowed, the claim is not assigned to the user): `oc logs -n parasol-secured deploy/claims-db | grep ''CLAIMS ACL denied''`


                429s name the user here (portal counter, labels user and agent) and in the ParasolAssistantTokenSpendHigh alert.'
      guardHits:
        kind: Panel
        spec:
          display:
            name: Guardrail hits by detector, action, user and agent
            description: 'sum by (detector, action, user, agent) (parasol_guardrails_detections_total): flag = document instruction flagged, block = turn refused, mask = personal data redacted, redact = external link removed from an answer'
          plugin:
            kind: Table
            spec:
              density: compact
              columnSettings:
              - name: timestamp
                hide: true
              - name: detector
                header: detector
              - name: action
                header: action
              - name: user
                header: user
              - name: agent
                header: agent
              - name: value
                header: count
                sort: desc
                enableSorting: true
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum by (detector, action, user, agent) (parasol_guardrails_detections_total{user=~"$user", agent=~"$agent"})
                  seriesNameFormat: ''
      guardScore:
        kind: Panel
        spec:
          display:
            name: Guardrail last score by detector and action
            description: 'max by (detector, action, user, agent) (parasol_guardrails_score): the score of the latest detection (regex and topic score 1.0)'
          plugin:
            kind: Table
            spec:
              density: compact
              columnSettings:
              - name: timestamp
                hide: true
              - name: detector
                header: detector
              - name: action
                header: action
              - name: user
                header: user
              - name: agent
                header: agent
              - name: value
                header: score
                sort: desc
                enableSorting: true
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: max by (detector, action, user, agent) (parasol_guardrails_score{user=~"$user", agent=~"$agent"})
                  seriesNameFormat: ''
      guardSeries:
        kind: Panel
        spec:
          display:
            name: Guardrail hits over time (cumulative)
            description: sum by (detector, action) (parasol_guardrails_detections_total)
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: right
              visual:
                display: line
                lineWidth: 1.5
                areaOpacity: 0.2
              yAxis:
                format:
                  unit: decimal
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum by (detector, action) (parasol_guardrails_detections_total{user=~"$user", agent=~"$agent"})
                  seriesNameFormat: '{{detector}} {{action}}'
      alertState:
        kind: Panel
        spec:
          display:
            name: 'ParasolAssistantTokenSpendHigh: alert state per user and agent'
            description: 'ALERTS{alertname="ParasolAssistantTokenSpendHigh"}: 1 while pending or firing'
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: right
              visual:
                display: line
                lineWidth: 1.5
                areaOpacity: 0.2
              yAxis:
                format:
                  unit: decimal
              thresholds:
                steps:
                - value: 1
                  color: '#d9534f'
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: max by (alertstate, user, agent, namespace) (ALERTS{alertname="ParasolAssistantTokenSpendHigh"})
                  seriesNameFormat: '{{alertstate}} {{user}} via {{agent}}'
      ragRetrievals:
        kind: Panel
        spec:
          display:
            name: Knowledge-base searches by user, agent and environment
            description: 'sum by (user, agent, env) (parasol_rag_retrievals_total): one count per search_knowledge call, retrieval runs as the user'
          plugin:
            kind: Table
            spec:
              density: compact
              columnSettings:
              - name: timestamp
                hide: true
              - name: user
                header: user
              - name: agent
                header: agent
              - name: env
                header: env
              - name: value
                header: count
                sort: desc
                enableSorting: true
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum by (user, agent, env) (parasol_rag_retrievals_total{user=~"$user", agent=~"$agent"})
                  seriesNameFormat: ''
      ragWithheld:
        kind: Panel
        spec:
          display:
            name: Passages withheld by classification, user and agent
            description: 'sum by (classification, user, agent) (parasol_rag_withheld_total): matching passages the user may not read (never returned, never in the model context)'
          plugin:
            kind: Table
            spec:
              density: compact
              columnSettings:
              - name: timestamp
                hide: true
              - name: classification
                header: classification
              - name: user
                header: user
              - name: agent
                header: agent
              - name: value
                header: count
                sort: desc
                enableSorting: true
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum by (classification, user, agent) (parasol_rag_withheld_total{user=~"$user", agent=~"$agent"})
                  seriesNameFormat: ''
      ragRestricted:
        kind: Panel
        spec:
          display:
            name: Restricted documents read, by document, user and agent
            description: 'sum by (doc_id, user, agent) (parasol_rag_restricted_access_total): every restricted (claims managers only) document returned; the server log has one audit line per access'
          plugin:
            kind: Table
            spec:
              density: compact
              columnSettings:
              - name: timestamp
                hide: true
              - name: doc_id
                header: doc_id
              - name: user
                header: user
              - name: agent
                header: agent
              - name: value
                header: count
                sort: desc
                enableSorting: true
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum by (doc_id, user, agent) (parasol_rag_restricted_access_total{user=~"$user", agent=~"$agent"})
                  seriesNameFormat: ''
      ragWithheldSeries:
        kind: Panel
        spec:
          display:
            name: Passages withheld over time by classification (cumulative)
            description: sum by (classification) (parasol_rag_withheld_total)
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: right
              visual:
                display: line
                lineWidth: 1.5
                areaOpacity: 0.2
              yAxis:
                format:
                  unit: decimal
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum by (classification) (parasol_rag_withheld_total{user=~"$user", agent=~"$agent"})
                  seriesNameFormat: '{{classification}}'
      toolServers:
        kind: Panel
        spec:
          display:
            name: 'MCP servers seen by the tool scanner (tools, version, registered on the gateway)'
            description: 'parasol_mcp_tool_scan_tools: registered=true is federated by the MCP gateway (MCPServerRegistration), false is a candidate nobody registered'
          plugin:
            kind: Table
            spec:
              density: compact
              columnSettings:
              - name: timestamp
                hide: true
              - name: server
                header: server
              - name: registered
                header: registered
              - name: version
                header: version
              - name: value
                header: tools
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: max by (server, registered, version) (parasol_mcp_tool_scan_tools)
                  seriesNameFormat: ''
      toolFindings:
        kind: Panel
        spec:
          display:
            name: Tool descriptions with instructions for the assistant
            description: 'parasol_mcp_tool_description_findings: one row per tool and matching rule (guardrails-rules patterns, scanner rules, names of other servers tools). Log: oc logs -n mcp-system deploy/mcp-tool-scanner | grep action=flag'
          plugin:
            kind: Table
            spec:
              density: compact
              columnSettings:
              - name: timestamp
                hide: true
              - name: server
                header: server
              - name: registered
                header: registered
              - name: tool
                header: tool
              - name: source
                header: source
              - name: rule
                header: rule
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: max by (server, registered, tool, source, rule) (parasol_mcp_tool_description_findings) > 0
                  seriesNameFormat: ''
      toolDrift:
        kind: Panel
        spec:
          display:
            name: 'Tool definitions against the pin reviewed in Git (1 = drift, possible rug pull)'
            description: 'parasol_mcp_tool_definition_drift: sha256 of name, description and schema vs annotation parasol.example/tools-sha256; pin=none means nothing was pinned. Alert MCPToolDefinitionDrift'
          plugin:
            kind: Table
            spec:
              density: compact
              columnSettings:
              - name: timestamp
                hide: true
              - name: server
                header: server
              - name: registered
                header: registered
              - name: pin
                header: pin
              - name: value
                header: drift
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: max by (server, registered, pin) (parasol_mcp_tool_definition_drift)
                  seriesNameFormat: ''
    layouts:
    - kind: Grid
      spec:
        display:
          title: 'Token spend: who, through which agent (Scenario 4)'
        items:
        - content:
            $ref: '#/spec/panels/spendRate'
          x: 0
          y: 0
          width: 16
          height: 9
        - content:
            $ref: '#/spec/panels/spendTable'
          x: 16
          y: 0
          width: 8
          height: 9
        - content:
            $ref: '#/spec/panels/alertState'
          x: 0
          y: 9
          width: 24
          height: 6
        - content:
            $ref: '#/spec/panels/modelCalls'
          x: 0
          y: 15
          width: 12
          height: 8
        - content:
            $ref: '#/spec/panels/latencyP95'
          x: 12
          y: 15
          width: 12
          height: 8
    - kind: Grid
      spec:
        display:
          title: 'Gateway decisions: tools and rejections (Scenarios 1 and 4)'
        items:
        - content:
            $ref: '#/spec/panels/rejectTable'
          x: 0
          y: 0
          width: 12
          height: 8
        - content:
            $ref: '#/spec/panels/rejectNote'
          x: 12
          y: 0
          width: 12
          height: 8
        - content:
            $ref: '#/spec/panels/rejectSeries'
          x: 0
          y: 8
          width: 12
          height: 8
        - content:
            $ref: '#/spec/panels/toolTable'
          x: 12
          y: 8
          width: 12
          height: 8
        - content:
            $ref: '#/spec/panels/toolStatus'
          x: 0
          y: 16
          width: 24
          height: 6
    - kind: Grid
      spec:
        display:
          title: Guardrails (Scenarios 2, 3 and 4)
        items:
        - content:
            $ref: '#/spec/panels/guardHits'
          x: 0
          y: 0
          width: 12
          height: 8
        - content:
            $ref: '#/spec/panels/guardScore'
          x: 12
          y: 0
          width: 12
          height: 8
        - content:
            $ref: '#/spec/panels/guardSeries'
          x: 0
          y: 8
          width: 24
          height: 7
    - kind: Grid
      spec:
        display:
          title: 'Knowledge base: retrieval as the user (Scenario 3)'
        items:
        - content:
            $ref: '#/spec/panels/ragRetrievals'
          x: 0
          y: 0
          width: 12
          height: 8
        - content:
            $ref: '#/spec/panels/ragWithheld'
          x: 12
          y: 0
          width: 12
          height: 8
        - content:
            $ref: '#/spec/panels/ragRestricted'
          x: 0
          y: 8
          width: 12
          height: 8
        - content:
            $ref: '#/spec/panels/ragWithheldSeries'
          x: 12
          y: 8
          width: 12
          height: 8
    - kind: Grid
      spec:
        display:
          title: 'Tool supply chain: what MCP servers tell the model (Scenario 6)'
        items:
        - content:
            $ref: '#/spec/panels/toolServers'
          x: 0
          y: 0
          width: 12
          height: 8
        - content:
            $ref: '#/spec/panels/toolDrift'
          x: 12
          y: 0
          width: 12
          height: 8
        - content:
            $ref: '#/spec/panels/toolFindings'
          x: 0
          y: 8
          width: 24
          height: 8
