apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Perses token dashboard. The Monitoring UIPlugin stands up the COO Perses backend (openshift-operators); the dashboard
# and its datasource live in parasol-secured, the project they describe.
resources:
  - uiplugin.yaml
  - parasol-datasource.yaml
  - parasol-tokens-dashboard.yaml
