# TEMPLATE rendered by scripts/supply-chain.sh with this cluster's values (envsubst):
#   TUF_URL, TUF_ROOT_B64 (base64 of the TUF root.json), FULCIO_URL, REKOR_URL, OIDC_ISSUER (SPIRE OIDC discovery).
# Admission trust for Red Hat Trusted Artifact Signer (Securesign): one signer, Tekton Chains, keyless.
apiVersion: policy.sigstore.dev/v1alpha1
kind: TrustRoot
metadata:
  name: parasol-tas
spec:
  remote:
    mirror: ${TUF_URL}
    targets: targets
    root: ${TUF_ROOT_B64}
---
# parasol-portal admission. Enforced on policy.rhtas.com/include=true namespaces. One authority, chains-keyless: a
# signature by Tekton Chains (certificate from Fulcio for the Chains controller's SPIFFE ID) with its entry in Rekor.
# Rekor's entry time proves the signature was made while the 10-minute certificate was valid, so the image stays
# admissible after the certificate expires.
apiVersion: policy.sigstore.dev/v1beta1
kind: ClusterImagePolicy
metadata:
  name: parasol-portal-must-be-signed
spec:
  images:
    - glob: "image-registry.openshift-image-registry.svc:5000/parasol-build/parasol-portal**"
  authorities:
    - name: chains-keyless
      keyless:
        url: ${FULCIO_URL}
        trustRootRef: parasol-tas
        identities:
          - issuer: "${OIDC_ISSUER}"
            subject: "spiffe://parasol-demo/ns/openshift-pipelines/sa/tekton-chains-controller"
      ctlog:
        url: ${REKOR_URL}
        trustRootRef: parasol-tas
---
# Showcase 7: third-party images run in parasol-secured only as onboarded. The parasol-tool-onboarding pipeline builds
# Parasol's image FROM the checked vendor digest after its checks pass, and Tekton Chains signs that build like any
# other. The partner bank's own images (even its validly published 1.4.3) carry no Parasol signature, so admission
# refuses them here.
apiVersion: policy.sigstore.dev/v1beta1
kind: ClusterImagePolicy
metadata:
  name: parasol-vendor-tools-must-be-onboarded
spec:
  images:
    - glob: "image-registry.openshift-image-registry.svc:5000/parasol-build/currency-converter**"
  authorities:
    - name: chains-keyless
      keyless:
        url: ${FULCIO_URL}
        trustRootRef: parasol-tas
        identities:
          - issuer: "${OIDC_ISSUER}"
            subject: "spiffe://parasol-demo/ns/openshift-pipelines/sa/tekton-chains-controller"
      ctlog:
        url: ${REKOR_URL}
        trustRootRef: parasol-tas
