# TEMPLATE rendered by scripts/supply-chain.sh with this cluster's values (envsubst):
#   TUF_URL, TUF_ROOT_B64 (base64 of the TUF root.json), OIDC_ISSUER (SPIRE OIDC discovery),
#   ONBOARDING_PUB (the onboarding key's public key, indented to 10 spaces). The Tekton Chains key is not trusted
#   at admission (Conforma checks it before promote).
# Keyless admission trust for Red Hat Trusted Artifact Signer (Securesign).
apiVersion: policy.sigstore.dev/v1alpha1
kind: TrustRoot
metadata:
  name: parasol-tas
spec:
  remote:
    mirror: ${TUF_URL}
    targets: targets
    root: ${TUF_ROOT_B64}
---
# parasol-portal admission. Enforced on policy.rhtas.com/include=true namespaces. One authority, keyless-tas: a keyless
# cosign signature by the release pipeline's SPIFFE identity (certificate from Fulcio), with an RFC 3161 timestamp from
# the Trusted Artifact Signer time-stamp server (TSA, in the TrustRoot from TUF). The timestamp proves the signature
# was made while the 10-minute certificate was valid, so the image stays admissible after the certificate expires.
# The Tekton Chains key is not accepted here; Conforma checks Chains' signature and provenance before promote.
apiVersion: policy.sigstore.dev/v1beta1
kind: ClusterImagePolicy
metadata:
  name: parasol-portal-must-be-signed
spec:
  images:
    - glob: "image-registry.openshift-image-registry.svc:5000/parasol-build/parasol-portal**"
  authorities:
    - name: keyless-tas
      keyless:
        trustRootRef: parasol-tas
        identities:
          - issuer: "${OIDC_ISSUER}"
            subject: "spiffe://parasol-demo/ns/parasol-build/sa/keyless-signer"
      ctlog:
        trustRootRef: parasol-tas
      rfc3161timestamp:
        trustRootRef: parasol-tas
---
# Showcase 7: third-party images run in parasol-secured only as onboarded. The parasol-tool-onboarding pipeline signs a
# vendor image with the onboarding key (parasol-build/parasol-onboarding-key) after its checks pass; the partner bank's
# own images (even its validly published 1.4.3) carry no Parasol signature, so admission refuses them here. The build
# key (Tekton Chains) is not accepted for vendor images, and the onboarding key is not accepted for the portal.
apiVersion: policy.sigstore.dev/v1beta1
kind: ClusterImagePolicy
metadata:
  name: parasol-vendor-tools-must-be-onboarded
spec:
  images:
    - glob: "image-registry.openshift-image-registry.svc:5000/parasol-build/currency-converter**"
  authorities:
    - name: parasol-onboarding-key
      key:
        data: |
${ONBOARDING_PUB}
