# TEMPLATE rendered by scripts/supply-chain.sh with this cluster's values (envsubst):
#   TUF_URL, TUF_ROOT_B64 (base64 of the TUF root.json), OIDC_ISSUER (SPIRE OIDC discovery),
#   COSIGN_PUB (the Tekton Chains cosign public key, indented to 10 spaces).
# Keyless admission trust for Red Hat Trusted Artifact Signer (Securesign).
apiVersion: policy.sigstore.dev/v1alpha1
kind: TrustRoot
metadata:
  name: parasol-tas
spec:
  remote:
    mirror: ${TUF_URL}
    targets: targets
    root: ${TUF_ROOT_B64}
---
# parasol-portal admission. Enforced on policy.rhtas.com/include=true namespaces. Two OR-ed authorities:
#   - keyless-tas: keyless cosign signature (Fulcio+Rekor) by the pipeline SPIFFE identity.
#   - cluster-cosign-key: the cluster keypair Tekton Chains signs with; keeps the running portal
#     admitted after its short-lived Fulcio certificate expires (no trusted timestamp is wired).
apiVersion: policy.sigstore.dev/v1beta1
kind: ClusterImagePolicy
metadata:
  name: parasol-portal-must-be-signed
spec:
  images:
    - glob: "image-registry.openshift-image-registry.svc:5000/parasol-build/parasol-portal**"
  authorities:
    - name: keyless-tas
      keyless:
        trustRootRef: parasol-tas
        identities:
          - issuer: "${OIDC_ISSUER}"
            subject: "spiffe://parasol-demo/ns/parasol-build/sa/keyless-signer"
      ctlog:
        trustRootRef: parasol-tas
    - name: cluster-cosign-key
      key:
        data: |
${COSIGN_PUB}
