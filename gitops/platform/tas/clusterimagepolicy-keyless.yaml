# Keyless admission trust for Red Hat Trusted Artifact Signer (Securesign).
apiVersion: policy.sigstore.dev/v1alpha1
kind: TrustRoot
metadata:
  name: parasol-tas
spec:
  remote:
    mirror: https://tuf-trusted-artifact-signer.apps.cluster-znh6n.dyn.redhatworkshops.io
    targets: targets
    root: 
---
# parasol-portal admission. Enforced on policy.rhtas.com/include=true namespaces. Two OR-ed
# authorities during the keyless transition:
#   - keyless-tas: keyless cosign signature (Fulcio+Rekor+TSA) by the pipeline SPIFFE identity.
#   - cluster-cosign-key: legacy keypair; retained so the running portal is admitted on restart
#     even if a keyless Fulcio cert has expired without a trusted timestamp. Dropped once the
#     TSA-backed keyless path is confirmed to admit the running image durably.
apiVersion: policy.sigstore.dev/v1beta1
kind: ClusterImagePolicy
metadata:
  name: parasol-portal-must-be-signed
spec:
  images:
    - glob: "image-registry.openshift-image-registry.svc:5000/parasol-build/parasol-portal**"
  authorities:
    - name: keyless-tas
      keyless:
        trustRootRef: parasol-tas
        identities:
          - issuer: "https://oidc-discovery.apps.cluster-znh6n.dyn.redhatworkshops.io"
            subject: "spiffe://parasol-demo/ns/parasol-build/sa/keyless-signer"
      ctlog:
        trustRootRef: parasol-tas
    - name: cluster-cosign-key
      key:
        data: |
          -----BEGIN PUBLIC KEY-----
          MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEwRuUMuT2/oNKZ2J0BHwU3fP2yC7i
          alcI0flhp06867dBqk9emjdvcj4W3BkB+PU5wa4fT1IcfYdRpVNg8sfr4w==
          -----END PUBLIC KEY-----
