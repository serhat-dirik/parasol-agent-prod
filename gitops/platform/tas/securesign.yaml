# Red Hat Trusted Artifact Signer (Securesign) - the keyless signing backend for the pipeline.
# Fulcio (CA), Rekor (transparency log), CTlog, Trillian (DB), TUF (trust root).
# OIDC issuer = SPIRE's OIDC discovery provider (gitops/platform/workload-identity), type spiffe: the
# pipeline's keyless-signer pod presents a SPIFFE JWT-SVID (audience trusted-artifact-signer) and Fulcio
# issues a short-lived signing certificate for spiffe://parasol-demo/ns/parasol-build/sa/keyless-signer.
# Applied by scripts/supply-chain.sh: envsubst '$CLUSTER_DOMAIN' < securesign.yaml | oc apply -f -
apiVersion: v1
kind: Namespace
metadata:
  name: trusted-artifact-signer
---
apiVersion: rhtas.redhat.com/v1
kind: Securesign
metadata:
  name: securesign
  namespace: trusted-artifact-signer
  labels:
    app.kubernetes.io/part-of: trusted-artifact-signer
spec:
  fulcio:
    config:
      oidcIssuers:
        - issuer: https://oidc-discovery.apps.${CLUSTER_DOMAIN}
          issuerURL: https://oidc-discovery.apps.${CLUSTER_DOMAIN}
          clientID: trusted-artifact-signer
          type: spiffe
          spiffeTrustDomain: parasol-demo
    ingress:
      enabled: true
    signer:
      certificateChain:
        organizationName: Parasol
        organizationEmail: security@parasol.example
        commonName: fulcio.parasol.example
  rekor:
    ingress:
      enabled: true
  ctlog: {}
  trillian:
    database:
      create: true
  tuf:
    ingress:
      enabled: true
  # Timestamp Authority: issues RFC3161 signed timestamps so keyless signatures remain verifiable
  # after the short-lived Fulcio certificate expires. NOTE: to make admission (policy-controller)
  # trust TSA timestamps, the TUF trust root must be regenerated to include the TSA cert chain
  # (re-init the TUF repository); until then admission trusts keyless only while the Fulcio cert is
  # unexpired, and the cluster-cosign-key authority covers durable admission of the running image.
  tsa:
    ingress:
      enabled: true
    signer:
      certificateChain:
        rootCA: {organizationName: Parasol, commonName: tsa-root.parasol}
        intermediateCA:
          - {organizationName: Parasol, commonName: tsa-int.parasol}
        leafCA: {organizationName: Parasol, commonName: tsa.parasol}
