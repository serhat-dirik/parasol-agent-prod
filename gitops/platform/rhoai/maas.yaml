# Models-as-a-Service governance (OpenShift AI 3.5.1; external models are Technology Preview).
# The lab's LiteLLM endpoint is registered as an external provider + model so that the on-cluster MaaS
# gateway fronts it: subscriptions (token allowance per window) and auth policies (who may call which
# model) are enforced here. Field names verified against the installed 3.5.1 CRD schemas (server dry run).
# Needs: Gateway openshift-ingress/maas-default-gateway (maas-gateway.yaml); Secret
# maas-upstream-api-key with data key "api-key" (created at run time, never committed).
apiVersion: maas.opendatahub.io/v1alpha1
kind: ExternalModel
metadata:
  name: llama-scout-17b
  namespace: models-as-a-service
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider: openai                  # OpenAI-compatible
  endpoint: maas.invalid.example    # FQDN only; the Argo Application patches /spec/endpoint with $MAAS_HOST
  targetModel: llama-scout-17b
  credentialRef: {name: maas-upstream-api-key}
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSModelRef
metadata:
  name: llama-scout-17b
  namespace: models-as-a-service
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  modelRef: {kind: ExternalModel, name: llama-scout-17b}
---
# Who may call what.
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: parasol-access
  namespace: models-as-a-service
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  subjects:
    groups: [{name: developers}, {name: parasol-stage}, {name: parasol-prod}, {name: "system:serviceaccounts:parasol-secured"}]
  modelRefs:
    - {name: llama-scout-17b, namespace: models-as-a-service}
---
# How much. The stage allowance is deliberately small: the "3am" clip exhausts it in minutes.
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: parasol-stage
  namespace: models-as-a-service
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  owner:
    groups: [{name: parasol-stage}, {name: developers}, {name: "system:serviceaccounts:parasol-secured"}]
  priority: 50
  modelRefs:
    - name: llama-scout-17b
      namespace: models-as-a-service
      tokenRateLimits:
        - {limit: 200000, window: 10m}   # demo stage allowance: rehearsals fit, the v3 storm trips the alert first, then 429
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: parasol-prod
  namespace: models-as-a-service
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  owner:
    groups: [{name: parasol-prod}]
  priority: 100
  modelRefs:
    - name: llama-scout-17b
      namespace: models-as-a-service
      tokenRateLimits:
        - {limit: 2000000, window: 24h}
