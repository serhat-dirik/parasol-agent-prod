# Models-as-a-Service governance (OpenShift AI 3.5; external model egress is Technology Preview).
# The external MaaS endpoint is registered as a provider/model so that the on-cluster MaaS gateway
# fronts it: subscriptions (token allowance per time window) and auth policies (who may call which
# model) are enforced here, and usage shows up in the MaaS observability dashboard.
# Field names below follow the 3.5 docs and the MaaS governance blog; VERIFY with
#   oc explain externalprovider.spec ; oc explain externalmodel.spec ; oc explain maassubscription.spec ; oc explain maasauthpolicy.spec
apiVersion: maas.opendatahub.io/v1alpha1
kind: ExternalProvider
metadata:
  name: parasol-maas-upstream
  namespace: models-as-a-service
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  providerType: openai            # OpenAI-compatible
  baseURL: MAAS_UPSTREAM_URL      # set by bootstrap.sh from $MAAS_ENDPOINT
  credentialSecretRef:
    name: maas-upstream-credentials
    key: apiKey
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: ExternalModel
metadata:
  name: qwen3-14b
  namespace: models-as-a-service
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  providerRef: {name: parasol-maas-upstream}
  modelID: qwen3-14b
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: ExternalModel
metadata:
  name: llama-scout-17b
  namespace: models-as-a-service
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  providerRef: {name: parasol-maas-upstream}
  modelID: llama-scout-17b
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: ExternalModel
metadata:
  name: qwen3-235b
  namespace: models-as-a-service
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  providerRef: {name: parasol-maas-upstream}
  modelID: qwen3-235b
---
# Who may call what. Developers and the stage agent: the small models only. Production: the big one too.
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: parasol-dev-access
  namespace: models-as-a-service
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  subjects:
    groups: [developers, parasol-stage]
  models:
    - {name: qwen3-14b, namespace: models-as-a-service}
    - {name: llama-scout-17b, namespace: models-as-a-service}
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: parasol-prod-access
  namespace: models-as-a-service
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  subjects:
    groups: [parasol-prod]
  models:
    - {name: qwen3-14b, namespace: models-as-a-service}
    - {name: llama-scout-17b, namespace: models-as-a-service}
    - {name: qwen3-235b, namespace: models-as-a-service}
---
# How much. The stage allowance is deliberately small: the "3am" clip exhausts it in two minutes.
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: parasol-stage
  namespace: models-as-a-service
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  description: Parasol agent, stage tier (demo-sized allowance)
  owners:
    groups: [parasol-stage, developers]
  priority: 50
  tokenLimits:
    - tokens: 20000
      window: 1h
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: parasol-prod
  namespace: models-as-a-service
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  description: Parasol agent, production tier
  owners:
    groups: [parasol-prod]
  priority: 100
  tokenLimits:
    - tokens: 2000000
      window: 24h
