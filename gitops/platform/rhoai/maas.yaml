# Models-as-a-Service governance (OpenShift AI 3.5.1; external models are Technology Preview).
# The lab's LiteLLM endpoint is registered as an external provider + model so that the on-cluster MaaS
# gateway fronts it: subscriptions (token allowance per window) and auth policies (who may call which
# model) are enforced here. Field names verified against the installed 3.5.1 CRD schemas (server dry run).
# Needs: Gateway openshift-ingress/maas-default-gateway (maas-gateway.yaml); Secret
# maas-upstream-agent with data key "api-key" (created at run time by scripts/maas-ext-model-secrets.sh,
# never committed).
#
# qwen3-14b is THE agent model: both the free and the secured portal run on it. It obeys the injected
# "processing note", so the secured side proves that the CONTROLS (identity-bound tool authz +
# Read-Propose-Act), not model luck, stop the payout. The Argo Application patches /spec/endpoint
# with $AGENT_HOST and /spec/targetModel with $AGENT_MODEL; upstream key Secret maas-upstream-agent (data key "api-key", label
# inference.llm-d.ai/ipp-managed=true) created at run time, never committed.
#
# Object names follow the install settings: the agent model's objects are named AGENT_MODEL_NAME and the
# judge's JUDGE_MODEL_NAME (DNS-1123 form of AGENT_MODEL / JUDGE_MODEL, as bootstrap.sh derives
# GUARD_MODEL_NAME). Below, qwen3-14b and gpt-oss-120b are the tested defaults; kustomization.yaml copies
# the names from this local ConfigMap (never applied) and the Argo Application patches its values.
# Clients send the object name as "model" (MaaS maps it to targetModel).
apiVersion: v1
kind: ConfigMap
metadata:
  name: parasol-model-names
  annotations:
    config.kubernetes.io/local-config: "true"
data:
  agent: qwen3-14b      # AGENT_MODEL_NAME
  judge: gpt-oss-120b   # JUDGE_MODEL_NAME
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: ExternalModel
metadata:
  name: qwen3-14b
  namespace: models-as-a-service
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider: openai
  endpoint: maas.invalid.example    # FQDN only; the Argo Application patches /spec/endpoint with $AGENT_HOST
  targetModel: qwen3-14b
  credentialRef: {name: maas-upstream-agent}
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSModelRef
metadata:
  name: qwen3-14b
  namespace: models-as-a-service
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  modelRef: {kind: ExternalModel, name: qwen3-14b}
---
# The evaluation judge (JUDGE_MODEL): release-gate judging and the AgenticOps sampled judge go through
# MaaS on subscription parasol-eval, so they are metered like every other controlled model call.
# The Argo Application patches /spec/endpoint with $JUDGE_HOST and /spec/targetModel with $JUDGE_MODEL;
# upstream key Secret maas-upstream-judge (data key "api-key", from JUDGE_KEY) by scripts/maas-ext-model-secrets.sh.
apiVersion: maas.opendatahub.io/v1alpha1
kind: ExternalModel
metadata:
  name: gpt-oss-120b
  namespace: models-as-a-service
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider: openai
  endpoint: maas.invalid.example    # FQDN only; the Argo Application patches /spec/endpoint with $JUDGE_HOST
  targetModel: gpt-oss-120b
  credentialRef: {name: maas-upstream-judge}
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSModelRef
metadata:
  name: gpt-oss-120b
  namespace: models-as-a-service
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  modelRef: {kind: ExternalModel, name: gpt-oss-120b}
---
# Who may call what.
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: parasol-access
  namespace: models-as-a-service
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  subjects:
    groups: [{name: developers}, {name: parasol-stage}, {name: "system:serviceaccounts:parasol-secured"}]
  modelRefs:
    - {name: qwen3-14b, namespace: models-as-a-service}
---
# How much. The stage allowance is deliberately small: the "3am" clip exhausts it in minutes.
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: parasol-stage
  namespace: models-as-a-service
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  owner:
    groups: [{name: parasol-stage}, {name: developers}, {name: "system:serviceaccounts:parasol-secured"}]
  priority: 50
  modelRefs:
    - name: qwen3-14b                     # the agent model; demo stage allowance
      namespace: models-as-a-service
      tokenRateLimits:
        - {limit: 200000, window: 10m}   # rehearsals fit, the v3 storm trips the alert first, then 429
---
# Contractor tier (Demo 3): the secured portal mints a separate key on this subscription for users in
# the Keycloak group `contractors` (nina.contractor). Its allowance is tiny, so a "3am" storm trips 429 on
# this bucket alone while staff (stage subscription) keep working. Per-subscription counter -> isolated 429.
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: parasol-contractor
  namespace: models-as-a-service
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  owner:
    groups: [{name: parasol-contractor}, {name: "system:serviceaccounts:parasol-secured"}]
  priority: 10
  modelRefs:
    - name: qwen3-14b
      namespace: models-as-a-service
      tokenRateLimits:
        - {limit: 20000, window: 10m}   # contractor allowance: a short night-shift storm exhausts it on camera
---
# Release evaluation (Scenario 5): the agent-eval gate generates every golden-set answer live with qwen3-14b
# through this gateway, as the release pipeline's identity (ServiceAccounts of parasol-build), on its OWN
# subscription: eval traffic is metered apart from staff and contractors and can never spend their allowance.
# Budget (measured): one prompt = 23 cases x 3 attempts x 2 modes (with the platform, model alone) = about
# 0.6M tokens, 7-11 min; an install's seed (2 prompts) plus both release runs = about 2.4M, so 6M per hour leaves
# room for a re-run without a 429. Key minted by scripts/maas-eval-key.sh (Secret parasol-build/maas-eval-agent-key).
# The judge (JUDGE_MODEL) is on the same subscription with its own allowance and its own keys (Secrets
# parasol-build/maas-eval-key for the release gate, observability/agenticops-judge-key for the AgenticOps job):
# one judged prompt is about 70 calls, about 0.2M tokens.
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: parasol-eval-access
  namespace: models-as-a-service
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  subjects:
    groups: [{name: "system:serviceaccounts:parasol-build"}]
  modelRefs:
    - {name: qwen3-14b, namespace: models-as-a-service}
    - {name: gpt-oss-120b, namespace: models-as-a-service}
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: parasol-eval
  namespace: models-as-a-service
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  owner:
    groups: [{name: "system:serviceaccounts:parasol-build"}]
  priority: 30
  modelRefs:
    - name: qwen3-14b
      namespace: models-as-a-service
      tokenRateLimits:
        - {limit: 6000000, window: 1h}
    - name: gpt-oss-120b                  # the judge
      namespace: models-as-a-service
      tokenRateLimits:
        - {limit: 3000000, window: 1h}
