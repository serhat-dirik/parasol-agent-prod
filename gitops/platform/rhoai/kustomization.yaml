apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# OpenShift AI pieces. The DataScienceCluster and OdhDashboardConfig already exist once the operator
# is installed, so they are PATCHED by bootstrap.sh (oc patch, see scripts/rhoai-enable.sh) rather than
# owned by Argo. What Argo owns here: the MaaS governance objects (Technology Preview).
resources:
  - maas-gateway.yaml
  - maas.yaml
  - maas-db.yaml
  - model-governance.yaml
# MaaS object names follow the install settings (ConfigMap parasol-model-names in maas.yaml, patched by the
# Argo Application). Patches run before replacements, so the Application's patches still select the defaults.
replacements:
  - source: {kind: ConfigMap, name: parasol-model-names, fieldPath: data.agent}
    targets:
      - select: {kind: ExternalModel, name: qwen3-14b}
        fieldPaths: [metadata.name]
      - select: {kind: MaaSModelRef, name: qwen3-14b}
        fieldPaths: [metadata.name, spec.modelRef.name]
      - select: {kind: MaaSAuthPolicy}
        fieldPaths: ["spec.modelRefs.[name=qwen3-14b].name"]
      - select: {kind: MaaSSubscription}
        fieldPaths: ["spec.modelRefs.[name=qwen3-14b].name"]
  - source: {kind: ConfigMap, name: parasol-model-names, fieldPath: data.judge}
    targets:
      - select: {kind: ExternalModel, name: gpt-oss-120b}
        fieldPaths: [metadata.name]
      - select: {kind: MaaSModelRef, name: gpt-oss-120b}
        fieldPaths: [metadata.name, spec.modelRef.name]
      - select: {kind: MaaSAuthPolicy, name: parasol-eval-access}
        fieldPaths: ["spec.modelRefs.[name=gpt-oss-120b].name"]
      - select: {kind: MaaSSubscription, name: parasol-eval}
        fieldPaths: ["spec.modelRefs.[name=gpt-oss-120b].name"]
