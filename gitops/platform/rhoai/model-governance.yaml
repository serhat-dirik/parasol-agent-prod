# Layer 5, model governance: the secured agent reaches the model only through this Gateway, where a
# Connectivity Link TokenRateLimitPolicy meters the tokens the model reports (usage.total_tokens) and
# answers 429 once the stage allowance is spent. This is the same mechanism OpenShift AI MaaS generates
# (maas-trlp-*); the MaaS API itself needs Authorino listener TLS, which the installed Kuadrant does not
# wire into the gateways yet, so the policy is declared here directly.
# Path: agent -> model-gateway (this ns) -> guardrails-proxy (parasol-secured) -> MaaS.
apiVersion: v1
kind: Namespace
metadata:
  name: parasol-model-gateway
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: model-gateway-config
  namespace: parasol-model-gateway
data:
  service: |
    spec:
      type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: model-gateway
  namespace: parasol-model-gateway
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  gatewayClassName: openshift-default
  infrastructure:
    parametersRef: {group: "", kind: ConfigMap, name: model-gateway-config}
  listeners:
    - name: http
      port: 8080
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels: {kubernetes.io/metadata.name: parasol-secured}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: parasol-model
  namespace: parasol-secured
spec:
  parentRefs:
    - {group: gateway.networking.k8s.io, kind: Gateway, name: model-gateway, namespace: parasol-model-gateway}
  rules:
    - matches:
        - path: {type: PathPrefix, value: /v1}
      backendRefs:
        - {group: "", kind: Service, name: guardrails-proxy, port: 8080, weight: 1}
---
# Stage allowance for the secured agent. Generous for a demo session, but the v3 retry storm
# (~120k tokens/min) crosses the spend alert (20000 tokens/min for 1 min) first and then gets 429s.
apiVersion: kuadrant.io/v1alpha1
kind: TokenRateLimitPolicy
metadata:
  name: parasol-model-stage
  namespace: parasol-secured
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  targetRef: {group: gateway.networking.k8s.io, kind: HTTPRoute, name: parasol-model}
  limits:
    stage-allowance:
      rates:
        - {limit: 200000, window: 10m}
---
# Additive to the env's `guardrails` policy: the proxy also accepts the model gateway.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: guardrails-proxy-from-model-gateway
  namespace: parasol-secured
spec:
  podSelector:
    matchLabels: {component: guardrails-proxy}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: parasol-model-gateway}
