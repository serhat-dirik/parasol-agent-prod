# Layer 5, model governance. The secured agent reaches the model only through the guardrails proxy, then
# OpenShift AI MaaS (maas-default-gateway): MaaS checks the agent's MaaS API key, picks its subscription
# (parasol-stage) and meters tokens (429 when the allowance is spent). The agent never holds the upstream
# key; only MaaS does (Secret maas-upstream-api-key).
# Path: agent -> guardrails-proxy (parasol-secured) -> MaaS -> upstream. The kill switches act on MaaS
# itself (scripts/kill-switch.sh tier|parasol|break-glass), so there is no separate model gateway hop.
# The parasol-model-gateway namespace is empty and nothing depends on it; it goes in a later cleanup.
apiVersion: v1
kind: Namespace
metadata:
  name: parasol-model-gateway
---
# Identity the agent's MaaS API key is minted for (scripts/maas-key.sh). Its token carries the group
# system:serviceaccounts:parasol-secured, which MaaSAuthPolicy parasol-access and MaaSSubscription
# parasol-stage admit.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: parasol-model-client
  namespace: parasol-secured
---
# Additive to the env's `guardrails` policy (ingress from the agent only): the proxy is the model endpoint
# of the portal and the agent, and of the release evaluation's "system" mode (parasol-build). Port 8080 only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: guardrails-proxy-clients
  namespace: parasol-secured
spec:
  podSelector:
    matchLabels: {component: guardrails-proxy}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - {key: app, operator: In, values: [portal, parasol-agent]}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: parasol-build}
      ports:
        - {protocol: TCP, port: 8080}
