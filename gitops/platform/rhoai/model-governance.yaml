# Layer 5, model governance. The secured agent reaches the model only through this Gateway, then the
# guardrails proxy, then OpenShift AI MaaS (maas-default-gateway): MaaS checks the agent's MaaS API key,
# picks its subscription (parasol-stage) and meters tokens (429 when the allowance is spent). The agent
# never holds the upstream key; only MaaS does (Secret maas-upstream-api-key).
# Path: agent -> model-gateway (this ns) -> guardrails-proxy (parasol-secured) -> MaaS -> upstream.
# The model-gateway hop is what the kill switch cuts (agent egress), see envs/secured/kill-switch.
apiVersion: v1
kind: Namespace
metadata:
  name: parasol-model-gateway
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: model-gateway-config
  namespace: parasol-model-gateway
data:
  service: |
    spec:
      type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: model-gateway
  namespace: parasol-model-gateway
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  gatewayClassName: openshift-default
  infrastructure:
    parametersRef: {group: "", kind: ConfigMap, name: model-gateway-config}
  listeners:
    - name: http
      port: 8080
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels: {kubernetes.io/metadata.name: parasol-secured}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: parasol-model
  namespace: parasol-secured
spec:
  parentRefs:
    - {group: gateway.networking.k8s.io, kind: Gateway, name: model-gateway, namespace: parasol-model-gateway}
  rules:
    - matches:
        - path: {type: PathPrefix, value: /v1}
      backendRefs:
        - {group: "", kind: Service, name: guardrails-proxy, port: 8080, weight: 1}
---
# Identity the agent's MaaS API key is minted for (scripts/maas-key.sh). Its token carries the group
# system:serviceaccounts:parasol-secured, which MaaSAuthPolicy parasol-access and MaaSSubscription
# parasol-stage admit.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: parasol-model-client
  namespace: parasol-secured
---
# Additive to the env's `guardrails` policy: the proxy also accepts the model gateway.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: guardrails-proxy-from-model-gateway
  namespace: parasol-secured
spec:
  podSelector:
    matchLabels: {component: guardrails-proxy}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: parasol-model-gateway}
