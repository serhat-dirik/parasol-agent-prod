# The Gateway the MaaS platform attaches to (OpenShift AI 3.5 expects it to exist, created by an admin).
# In-cluster only (ClusterIP service, like the MCP gateway); TLS reuses the data-science gateway cert.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: maas-default-gateway
  namespace: openshift-ingress
spec:
  gatewayClassName: openshift-default
  listeners:
    - name: https
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs: [{kind: Secret, name: data-science-gateway-service-tls}]
      allowedRoutes:
        namespaces: {from: All}
