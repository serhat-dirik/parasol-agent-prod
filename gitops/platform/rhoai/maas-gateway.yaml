# The Gateway the MaaS platform attaches to (OpenShift AI 3.5 expects it to exist, created by an admin).
# No cloud load balancer on this cluster: ClusterIP Service (same pattern as the MCP gateway). The listener
# hostname is the Service's in-cluster name so MaaSModelRef derives a resolvable endpoint.
apiVersion: v1
kind: ConfigMap
metadata:
  name: maas-default-gateway-config
  namespace: openshift-ingress
data:
  service: |
    spec:
      type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: maas-default-gateway
  namespace: openshift-ingress
  annotations:
    security.opendatahub.io/authorino-tls-bootstrap: "true"   # TLS EnvoyFilter to Authorino
    opendatahub.io/managed: "false"                            # MaaS owns this gateway's AuthPolicies
spec:
  gatewayClassName: openshift-default
  infrastructure:
    parametersRef: {group: "", kind: ConfigMap, name: maas-default-gateway-config}
    # copied onto the generated Service: the OpenShift service CA issues a cert for its in-cluster name
    annotations:
      service.beta.openshift.io/serving-cert-secret-name: maas-default-gateway-tls
  listeners:
    # maas-api only accepts a gateway Service it owns that exposes 443 (ResolveGatewayInternalHost)
    - name: https
      hostname: maas-default-gateway-openshift-default.openshift-ingress.svc.cluster.local   # = the Service name: maas-api probes and the cert use it
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - {group: "", kind: Secret, name: maas-default-gateway-tls}
      allowedRoutes:
        namespaces: {from: All}
