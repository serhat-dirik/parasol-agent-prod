# The Gateway the MaaS platform attaches to (OpenShift AI 3.5 expects it to exist, created by an admin).
# No cloud load balancer on this cluster: ClusterIP Service (same pattern as the MCP gateway), in-cluster
# hostname so MaaSModelRef can derive its endpoint.
apiVersion: v1
kind: ConfigMap
metadata:
  name: maas-default-gateway-config
  namespace: openshift-ingress
data:
  service: |
    spec:
      type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: maas-default-gateway
  namespace: openshift-ingress
spec:
  gatewayClassName: openshift-default
  infrastructure:
    parametersRef: {group: "", kind: ConfigMap, name: maas-default-gateway-config}
  listeners:
    - name: http
      hostname: maas.parasol.local
      port: 8080
      protocol: HTTP
      allowedRoutes:
        namespaces: {from: All}
