# MaaS tiers (demo item P1-MAAS-TIERS). Two named tiers, each a distinct external model + one API key:
#   parasol-tier-prod   -> qwen3-14b                (prod; THE agent model both portals run)
#   parasol-tier-guard  -> granite-guardian-3-1-8b  (guard; detector for P1-GUARDIAN)
#
# These are the only two models the demo actually exercises, so the "Models as a Service" dashboard lists
# exactly two external models, each on a tier with a budget and its own key. llama-scout-17b and
# granite-4-0-h-tiny were dropped (both portals run qwen; those two only populated the dashboard).
#
# MODELS: the lab LiteLLM endpoint serves these behind PER-MODEL keys (credentials file "MAAS keys"
# section; load-credentials.sh exports MAAS_KEY_QWEN3_14B and MAAS_KEY_GUARD). qwen3-14b's ExternalModel +
# MaaSModelRef are registered by the platform (platform-rhoai, gitops/platform/rhoai/maas.yaml);
# granite-guardian-3-1-8b is added here as an additional ExternalModel. Upstream API-key Secrets (data key
# api-key) are created out-of-band by scripts/maas-ext-model-secrets.sh (maas-upstream-qwen3-14b,
# maas-upstream-granite-guardian) and are never committed.
#
# Isolated + additive: own namespace parasol-maas-tiers owns the subscriptions (owner group
# system:serviceaccounts:parasol-maas-tiers), so scripts/maas-tier-keys.sh mints both keys from one pod
# WITHOUT touching the shared operational subscriptions (parasol-stage/policyholder). Applied imperatively
# (not Argo-wired). Priorities (111/71) differ from the operational 50/10.
apiVersion: v1
kind: Namespace
metadata:
  name: parasol-maas-tiers
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: maas-tier-client
  namespace: parasol-maas-tiers
---
# --- External model: granite-guardian-3-1-8b (guard tier). qwen3-14b's ExternalModel lives in
#     gitops/platform/rhoai/maas.yaml (platform-rhoai); only granite-guardian is declared here. ---
apiVersion: maas.opendatahub.io/v1alpha1
kind: ExternalModel
metadata:
  name: granite-guardian-3-1-8b
  namespace: models-as-a-service
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider: openai
  endpoint: maas-rhdp.apps.maas.redhatworkshops.io
  targetModel: granite-guardian-3-1-8b
  credentialRef: {name: maas-upstream-granite-guardian}
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSModelRef
metadata:
  name: granite-guardian-3-1-8b
  namespace: models-as-a-service
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  modelRef: {kind: ExternalModel, name: granite-guardian-3-1-8b}
---
# Who may call the tier models with a tier key.
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: parasol-tier-access
  namespace: models-as-a-service
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  subjects:
    groups:
      - {name: "system:serviceaccounts:parasol-maas-tiers"}
  modelRefs:
    - {name: qwen3-14b, namespace: models-as-a-service}
    - {name: granite-guardian-3-1-8b, namespace: models-as-a-service}
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: parasol-tier-prod
  namespace: models-as-a-service
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    parasol.io/tier: prod
spec:
  owner:
    groups: [{name: "system:serviceaccounts:parasol-maas-tiers"}]
  priority: 111
  modelRefs:
    - name: qwen3-14b
      namespace: models-as-a-service
      tokenRateLimits:
        - {limit: 2000000, window: 24h}
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: parasol-tier-guard
  namespace: models-as-a-service
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    parasol.io/tier: guard
spec:
  owner:
    groups: [{name: "system:serviceaccounts:parasol-maas-tiers"}]
  priority: 71
  modelRefs:
    - name: granite-guardian-3-1-8b
      namespace: models-as-a-service
      tokenRateLimits:
        - {limit: 100000, window: 10m}
