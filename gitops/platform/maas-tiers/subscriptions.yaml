# MaaS tiers (demo item P1-MAAS-TIERS). Three named tiers, each a distinct external model + one API key:
#   parasol-tier-stage  -> granite-4-0-h-tiny        (stage)
#   parasol-tier-prod   -> llama-scout-17b           (prod)
#   parasol-tier-guard  -> granite-guardian-3-1-8b   (guard; detector for P1-GUARDIAN)
#
# MODELS: the lab LiteLLM endpoint serves these three (and others) behind PER-MODEL keys (credentials file
# "MAAS keys" section; load-credentials.sh exports MAAS_KEY_STAGE/PROD/GUARD). The shared user1-5 virtual
# keys are allowlisted to llama-scout-17b only, which is why the first pass used scout for all three; with
# the per-model keys the stage and guard tiers now front the real granite models. llama-scout-17b is
# registered by the platform (platform-rhoai); granite-4-0-h-tiny and granite-guardian-3-1-8b are added
# here as additional ExternalModels. Upstream API-key Secrets (data key api-key) are created out-of-band by
# scripts/maas-ext-model-secrets.sh (maas-upstream-granite-tiny, maas-upstream-granite-guardian) and are
# never committed.
#
# Isolated + additive: own namespace parasol-maas-tiers owns the subscriptions (owner group
# system:serviceaccounts:parasol-maas-tiers), so scripts/maas-tier-keys.sh mints all three keys from one
# pod WITHOUT touching the shared operational subscriptions (parasol-stage/prod/policyholder). Applied
# imperatively (not Argo-wired). Priorities (61/111/71) differ from the operational 50/100/10.
apiVersion: v1
kind: Namespace
metadata:
  name: parasol-maas-tiers
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: maas-tier-client
  namespace: parasol-maas-tiers
---
# --- External model: granite-4-0-h-tiny (stage tier) ---
apiVersion: maas.opendatahub.io/v1alpha1
kind: ExternalModel
metadata:
  name: granite-4-0-h-tiny
  namespace: models-as-a-service
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider: openai
  endpoint: maas-rhdp.apps.maas.redhatworkshops.io
  targetModel: granite-4-0-h-tiny
  credentialRef: {name: maas-upstream-granite-tiny}
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSModelRef
metadata:
  name: granite-4-0-h-tiny
  namespace: models-as-a-service
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  modelRef: {kind: ExternalModel, name: granite-4-0-h-tiny}
---
# --- External model: granite-guardian-3-1-8b (guard tier) ---
apiVersion: maas.opendatahub.io/v1alpha1
kind: ExternalModel
metadata:
  name: granite-guardian-3-1-8b
  namespace: models-as-a-service
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider: openai
  endpoint: maas-rhdp.apps.maas.redhatworkshops.io
  targetModel: granite-guardian-3-1-8b
  credentialRef: {name: maas-upstream-granite-guardian}
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSModelRef
metadata:
  name: granite-guardian-3-1-8b
  namespace: models-as-a-service
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  modelRef: {kind: ExternalModel, name: granite-guardian-3-1-8b}
---
# Who may call the tier models with a tier key.
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: parasol-tier-access
  namespace: models-as-a-service
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  subjects:
    groups:
      - {name: "system:serviceaccounts:parasol-maas-tiers"}
  modelRefs:
    - {name: llama-scout-17b, namespace: models-as-a-service}
    - {name: granite-4-0-h-tiny, namespace: models-as-a-service}
    - {name: granite-guardian-3-1-8b, namespace: models-as-a-service}
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: parasol-tier-stage
  namespace: models-as-a-service
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    parasol.io/tier: stage
spec:
  owner:
    groups: [{name: "system:serviceaccounts:parasol-maas-tiers"}]
  priority: 61
  modelRefs:
    - name: granite-4-0-h-tiny
      namespace: models-as-a-service
      tokenRateLimits:
        - {limit: 50000, window: 10m}
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: parasol-tier-prod
  namespace: models-as-a-service
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    parasol.io/tier: prod
spec:
  owner:
    groups: [{name: "system:serviceaccounts:parasol-maas-tiers"}]
  priority: 111
  modelRefs:
    - name: llama-scout-17b
      namespace: models-as-a-service
      tokenRateLimits:
        - {limit: 2000000, window: 24h}
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: parasol-tier-guard
  namespace: models-as-a-service
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    parasol.io/tier: guard
spec:
  owner:
    groups: [{name: "system:serviceaccounts:parasol-maas-tiers"}]
  priority: 71
  modelRefs:
    - name: granite-guardian-3-1-8b
      namespace: models-as-a-service
      tokenRateLimits:
        - {limit: 100000, window: 10m}
