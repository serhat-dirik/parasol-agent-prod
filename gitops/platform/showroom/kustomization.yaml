apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# No `namespace:` here: terminal-rbac.yaml binds the Terminal ServiceAccount in other demo
# namespaces. Every parasol-showroom resource sets its namespace explicitly.
resources:
  - cluster-configmap.yaml
  - sitecfg-configmap.yaml
  - uiconfig-configmap.yaml
  - nginx-configmap.yaml
  - terminal-configmap.yaml
  - terminal-rbac.yaml
  - deployment.yaml
  - service.yaml
  - route.yaml
