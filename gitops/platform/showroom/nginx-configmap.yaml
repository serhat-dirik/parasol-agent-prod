apiVersion: v1
kind: ConfigMap
metadata:
  name: showroom-proxy
  namespace: parasol-showroom
# Front proxy. The Route targets this container only.
#   /       -> nookbag cockpit SPA (:8080), which also serves /nookbag.yml and /antora
#   /wetty/ -> ttyd terminal sidecar (:7681), with websocket upgrade
data:
  nginx.conf: |
    events {}
    error_log /dev/stdout info;
    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;
      map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
      }
      # HTML (the cockpit root and every guide page) is never cached, so a browser that saw an
      # older guide always reloads the current one. Other assets keep the upstream headers.
      map $upstream_http_content_type $html_cache_control {
        ~*text/html "no-store";
        default     $upstream_http_cache_control;
      }
      server {
        listen 8081;
        absolute_redirect off;

        # Terminal (ttyd, :7681) under /wetty/. ttyd builds its token and websocket URLs relative to
        # the page, so the bare /wetty gets one redirect to /wetty/ (ttyd never redirects back).
        location = /wetty { return 302 /wetty/; }
        location /wetty/ {
          proxy_pass http://127.0.0.1:7681/;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
          proxy_set_header Host $http_host;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_read_timeout 43200s;
        }

        location / {
          proxy_pass http://127.0.0.1:8080;
          proxy_hide_header Cache-Control;
          add_header Cache-Control $html_cache_control always;
          proxy_set_header Host $http_host;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }
      }
    }
