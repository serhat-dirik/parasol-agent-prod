apiVersion: v1
kind: ConfigMap
metadata:
  name: showroom-proxy
  namespace: parasol-showroom
# Front proxy. The Route targets this container only.
#   /       -> nookbag cockpit SPA (:8080), which also serves /nookbag.yml and /antora
#   /wetty  -> wetty terminal sidecar (:3000), with websocket upgrade
data:
  nginx.conf: |
    events {}
    error_log /dev/stdout info;
    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;
      map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
      }
      server {
        listen 8081;
        absolute_redirect off;

        location = /wetty { return 302 /wetty/; }
        location /wetty/ {
          proxy_pass http://127.0.0.1:3000;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
          proxy_set_header Host $http_host;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_read_timeout 43200000;
        }

        location / {
          proxy_pass http://127.0.0.1:8080;
          proxy_set_header Host $http_host;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }
      }
    }
