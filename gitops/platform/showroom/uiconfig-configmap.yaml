apiVersion: v1
kind: ConfigMap
metadata:
  name: showroom-uiconfig
  namespace: parasol-showroom
# Mirror of showroom/ui-config.yml (keep identical). Mounted as /nookbag.yml in the cockpit,
# which reads its module list and tab list from it.
data:
  ui-config.yml: |
    ---
    type: showroom
    theme: rh-one-2025

    # Left column (the guide) takes 30% of the width, leaving the framed tabs as wide as possible.
    default_width: 30
    # Persist the URL state so a browser refresh does not reset the UI.
    persist_url_state: true

    view_switcher:
      enabled: true
      default_mode: split

    antora:
      name: modules
      dir: antora
      modules:
        - name: index
        - name: 01-architecture
        - name: 02-before-you-start
        - name: 03-scenario1-colleague
        - name: 04-scenario2-document
        - name: 05-scenario3-night-shift
        - name: 06-scenario4-eval-gate
        - name: 07-supply-chain
        - name: 08-reset-troubleshooting

    # Full hostnames are used on purpose. This is a single, disposable lab cluster and the
    # cluster domain is safe to commit (see the media-capture conventions). It also avoids
    # relying on runtime ${DOMAIN} substitution, which the static content server does not do.
    tabs:
      # The two Parasol portals are our own app and can be framed inline.
      - name: Portal unsecured
        url: 'https://portal-free.apps.cluster-znh6n.dyn.redhatworkshops.io'
      - name: Portal secured
        url: 'https://portal.apps.cluster-znh6n.dyn.redhatworkshops.io'

      # The platform consoles are framed like the portals. Their own X-Frame-Options / CSP would
      # block that, so scripts/showroom-framing.sh (run by bootstrap.sh) rewrites both headers on the
      # default IngressController to allow this Showroom origin only.
      - name: Keycloak
        url: 'https://sso.apps.cluster-znh6n.dyn.redhatworkshops.io/admin/master/console/#/parasol'
      - name: OpenShift AI
        url: 'https://rh-ai.apps.cluster-znh6n.dyn.redhatworkshops.io'
      - name: OpenShift Console
        url: 'https://console-openshift-console.apps.cluster-znh6n.dyn.redhatworkshops.io'
      - name: Argo CD
        url: 'https://openshift-gitops-server-openshift-gitops.apps.cluster-znh6n.dyn.redhatworkshops.io'
      - name: MLflow
        url: 'https://rh-ai.apps.cluster-znh6n.dyn.redhatworkshops.io/mlflow'

      # Terminal served by the ttyd sidecar, reverse-proxied at /wetty/ on the Route host.
      - name: Terminal
        path: /wetty/
        port: 443
