apiVersion: v1
kind: ConfigMap
metadata:
  name: showroom-uiconfig
  namespace: parasol-showroom
# Mirror of showroom/ui-config.yml (keep identical). Mounted as /ui-config.yml in the cockpit,
# which reads its module list and tab list from it.
data:
  ui-config.yml: |
    ---
    # Guided mode keeps the Previous/Next buttons and the progress bar under the guide.
    type: guided
    skipModuleEnabled: false
    theme: rh-one-2025

    # Left column (the guide) takes 30% of the width, leaving the framed tabs as wide as possible.
    # Drag the divider to resize.
    default_width: 30

    # Right-edge popout: Instructions (guide only), Split, Tabs (apps full width, guide hidden).
    # Alt+V cycles the three modes.
    view_switcher:
      enabled: true
      default_mode: split

    antora:
      name: modules
      dir: antora
      modules:
        - name: index
        - name: 01-architecture
        - name: 02-before-you-start
        - name: 03-showcase1-colleague
        - name: 04-showcase2-document
        - name: 05-showcase3-confidential-document
        - name: 06-showcase4-night-shift
        - name: 07-showcase5-supply-chain
        - name: 08-showcase6-eval-gate
        - name: 09-showcase7-third-party-tools
        - name: 10-reset-troubleshooting

    # CLUSTER_DOMAIN is replaced at pod start (deployment.yaml, init container uiconfig) with the
    # domain in ConfigMap showroom-cluster, which the platform-showroom Argo Application sets.
    tabs:
      # The two Parasol portals are our own app and can be framed inline.
      - name: Portal unsecured
        url: 'https://portal-free.apps.CLUSTER_DOMAIN/Dashboard?from=showroom'
      - name: Portal secured
        url: 'https://portal.apps.CLUSTER_DOMAIN/Dashboard?from=showroom'

      # The platform consoles are framed like the portals. Their own X-Frame-Options / CSP would
      # block that, so scripts/showroom-framing.sh (run by bootstrap.sh) rewrites both headers on the
      # default IngressController to allow this Showroom origin only.
      - name: Keycloak
        url: 'https://sso.apps.CLUSTER_DOMAIN/admin/parasol/console/'
      - name: OpenShift AI
        url: 'https://rh-ai.apps.CLUSTER_DOMAIN'
      - name: OpenShift Console
        url: 'https://console-openshift-console.apps.CLUSTER_DOMAIN'
      - name: Argo CD
        url: 'https://openshift-gitops-server-openshift-gitops.apps.CLUSTER_DOMAIN'
      - name: MLflow
        url: 'https://rh-ai.apps.CLUSTER_DOMAIN/mlflow'

      # Terminal served by the ttyd sidecar, reverse-proxied at /wetty/ on the Route host.
      - name: Terminal
        path: /wetty/
        port: 443
