apiVersion: v1
kind: ConfigMap
metadata:
  name: showroom-terminal
  namespace: parasol-showroom
# Each Terminal session starts here: fetch the demo repository (main) into the home volume, then
# open bash in it. `oc` uses the pod's ServiceAccount token (showroom-terminal) via in-cluster config.
data:
  start.sh: |
    #!/bin/bash
    export HOME=/home/lab-user USER=lab-user
    REPO=https://github.com/serhat-dirik/parasol-agent-prod
    DIR="$HOME/parasol-agent-prod"
    # Bounded: a slow GitHub must never keep the terminal from opening (the pull keeps the old copy).
    if [ -d "$DIR/.git" ]; then
      timeout 20 git -C "$DIR" pull -q --ff-only 2>/dev/null || echo "repository not updated (git pull failed or took over 20 s)"
    else
      timeout 120 git clone -q --depth 1 "$REPO" "$DIR" || { echo "git clone failed or took over 120 s; open a new terminal to retry"; rm -rf "$DIR"; }
    fi
    cd "$DIR" || cd "$HOME"
    echo "Parasol demo terminal: repository at $DIR, oc as $(oc whoami 2>/dev/null)"
    exec /usr/bin/bash
