apiVersion: apps/v1
kind: Deployment
metadata:
  name: showroom
  namespace: parasol-showroom
  labels:
    app: showroom
spec:
  replicas: 1
  selector:
    matchLabels:
      app: showroom
  template:
    metadata:
      labels:
        app: showroom
    spec:
      initContainers:
        # Build the Antora site from the committed content into the shared volume.
        # site.yml points at the remote repo, so the builder only needs the playbook and network.
        - name: antora-build
          image: docker.io/antora/antora:3.1.5
          command: ["antora"]
          args: ["--fetch", "--to-dir=/out", "/config/site.yml"]
          env:
            - {name: HOME, value: /antora-home}
            - {name: ANTORA_CACHE_DIR, value: /antora-home/.cache}
          volumeMounts:
            - {name: site, mountPath: /out}
            - {name: sitecfg, mountPath: /config}
            - {name: antora-home, mountPath: /antora-home}
          resources:
            requests: {cpu: 200m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
      containers:
        # Nookbag cockpit SPA. Serves the split view on :8080, framing /antora on the left and
        # the tabs from /nookbag.yml on the right.
        - name: nookbag
          image: quay.io/rhpds/nookbag:latest
          imagePullPolicy: Always
          ports:
            - {containerPort: 8080, name: nookbag}
          volumeMounts:
            - {name: site, mountPath: /var/www/html/antora}
            - {name: nookbagcfg, mountPath: /var/www/html/nookbag.yml, subPath: ui-config.yml}
          readinessProbe:
            httpGet: {path: /nookbag.yml, port: 8080}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
        # Terminal. Default entrypoint (yarn start) serves the terminal at /wetty/ on :3000.
        - name: terminal
          image: quay.io/rhpds/wetty:latest
          imagePullPolicy: Always
          ports:
            - {containerPort: 3000, name: wetty}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
        # Front proxy, the only container the Service/Route target.
        #   /       -> nookbag cockpit (:8080), which also serves /nookbag.yml and /antora
        #   /wetty  -> wetty terminal (:3000), websocket
        - name: nginx
          image: quay.io/rhpds/nginx:1.25
          imagePullPolicy: IfNotPresent
          ports:
            - {containerPort: 8081, name: web}
          volumeMounts:
            - {name: nginx-config, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf}
            - {name: nginx-cache, mountPath: /var/cache/nginx}
            - {name: nginx-run, mountPath: /var/run}
          readinessProbe:
            httpGet: {path: /nookbag.yml, port: 8081}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
      volumes:
        - {name: site, emptyDir: {}}
        - {name: antora-home, emptyDir: {}}
        - {name: sitecfg, configMap: {name: showroom-sitecfg}}
        - {name: nookbagcfg, configMap: {name: showroom-uiconfig}}
        - {name: nginx-config, configMap: {name: showroom-proxy}}
        - {name: nginx-cache, emptyDir: {}}
        - {name: nginx-run, emptyDir: {}}
