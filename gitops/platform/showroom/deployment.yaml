apiVersion: apps/v1
kind: Deployment
metadata:
  name: showroom
  namespace: parasol-showroom
  labels:
    app: showroom
spec:
  replicas: 1
  selector:
    matchLabels:
      app: showroom
  template:
    metadata:
      labels:
        app: showroom
    spec:
      serviceAccountName: showroom-terminal
      initContainers:
        # Random cookie secret for the oauth-proxy, generated per pod (never stored in a repo or a Secret).
        - name: oauth-cookie
          image: quay.io/rhpds/nginx:1.25
          command: ["sh", "-c", "head -c 24 /dev/urandom | base64 | tr -d '\\n' > /oauth/cookie-secret"]
          volumeMounts:
            - {name: oauth-cookie, mountPath: /oauth}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
        # Build the Antora site from the committed content into the shared volume.
        # site.yml points at the remote repo, so the builder only needs the playbook and network.
        - name: antora-build
          image: docker.io/antora/antora:3.1.5
          command: ["antora"]
          args: ["--fetch", "--to-dir=/out", "/config/site.yml"]
          env:
            - {name: HOME, value: /antora-home}
            - {name: ANTORA_CACHE_DIR, value: /antora-home/.cache}
          volumeMounts:
            - {name: site, mountPath: /out}
            - {name: sitecfg, mountPath: /config}
            - {name: antora-home, mountPath: /antora-home}
          resources:
            requests: {cpu: 200m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
      containers:
        # Nookbag cockpit SPA. Serves the split view on :8080, framing /antora on the left and
        # the tabs from /nookbag.yml on the right.
        - name: nookbag
          image: quay.io/rhpds/nookbag:latest
          imagePullPolicy: Always
          ports:
            - {containerPort: 8080, name: nookbag}
          volumeMounts:
            - {name: site, mountPath: /var/www/html/antora}
            - {name: nookbagcfg, mountPath: /var/www/html/nookbag.yml, subPath: ui-config.yml}
          readinessProbe:
            httpGet: {path: /nookbag.yml, port: 8080}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
        # Terminal: the RHDP showroom terminal image (ttyd + bash + oc) on :7681. Each session runs
        # start.sh, which fetches the demo repository and opens bash in it; oc runs as the
        # showroom-terminal ServiceAccount (scoped RBAC in terminal-rbac.yaml).
        - name: terminal
          image: quay.io/rhpds/openshift-showroom-terminal-ocp:latest
          imagePullPolicy: IfNotPresent
          env:
            - {name: RUNCOMMAND, value: /opt/showroom/start.sh}
          ports:
            - {containerPort: 7681, name: ttyd}
          volumeMounts:
            - {name: terminal-home, mountPath: /home/lab-user}
            - {name: terminal-start, mountPath: /opt/showroom}
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
        # OpenShift sign-in in front of everything: the Service/Route target this container. Only
        # signed-in cluster users who can get Services in parasol-showroom reach nginx and the Terminal.
        - name: oauth-proxy
          image: image-registry.openshift-image-registry.svc:5000/openshift/oauth-proxy:v4.4
          args:
            - --provider=openshift
            - --openshift-service-account=showroom-terminal
            - '--openshift-sar={"namespace":"parasol-showroom","resource":"services","verb":"get"}'
            - --http-address=:4180
            - --https-address=
            - --upstream=http://localhost:8081
            - --cookie-secret-file=/oauth/cookie-secret
            - --cookie-secure=true
            - --skip-provider-button=true
          ports:
            - {containerPort: 4180, name: oauth}
          volumeMounts:
            - {name: oauth-cookie, mountPath: /oauth}
          readinessProbe:
            httpGet: {path: /oauth/healthz, port: 4180}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
        # Front proxy behind the oauth-proxy.
        #   /       -> nookbag cockpit (:8080), which also serves /nookbag.yml and /antora
        #   /wetty  -> wetty terminal (:3000), websocket
        - name: nginx
          image: quay.io/rhpds/nginx:1.25
          imagePullPolicy: IfNotPresent
          ports:
            - {containerPort: 8081, name: web}
          volumeMounts:
            - {name: nginx-config, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf}
            - {name: nginx-cache, mountPath: /var/cache/nginx}
            - {name: nginx-run, mountPath: /var/run}
          readinessProbe:
            httpGet: {path: /nookbag.yml, port: 8081}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
      volumes:
        - {name: site, emptyDir: {}}
        - {name: antora-home, emptyDir: {}}
        - {name: sitecfg, configMap: {name: showroom-sitecfg}}
        - {name: nookbagcfg, configMap: {name: showroom-uiconfig}}
        - {name: nginx-config, configMap: {name: showroom-proxy}}
        - {name: nginx-cache, emptyDir: {}}
        - {name: nginx-run, emptyDir: {}}
        - {name: terminal-home, emptyDir: {}}
        - {name: oauth-cookie, emptyDir: {medium: Memory}}
        - {name: terminal-start, configMap: {name: showroom-terminal, defaultMode: 0755}}
