# Guide 07 runs scripts/signing-demo.sh from the Terminal tab; the terminal cannot create namespaces,
# so the admission-demo namespace exists up front (signing-demo.sh labels it for enforcement).
apiVersion: v1
kind: Namespace
metadata:
  name: parasol-admission-demo
  annotations: {argocd.argoproj.io/sync-wave: "-1"}
---
# Identity of the Showroom Terminal tab. The terminal runs `oc` with this ServiceAccount's in-cluster
# token, scoped to what the demo scripts need (night-shift.sh, signing-demo.sh, status.sh, the
# reset.sh and the `oc logs` checks). No cluster-admin and no Secret access. pods/exec is granted in
# parasol-free and parasol-secured only, for the claims-db reset in reset.sh.
# The Showroom Route sits behind an OpenShift oauth-proxy: only signed-in cluster users who can get
# Services in parasol-showroom reach the Terminal. Keep it that way before granting anything here.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: showroom-terminal
  namespace: parasol-showroom
  annotations:
    # The oauth-proxy in front of the Showroom uses this ServiceAccount as its OpenShift OAuth client.
    serviceaccounts.openshift.io/oauth-redirectreference.showroom: '{"kind":"OAuthRedirectReference","apiVersion":"v1","reference":{"kind":"Route","name":"showroom"}}'
---
# Read-only view of the demo workloads and their logs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: parasol-showroom-presenter
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, services, endpoints, configmaps, events]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets]
    verbs: [get, list, watch]
  - apiGroups: [route.openshift.io]
    resources: [routes]
    verbs: [get, list, watch]
  - apiGroups: [tekton.dev]
    resources: [pipelines, pipelineruns, taskruns]
    verbs: [get, list, watch]
  - apiGroups: [image.openshift.io]
    resources: [imagestreams, imagestreamtags]
    verbs: [get, list, watch]
  - apiGroups: [trustyai.opendatahub.io]
    resources: [lmevaljobs]
    verbs: [get, list, watch]
---
# reset.sh: the claims-db admin reset runs through `oc exec` (the secured NetworkPolicy blocks a
# direct call from the Showroom namespace).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: parasol-showroom-presenter-exec
rules:
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create, get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: showroom-terminal-exec, namespace: parasol-free}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: parasol-showroom-presenter-exec}
subjects: [{kind: ServiceAccount, name: showroom-terminal, namespace: parasol-showroom}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: showroom-terminal-exec, namespace: parasol-secured}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: parasol-showroom-presenter-exec}
subjects: [{kind: ServiceAccount, name: showroom-terminal, namespace: parasol-showroom}]
---
# Cluster-scoped reads the scripts use (cluster domain, gateway/policy status) and the two narrow
# writes signing-demo.sh needs (label its namespace, bind the image-puller role).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: parasol-showroom-presenter-cluster
rules:
  - apiGroups: [config.openshift.io]
    resources: [dnses, ingresses]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [namespaces]
    resourceNames: [parasol-admission-demo]
    verbs: [patch, update]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles]
    resourceNames: ["system:image-puller"]
    verbs: [bind]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [gateways, httproutes]
    verbs: [get, list, watch]
  - apiGroups: [kuadrant.io]
    resources: [authpolicies, ratelimitpolicies, tokenratelimitpolicies]
    verbs: [get, list, watch]
  - apiGroups: [mcp.kuadrant.io]
    resources: [mcpgatewayextensions, mcpserverregistrations, mcpvirtualservers]
    verbs: [get, list, watch]
  - apiGroups: [policy.sigstore.dev]
    resources: [clusterimagepolicies]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: parasol-showroom-presenter-cluster
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: parasol-showroom-presenter-cluster}
subjects:
  - {kind: ServiceAccount, name: showroom-terminal, namespace: parasol-showroom}
---
# Read access in every demo namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: showroom-terminal-view, namespace: parasol-free}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: parasol-showroom-presenter}
subjects: [{kind: ServiceAccount, name: showroom-terminal, namespace: parasol-showroom}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: showroom-terminal-view, namespace: parasol-secured}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: parasol-showroom-presenter}
subjects: [{kind: ServiceAccount, name: showroom-terminal, namespace: parasol-showroom}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: showroom-terminal-view, namespace: parasol-build}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: parasol-showroom-presenter}
subjects: [{kind: ServiceAccount, name: showroom-terminal, namespace: parasol-showroom}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: showroom-terminal-view, namespace: parasol-eval}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: parasol-showroom-presenter}
subjects: [{kind: ServiceAccount, name: showroom-terminal, namespace: parasol-showroom}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: showroom-terminal-view, namespace: parasol-showroom}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: parasol-showroom-presenter}
subjects: [{kind: ServiceAccount, name: showroom-terminal, namespace: parasol-showroom}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: showroom-terminal-view, namespace: models-as-a-service}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: parasol-showroom-presenter}
subjects: [{kind: ServiceAccount, name: showroom-terminal, namespace: parasol-showroom}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: showroom-terminal-view, namespace: mcp-system}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: parasol-showroom-presenter}
subjects: [{kind: ServiceAccount, name: showroom-terminal, namespace: parasol-showroom}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: showroom-terminal-view, namespace: kuadrant-system}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: parasol-showroom-presenter}
subjects: [{kind: ServiceAccount, name: showroom-terminal, namespace: parasol-showroom}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: showroom-terminal-view, namespace: parasol-admission-demo}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: parasol-showroom-presenter}
subjects: [{kind: ServiceAccount, name: showroom-terminal, namespace: parasol-showroom}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: showroom-terminal-view, namespace: openshift-gitops}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: showroom-terminal-argo-view}
subjects: [{kind: ServiceAccount, name: showroom-terminal, namespace: parasol-showroom}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: showroom-terminal-argo-view, namespace: openshift-gitops}
rules:
  - apiGroups: [argoproj.io]
    resources: [applications]
    verbs: [get, list, watch]
  # Guide 05/08 kill switch: add/remove the kill-switch component on env-secured (one `oc patch`).
  - apiGroups: [argoproj.io]
    resources: [applications]
    resourceNames: [env-secured]
    verbs: [patch]
---
# reset.sh: restart Limitador to refill the per-user token budgets.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: showroom-terminal-limitador-restart, namespace: kuadrant-system}
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [limitador-limitador]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: showroom-terminal-limitador-restart, namespace: kuadrant-system}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: showroom-terminal-limitador-restart}
subjects: [{kind: ServiceAccount, name: showroom-terminal, namespace: parasol-showroom}]
---
# abuse.sh / agent-token.sh (Scenario 1 check): mint the agent's short-lived ServiceAccount token, as the
# agent pod does, to show the token the claims agent gets on the user's behalf. Only these two SAs.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: showroom-terminal-agent-token, namespace: parasol-secured}
rules:
  - apiGroups: [""]
    resources: [serviceaccounts/token]
    resourceNames: [claims-agent, fraud-agent]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: showroom-terminal-agent-token, namespace: parasol-secured}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: showroom-terminal-agent-token}
subjects: [{kind: ServiceAccount, name: showroom-terminal, namespace: parasol-showroom}]
---
# signing-demo.sh: run a signed and an unsigned test pod in the admission demo namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: showroom-terminal-admission-demo, namespace: parasol-admission-demo}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: showroom-terminal-admission-demo, namespace: parasol-admission-demo}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: showroom-terminal-admission-demo}
subjects: [{kind: ServiceAccount, name: showroom-terminal, namespace: parasol-showroom}]
---
# signing-demo.sh: (re)apply the image-puller RoleBinding that lets the demo namespace pull the portal.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: showroom-terminal-sign-demo-pull, namespace: parasol-build}
rules:
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [rolebindings]
    verbs: [get, create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: showroom-terminal-sign-demo-pull, namespace: parasol-build}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: showroom-terminal-sign-demo-pull}
subjects: [{kind: ServiceAccount, name: showroom-terminal, namespace: parasol-showroom}]
