# Realm 'parasol' for the demo. Conventions follow the Kuadrant MCP gateway docs:
# resource-server clients are named <namespace>/<MCPServerRegistration name>, roles are tool:<name>,
# and the resource_access claim of a user's token is what the gateway AuthPolicy checks.
# Agents: parasol-claims-agent, parasol-fraud-agent act ON BEHALF OF a user (token exchange).
# Demo users: rebecca (adjuster), marcus (claims manager), dev, nina.contractor (night-shift contractor).
# Passwords equal the username.
apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakRealmImport
metadata:
  name: parasol-realm
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  keycloakCRName: keycloak
  realm:
    id: parasol
    realm: parasol
    enabled: true
    accessTokenLifespan: 3600
    clients:
    # (Listed before parasol-portal: the platform-keycloak Application patches clients/2 = parasol-portal.)
    # The agents' own identities (scripts/agent-clients.sh keeps them in sync). Confidential, but with NO
    # secret: each authenticates with its pod's projected ServiceAccount token as a client assertion
    # (federated-jwt via the 'openshift-sa' identity provider). Their only grant is standard token
    # exchange: the user's token in, a token with sub = the user and azp = the agent out. fullScopeAllowed
    # false + clientScopeMappings below = the agent CEILING (exchanged roles = user's AND the ceiling).
    - clientId: parasol-claims-agent
      name: Parasol claims assistant (agent identity)
      publicClient: false
      clientAuthenticatorType: federated-jwt
      serviceAccountsEnabled: true
      standardFlowEnabled: false
      directAccessGrantsEnabled: false
      fullScopeAllowed: false
      protocol: openid-connect
      enabled: true
      attributes:
        standard.token.exchange.enabled: 'true'
        jwt.credential.issuer: openshift-sa
        jwt.credential.sub: system:serviceaccount:parasol-secured:claims-agent
      # groups: the knowledge base decides which documents the user may read from this claim
      defaultClientScopes: [basic, roles, profile, groups]
      # its tokens may be exchanged again by the fraud agent (agent-to-agent)
      protocolMappers:
      - name: audience-parasol-fraud-agent
        protocol: openid-connect
        protocolMapper: oidc-audience-mapper
        config:
          included.client.audience: parasol-fraud-agent
          access.token.claim: 'true'
          id.token.claim: 'false'
          introspection.token.claim: 'true'
    - clientId: parasol-fraud-agent
      name: Parasol fraud-check agent (agent identity)
      publicClient: false
      clientAuthenticatorType: federated-jwt
      serviceAccountsEnabled: true
      standardFlowEnabled: false
      directAccessGrantsEnabled: false
      fullScopeAllowed: false
      protocol: openid-connect
      enabled: true
      attributes:
        standard.token.exchange.enabled: 'true'
        jwt.credential.issuer: openshift-sa
        jwt.credential.sub: system:serviceaccount:parasol-secured:fraud-agent
      defaultClientScopes: [basic, roles, profile]
    # Portal login (quarkus-oidc web-app, authorization-code flow). Confidential: on a fresh realm import
    # Keycloak generates the secret; scripts/portal-oidc-client.sh reads it into the parasol-portal-oidc
    # Secret in parasol-free and parasol-secured. The secret is never committed.
    - clientId: parasol-portal
      name: Parasol claims portal (web-app)
      publicClient: false
      standardFlowEnabled: true
      # browser-only: the scripts log personas in through parasol-demo-cli below
      directAccessGrantsEnabled: false
      serviceAccountsEnabled: false
      protocol: openid-connect
      enabled: true
      fullScopeAllowed: true
      # "+" reuses the registered redirect URIs for RP-initiated (end_session) logout, so Quarkus
      # post_logout_redirect_uri back to the portal is accepted and users can switch accounts.
      attributes:
        post.logout.redirect.uris: '+'
      # Hosts are set by the platform-keycloak Argo Application (CLUSTER_DOMAIN from bootstrap.sh).
      redirectUris:
      - https://portal-free.apps.CLUSTER_DOMAIN/*
      - https://portal.apps.CLUSTER_DOMAIN/*
      webOrigins:
      - https://portal-free.apps.CLUSTER_DOMAIN
      - https://portal.apps.CLUSTER_DOMAIN
      defaultClientScopes:
      - roles
      - profile
      - email
      optionalClientScopes:
      - groups
      # Client-scoped mapper: emit resource_access.<client>.roles into BOTH the access and the ID token,
      # so a browser (authorization-code) login carries the tool:* roles the MCP gateway checks even if
      # the portal forwards the ID token. The shared realm "roles" scope only puts them in the access
      # token; this covers the ID token too. Scoped to parasol-portal.
      protocolMappers:
      - name: portal-client-roles
        protocol: openid-connect
        protocolMapper: oidc-usermodel-client-role-mapper
        config:
          claim.name: resource_access.${client_id}.roles
          jsonType.label: String
          multivalued: 'true'
          id.token.claim: 'true'
          access.token.claim: 'true'
          userinfo.token.claim: 'false'
          usermodel.clientRoleMapping.clientId: ''
      # A login token may be exchanged by the claims agent (it must be in the subject token's audience).
      - name: audience-parasol-claims-agent
        protocol: openid-connect
        protocolMapper: oidc-audience-mapper
        config:
          included.client.audience: parasol-claims-agent
          access.token.claim: 'true'
          id.token.claim: 'false'
          introspection.token.claim: 'true'
    - clientId: parasol-secured/claims-db
      name: claims-db MCP server (resource server)
      publicClient: true
      standardFlowEnabled: false
      directAccessGrantsEnabled: false
      protocol: openid-connect
      enabled: true
      defaultClientScopes:
      - roles
      fullScopeAllowed: true
    - clientId: parasol-secured/policy-docs
      name: policy-docs MCP server (resource server)
      publicClient: true
      standardFlowEnabled: false
      directAccessGrantsEnabled: false
      protocol: openid-connect
      enabled: true
      defaultClientScopes:
      - roles
      fullScopeAllowed: true
    # V3: the fraud-check agent is a resource server too; the gateway checks tool:fraud_check here.
    - clientId: parasol-secured/fraud-check
      name: fraud-check agent (resource server)
      publicClient: true
      standardFlowEnabled: false
      directAccessGrantsEnabled: false
      protocol: openid-connect
      enabled: true
      defaultClientScopes:
      - roles
      fullScopeAllowed: true
    # The knowledge base is a resource server too; the gateway checks tool:search_knowledge here
    # (scripts/knowledge-base-client.sh keeps it in sync on an existing realm).
    - clientId: parasol-secured/knowledge-base
      name: knowledge base (resource server)
      publicClient: true
      standardFlowEnabled: false
      directAccessGrantsEnabled: false
      protocol: openid-connect
      enabled: true
      defaultClientScopes:
      - roles
      fullScopeAllowed: true
    # Headless persona logins of the scripts (scripts/token.sh): public, password grant only, no browser
    # flow. Its tokens may be exchanged by the claims agent, like a portal login token.
    - clientId: parasol-demo-cli
      name: Parasol demo scripts (headless persona login)
      publicClient: true
      standardFlowEnabled: false
      directAccessGrantsEnabled: true
      serviceAccountsEnabled: false
      protocol: openid-connect
      enabled: true
      fullScopeAllowed: true
      defaultClientScopes: [basic, roles, profile, email]
      optionalClientScopes: [groups]
      protocolMappers:
      - name: audience-parasol-claims-agent
        protocol: openid-connect
        protocolMapper: oidc-audience-mapper
        config:
          included.client.audience: parasol-claims-agent
          access.token.claim: 'true'
          id.token.claim: 'false'
          introspection.token.claim: 'true'
    roles:
      client:
        parasol-secured/claims-db:
        - name: tool:get_claim
          clientRole: true
        - name: tool:list_claims_by_status
          clientRole: true
        - name: tool:get_claim_history
          clientRole: true
        - name: tool:get_claim_documents
          clientRole: true
        - name: tool:approve_payout
          clientRole: true
        parasol-secured/policy-docs:
        - name: tool:search_policies
          clientRole: true
        - name: tool:get_policy
          clientRole: true
        - name: tool:list_policies
          clientRole: true
        parasol-secured/fraud-check:
        - name: tool:fraud_check
          clientRole: true
        parasol-secured/knowledge-base:
        - name: tool:search_knowledge
          clientRole: true
    # The agent ceilings (what each agent may ever use on a user's behalf). Approve is inside the claims
    # agent's ceiling but only reachable when the USER holds it too (claims-managers); the fraud agent is
    # read-only and can never approve.
    clientScopeMappings:
      parasol-secured/claims-db:
      - client: parasol-claims-agent
        roles: [tool:get_claim, tool:list_claims_by_status, tool:get_claim_history, tool:get_claim_documents, tool:approve_payout]
      - client: parasol-fraud-agent
        roles: [tool:get_claim, tool:get_claim_history, tool:get_claim_documents]
      parasol-secured/policy-docs:
      - client: parasol-claims-agent
        roles: [tool:search_policies, tool:get_policy, tool:list_policies]
      parasol-secured/fraud-check:
      - client: parasol-claims-agent
        roles: [tool:fraud_check]
      parasol-secured/knowledge-base:
      - client: parasol-claims-agent
        roles: [tool:search_knowledge]
    # This cluster's ServiceAccount tokens as client assertions (issuer: the cluster's service-account
    # issuer; Keycloak runs in-cluster and reads the API server's JWKS).
    identityProviders:
    - alias: openshift-sa
      displayName: OpenShift service accounts
      providerId: kubernetes
      enabled: true
      hideOnLogin: true
      config:
        issuer: https://kubernetes.default.svc
    # Keycloak > Events shows each token exchange with user + client.
    eventsEnabled: true
    eventsExpiration: 604800
    eventsListeners: [jboss-logging]
    enabledEventTypes: [TOKEN_EXCHANGE, TOKEN_EXCHANGE_ERROR, LOGIN, LOGIN_ERROR, CODE_TO_TOKEN, CODE_TO_TOKEN_ERROR, CLIENT_LOGIN, CLIENT_LOGIN_ERROR, LOGOUT]
    adminEventsEnabled: false
    groups:
    - name: adjusters
      path: /adjusters
      clientRoles:
        parasol-secured/claims-db: &id002
        - tool:get_claim
        - tool:list_claims_by_status
        - tool:get_claim_history
        - tool:get_claim_documents
        parasol-secured/policy-docs: &id001
        - tool:search_policies
        - tool:get_policy
        - tool:list_policies
        parasol-secured/fraud-check: &id003
        - tool:fraud_check
        parasol-secured/knowledge-base: &id004
        - tool:search_knowledge
    - name: claims-managers
      path: /claims-managers
      clientRoles:
        parasol-secured/claims-db:
        - tool:get_claim
        - tool:list_claims_by_status
        - tool:get_claim_history
        - tool:get_claim_documents
        - tool:approve_payout
        parasol-secured/policy-docs: *id001
        parasol-secured/fraud-check: *id003
        parasol-secured/knowledge-base: *id004
    - name: developers
      path: /developers
      clientRoles:
        parasol-secured/claims-db: *id002
        parasol-secured/policy-docs: *id001
        parasol-secured/knowledge-base: *id004
    # Contractors (outsourced night-shift staff). Read-only claim and policy tools, nothing that writes
    # or escalates: no approve_payout, no fraud_check (403 by least privilege). Night-shift user nina.contractor.
    - name: contractors
      path: /contractors
      clientRoles:
        parasol-secured/claims-db: *id002
        parasol-secured/policy-docs: *id001
        parasol-secured/knowledge-base: *id004
    users:
    - username: rebecca
      enabled: true
      emailVerified: true
      firstName: Rebecca
      lastName: Torres
      email: rebecca@parasol.example
      credentials:
      - type: password
        value: rebecca
        temporary: false
      groups:
      - /adjusters
      requiredActions: []
    - username: marcus
      enabled: true
      emailVerified: true
      firstName: Marcus
      lastName: Johnson
      email: marcus@parasol.example
      credentials:
      - type: password
        value: marcus
        temporary: false
      groups:
      - /claims-managers
      requiredActions: []
    - username: dev
      enabled: true
      emailVerified: true
      firstName: Dev
      lastName: Eloper
      email: dev@parasol.example
      credentials:
      - type: password
        value: dev
        temporary: false
      groups:
      - /developers
      requiredActions: []
    - username: nina.contractor
      enabled: true
      emailVerified: true
      firstName: Nina
      lastName: Patel
      email: nina.contractor@parasol.example
      credentials:
      - type: password
        value: nina.contractor
        temporary: false
      groups:
      - /contractors
      requiredActions: []
    clientScopes:
    - name: groups
      protocol: openid-connect
      attributes:
        display.on.consent.screen: 'false'
        include.in.token.scope: 'true'
      protocolMappers:
      - name: groups
        protocol: openid-connect
        protocolMapper: oidc-group-membership-mapper
        config:
          claim.name: groups
          full.path: 'false'
          id.token.claim: 'true'
          access.token.claim: 'true'
          userinfo.token.claim: 'true'
    - name: profile
      description: 'OpenID Connect built-in scope: profile'
      protocol: openid-connect
      attributes:
        include.in.token.scope: 'true'
        consent.screen.text: ${profileScopeConsentText}
        display.on.consent.screen: 'true'
      protocolMappers:
      - name: updated at
        protocol: openid-connect
        protocolMapper: oidc-usermodel-attribute-mapper
        consentRequired: false
        config:
          introspection.token.claim: 'true'
          userinfo.token.claim: 'true'
          user.attribute: updatedAt
          id.token.claim: 'true'
          access.token.claim: 'true'
          claim.name: updated_at
          jsonType.label: long
      - name: gender
        protocol: openid-connect
        protocolMapper: oidc-usermodel-attribute-mapper
        consentRequired: false
        config:
          introspection.token.claim: 'true'
          userinfo.token.claim: 'true'
          user.attribute: gender
          id.token.claim: 'true'
          access.token.claim: 'true'
          claim.name: gender
          jsonType.label: String
      - name: given name
        protocol: openid-connect
        protocolMapper: oidc-usermodel-attribute-mapper
        consentRequired: false
        config:
          introspection.token.claim: 'true'
          userinfo.token.claim: 'true'
          user.attribute: firstName
          id.token.claim: 'true'
          access.token.claim: 'true'
          claim.name: given_name
          jsonType.label: String
      - name: full name
        protocol: openid-connect
        protocolMapper: oidc-full-name-mapper
        consentRequired: false
        config:
          id.token.claim: 'true'
          introspection.token.claim: 'true'
          access.token.claim: 'true'
          userinfo.token.claim: 'true'
      - name: zoneinfo
        protocol: openid-connect
        protocolMapper: oidc-usermodel-attribute-mapper
        consentRequired: false
        config:
          introspection.token.claim: 'true'
          userinfo.token.claim: 'true'
          user.attribute: zoneinfo
          id.token.claim: 'true'
          access.token.claim: 'true'
          claim.name: zoneinfo
          jsonType.label: String
      - name: middle name
        protocol: openid-connect
        protocolMapper: oidc-usermodel-attribute-mapper
        consentRequired: false
        config:
          introspection.token.claim: 'true'
          userinfo.token.claim: 'true'
          user.attribute: middleName
          id.token.claim: 'true'
          access.token.claim: 'true'
          claim.name: middle_name
          jsonType.label: String
      - name: profile
        protocol: openid-connect
        protocolMapper: oidc-usermodel-attribute-mapper
        consentRequired: false
        config:
          introspection.token.claim: 'true'
          userinfo.token.claim: 'true'
          user.attribute: profile
          id.token.claim: 'true'
          access.token.claim: 'true'
          claim.name: profile
          jsonType.label: String
      - name: family name
        protocol: openid-connect
        protocolMapper: oidc-usermodel-attribute-mapper
        consentRequired: false
        config:
          introspection.token.claim: 'true'
          userinfo.token.claim: 'true'
          user.attribute: lastName
          id.token.claim: 'true'
          access.token.claim: 'true'
          claim.name: family_name
          jsonType.label: String
      - name: nickname
        protocol: openid-connect
        protocolMapper: oidc-usermodel-attribute-mapper
        consentRequired: false
        config:
          introspection.token.claim: 'true'
          userinfo.token.claim: 'true'
          user.attribute: nickname
          id.token.claim: 'true'
          access.token.claim: 'true'
          claim.name: nickname
          jsonType.label: String
      - name: locale
        protocol: openid-connect
        protocolMapper: oidc-usermodel-attribute-mapper
        consentRequired: false
        config:
          introspection.token.claim: 'true'
          userinfo.token.claim: 'true'
          user.attribute: locale
          id.token.claim: 'true'
          access.token.claim: 'true'
          claim.name: locale
          jsonType.label: String
      - name: picture
        protocol: openid-connect
        protocolMapper: oidc-usermodel-attribute-mapper
        consentRequired: false
        config:
          introspection.token.claim: 'true'
          userinfo.token.claim: 'true'
          user.attribute: picture
          id.token.claim: 'true'
          access.token.claim: 'true'
          claim.name: picture
          jsonType.label: String
      - name: birthdate
        protocol: openid-connect
        protocolMapper: oidc-usermodel-attribute-mapper
        consentRequired: false
        config:
          introspection.token.claim: 'true'
          userinfo.token.claim: 'true'
          user.attribute: birthdate
          id.token.claim: 'true'
          access.token.claim: 'true'
          claim.name: birthdate
          jsonType.label: String
      - name: website
        protocol: openid-connect
        protocolMapper: oidc-usermodel-attribute-mapper
        consentRequired: false
        config:
          introspection.token.claim: 'true'
          userinfo.token.claim: 'true'
          user.attribute: website
          id.token.claim: 'true'
          access.token.claim: 'true'
          claim.name: website
          jsonType.label: String
      - name: username
        protocol: openid-connect
        protocolMapper: oidc-usermodel-attribute-mapper
        consentRequired: false
        config:
          introspection.token.claim: 'true'
          userinfo.token.claim: 'true'
          user.attribute: username
          id.token.claim: 'true'
          access.token.claim: 'true'
          claim.name: preferred_username
          jsonType.label: String
    - name: roles
      description: OpenID Connect scope for add user roles to the access token
      protocol: openid-connect
      attributes:
        include.in.token.scope: 'false'
        consent.screen.text: ${rolesScopeConsentText}
        display.on.consent.screen: 'true'
      protocolMappers:
      - name: realm roles
        protocol: openid-connect
        protocolMapper: oidc-usermodel-realm-role-mapper
        consentRequired: false
        config:
          user.attribute: foo
          introspection.token.claim: 'true'
          access.token.claim: 'true'
          claim.name: realm_access.roles
          jsonType.label: String
          multivalued: 'true'
      - name: client roles
        protocol: openid-connect
        protocolMapper: oidc-usermodel-client-role-mapper
        consentRequired: false
        config:
          user.attribute: foo
          introspection.token.claim: 'true'
          access.token.claim: 'true'
          claim.name: resource_access.${client_id}.roles
          jsonType.label: String
          multivalued: 'true'
      - name: audience resolve
        protocol: openid-connect
        protocolMapper: oidc-audience-resolve-mapper
        consentRequired: false
        config:
          introspection.token.claim: 'true'
          access.token.claim: 'true'
    - name: email
      description: 'OpenID Connect built-in scope: email'
      protocol: openid-connect
      attributes:
        include.in.token.scope: 'true'
        consent.screen.text: ${emailScopeConsentText}
        display.on.consent.screen: 'true'
      protocolMappers:
      - name: email
        protocol: openid-connect
        protocolMapper: oidc-usermodel-attribute-mapper
        consentRequired: false
        config:
          introspection.token.claim: 'true'
          userinfo.token.claim: 'true'
          user.attribute: email
          id.token.claim: 'true'
          access.token.claim: 'true'
          claim.name: email
          jsonType.label: String
      - name: email verified
        protocol: openid-connect
        protocolMapper: oidc-usermodel-property-mapper
        consentRequired: false
        config:
          introspection.token.claim: 'true'
          userinfo.token.claim: 'true'
          user.attribute: emailVerified
          id.token.claim: 'true'
          access.token.claim: 'true'
          claim.name: email_verified
          jsonType.label: boolean
    - name: basic
      description: OpenID Connect scope for add all basic claims to the token
      protocol: openid-connect
      attributes:
        include.in.token.scope: 'false'
        display.on.consent.screen: 'false'
      protocolMappers:
      - name: sub
        protocol: openid-connect
        protocolMapper: oidc-sub-mapper
        consentRequired: false
        config:
          introspection.token.claim: 'true'
          access.token.claim: 'true'
      - name: auth_time
        protocol: openid-connect
        protocolMapper: oidc-usersessionmodel-note-mapper
        consentRequired: false
        config:
          user.session.note: AUTH_TIME
          id.token.claim: 'true'
          introspection.token.claim: 'true'
          access.token.claim: 'true'
          claim.name: auth_time
          jsonType.label: long
    defaultDefaultClientScopes:
    - basic
    - email
    - profile
    - roles
    defaultOptionalClientScopes:
    - groups
    - offline_access
    components:
      org.keycloak.services.clientregistration.policy.ClientRegistrationPolicy:
      - name: Consent Required
        providerId: consent-required
        subType: anonymous
        subComponents: {}
        config: {}
      - name: Allowed Protocol Mapper Types
        providerId: allowed-protocol-mappers
        subType: anonymous
        subComponents: {}
        config:
          allowed-protocol-mapper-types:
          - saml-role-list-mapper
          - oidc-address-mapper
          - saml-user-attribute-mapper
          - saml-user-property-mapper
          - oidc-full-name-mapper
          - oidc-usermodel-attribute-mapper
          - oidc-usermodel-property-mapper
          - oidc-sha256-pairwise-sub-mapper
      - name: Allowed Client Scopes
        providerId: allowed-client-templates
        subType: anonymous
        subComponents: {}
        config:
          allow-default-scopes:
          - 'true'
      - name: Allowed Client Scopes
        providerId: allowed-client-templates
        subType: authenticated
        subComponents: {}
        config:
          allow-default-scopes:
          - 'true'
      - name: Max Clients Limit
        providerId: max-clients
        subType: anonymous
        subComponents: {}
        config:
          max-clients:
          - '200'
      - name: Allowed Protocol Mapper Types
        providerId: allowed-protocol-mappers
        subType: authenticated
        subComponents: {}
        config:
          allowed-protocol-mapper-types:
          - saml-user-property-mapper
          - oidc-usermodel-property-mapper
          - oidc-full-name-mapper
          - oidc-sha256-pairwise-sub-mapper
          - saml-user-attribute-mapper
          - oidc-address-mapper
          - saml-role-list-mapper
          - oidc-usermodel-attribute-mapper
    displayName: Parasol Insurance
