# Deploys the broker-router into mcp-system and attaches it to listener "mcp".
# trustedHeadersKey: the public key Authorino's wristband (x-mcp-authorized) is verified with, so the
# broker can filter tools/list per user. bootstrap.sh generates the key pair (scripts/gen-trusted-keys.sh).
# apiVersion v1: Connectivity Link 1.5 ships the GA MCP gateway (upstream mcp-gateway v1.0.x); its CRDs serve
# and store only v1 (v1alpha1 is listed but not served).
apiVersion: mcp.kuadrant.io/v1
kind: MCPGatewayExtension
metadata:
  name: mcp-gateway-extension
  namespace: mcp-system
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "3"
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: mcp-gateway
    namespace: gateway-system
    sectionName: mcp
  # The router hair-pins tools/call back through the Gateway Service; OpenShift names it <gateway>-<class>, not <gateway>-istio.
  privateHost: mcp-gateway-openshift-default.gateway-system.svc.cluster.local:8080
  trustedHeadersKey:
    secretName: trusted-headers-public-key
  oauthProtectedResource:
    resourceName: "Parasol MCP tools"
    resource: "https://mcp.apps.CLUSTER_DOMAIN/mcp"
    authorizationServers:
      - "https://sso.apps.CLUSTER_DOMAIN/realms/parasol"
    bearerMethodsSupported: ["header"]
    scopesSupported: ["basic", "roles", "profile"]
