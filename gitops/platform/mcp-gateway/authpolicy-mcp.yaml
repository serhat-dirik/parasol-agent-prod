# Listener "mcp" (client side): who are you? Validates the Keycloak JWT, lets the MCP handshake
# through, and issues the signed x-mcp-authorized wristband listing the tools this identity may see,
# so tools/list is filtered per user BEFORE the model ever sees a tool it must not call.
# Only tokens obtained by an approved agent on the user's behalf (azp on the allow-list) get in; a user's
# own login token presented directly is refused with "calls must come through an approved agent".
apiVersion: kuadrant.io/v1
kind: AuthPolicy
metadata:
  name: mcp-auth-policy
  namespace: gateway-system
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "4"
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: mcp-gateway
    sectionName: mcp
  when:
    - predicate: "!request.path.contains('/.well-known')"
  rules:
    authentication:
      keycloak:
        jwt:
          issuerUrl: https://sso.apps.CLUSTER_DOMAIN/realms/parasol
    authorization:
      approved-agent:
        patternMatching:
          patterns:
            - predicate: "has(auth.identity.azp) && auth.identity.azp in ['parasol-claims-agent', 'parasol-fraud-agent']"
      allow-mcp-method:
        patternMatching:
          patterns:
            - predicate: |
                !request.headers.exists(h, h == 'x-mcp-method') || (request.headers['x-mcp-method'] in ["tools/list","tools/call","initialize","notifications/initialized","ping"])
      authorized-capabilities:
        opa:
          rego: |
            allow = true
            capabilities = {
              "tools": { server: tools |
                server := object.keys(input.auth.identity.resource_access)[_]
                tools := [substring(r, count("tool:"), -1) |
                  r := input.auth.identity.resource_access[server].roles[_]
                  startswith(r, "tool:")
                ]
              }
            }
          allValues: true
    response:
      success:
        headers:
          x-mcp-authorized:
            wristband:
              issuer: authorino
              customClaims:
                allowed-capabilities:
                  selector: auth.authorization.authorized-capabilities.capabilities.@tostr
              tokenDuration: 300
              signingKeyRefs:
                - name: trusted-headers-private-key
                  algorithm: ES256
      unauthenticated:
        code: 401
        headers:
          WWW-Authenticate:
            value: Bearer resource_metadata=https://mcp.apps.CLUSTER_DOMAIN/.well-known/oauth-protected-resource/mcp
        body:
          value: |
            {"error": "Unauthorized", "message": "Parasol MCP gateway: authentication required."}
      unauthorized:
        code: 403
        message:
          expression: |
            (has(auth.identity.azp) && auth.identity.azp in ['parasol-claims-agent', 'parasol-fraud-agent'] ? 'access denied for ' : 'not via an approved agent: ') + (has(auth.identity.preferred_username) ? auth.identity.preferred_username : '-') + ' azp=' + (has(auth.identity.azp) ? auth.identity.azp : '-')
        body:
          expression: |
            has(auth.identity.azp) && auth.identity.azp in ['parasol-claims-agent', 'parasol-fraud-agent']
              ? '{"error": "Forbidden", "message": "Parasol MCP gateway: access denied."}'
              : '{"error": "Forbidden", "message": "Parasol MCP gateway: calls must come through an approved agent (got azp=' + (has(auth.identity.azp) ? auth.identity.azp : '-') + ')."}'
