apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The governed tool path: one Gateway (OpenShift Gateway API / Istio), the MCP gateway data plane
# (broker + router, Connectivity Link 1.5) and the Connectivity Link policies that make identity real.
resources:
  - namespaces.yaml
  - kuadrant.yaml
  - gateway.yaml
  - route.yaml
  - referencegrant.yaml
  - mcpgatewayextension.yaml
  - guardrails-config.yaml   # NeMo guardrails on tool calls (Secret, no credential; wired by annotations)
  - authpolicy-mcp.yaml
  - authpolicy-tools.yaml
  - tool-scanner.yaml   # tool-description scanner + drift pins (Scenario 6)
  - decision-log-envoyfilter.yaml   # attributed gateway decisions in the gateway's access log (incident report)
  - adminnetworkpolicy.yaml   # operator-run MCP servers: only the gateway may call them (cluster-scoped)
configMapGenerator:
  - name: mcp-tool-scanner
    namespace: mcp-system
    files: [tool-scanner/scan.py]
