# Listener "mcps" (server side): may THIS identity call THIS tool on THIS server?
# The router sets x-mcp-servername (namespaced MCPServerRegistration name, e.g. parasol-secured/claims-db)
# and x-mcp-toolname; the token's resource_access[<server>].roles must contain "tool:<name>".
# This is the 403 Rebecca gets on approve_payout, and the reason Marcus does not.
apiVersion: kuadrant.io/v1
kind: AuthPolicy
metadata:
  name: mcp-tool-auth-policy
  namespace: gateway-system
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "4"
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: mcp-gateway
    sectionName: mcps
  rules:
    authentication:
      keycloak:
        jwt:
          issuerUrl: https://sso.apps.CLUSTER_DOMAIN/realms/parasol
    authorization:
      tool-access-check:
        when:
          # only the tools/call itself: the router's own hairpin initialize (first call per server) carries the tool name too
          - predicate: "request.headers.exists(h, h == 'x-mcp-toolname') && request.headers.exists(h, h == 'x-mcp-method') && request.headers['x-mcp-method'] == 'tools/call'"
        patternMatching:
          patterns:
            - predicate: |
                ('tool:' + request.headers['x-mcp-toolname']) in (has(auth.identity.resource_access) && auth.identity.resource_access.exists(p, p == request.headers['x-mcp-servername']) ? auth.identity.resource_access[request.headers['x-mcp-servername']].roles : [])
    response:
      unauthenticated:
        code: 401
        body:
          value: |
            {"error": "Unauthorized", "message": "Parasol MCP gateway: authentication required."}
      # message lands in the Authorino log ("outgoing authorization response"), so the 403 names user and tool
      unauthorized:
        code: 403
        message:
          expression: "'tool ' + request.headers['x-mcp-toolname'] + ' denied for ' + auth.identity.preferred_username"
        body:
          expression: |
            '{"error": "Forbidden", "message": "Parasol MCP gateway: ' + auth.identity.preferred_username + ' may not call ' + request.headers['x-mcp-toolname'] + '."}'
