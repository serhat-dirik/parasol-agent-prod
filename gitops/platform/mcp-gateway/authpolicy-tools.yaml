# Listener "mcps" (server side): may THIS identity call THIS tool on THIS server?
# The router sets x-mcp-servername (namespaced MCPServerRegistration name, e.g. parasol-secured/claims-db)
# and x-mcp-toolname; the token's resource_access[<server>].roles must contain "tool:<name>".
# This is the 403 Rebecca gets on approve_payout, and the reason Marcus does not.
# And: the call must come THROUGH AN APPROVED AGENT. The token's azp (the Keycloak client that obtained
# it by exchanging the user's token on their behalf) must be on the allow-list below; a user's own login
# token presented directly (azp=parasol-portal) is refused. The two refusals say which rule fired.
apiVersion: kuadrant.io/v1
kind: AuthPolicy
metadata:
  name: mcp-tool-auth-policy
  namespace: gateway-system
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "4"
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: mcp-gateway
    sectionName: mcps
  rules:
    authentication:
      keycloak:
        jwt:
          issuerUrl: https://sso.apps.CLUSTER_DOMAIN/realms/parasol
    authorization:
      approved-agent:
        # metrics: true -> auth_server_evaluator_denied{evaluator_name="approved-agent"} (dashboard: rejections
        # "not via an approved agent"); priority 0 runs it first, so a refusal is counted under one reason only
        metrics: true
        priority: 0
        patternMatching:
          patterns:
            - predicate: "has(auth.identity.azp) && auth.identity.azp in ['parasol-claims-agent', 'parasol-fraud-agent']"
      tool-access-check:
        metrics: true   # auth_server_evaluator_denied{evaluator_name="tool-access-check"}: the person lacks the tool role
        priority: 1
        when:
          # only the tools/call itself: the router's own hairpin initialize (first call per server) carries the tool name too
          - predicate: "request.headers.exists(h, h == 'x-mcp-toolname') && request.headers.exists(h, h == 'x-mcp-method') && request.headers['x-mcp-method'] == 'tools/call'"
        patternMatching:
          patterns:
            - predicate: |
                ('tool:' + request.headers['x-mcp-toolname']) in (has(auth.identity.resource_access) && auth.identity.resource_access.exists(p, p == request.headers['x-mcp-servername']) ? auth.identity.resource_access[request.headers['x-mcp-servername']].roles : [])
    response:
      # Attribution for the gateway decision log (decision-log-envoyfilter.yaml): the allowed request carries
      # x-parasol-caller to the upstream (Authorino overwrites any client value), the refusal carries it back.
      success:
        headers:
          x-parasol-caller:
            plain:
              expression: "'user=' + (has(auth.identity.preferred_username) ? auth.identity.preferred_username : '-') + ' agent=' + (has(auth.identity.azp) ? auth.identity.azp : '-')"
      unauthenticated:
        code: 401
        body:
          value: |
            {"error": "Unauthorized", "message": "Parasol MCP gateway: authentication required."}
      # message lands in the Authorino log ("outgoing authorization response"), so the 403 names user, agent and tool
      unauthorized:
        code: 403
        message:
          expression: |
            (has(auth.identity.azp) && auth.identity.azp in ['parasol-claims-agent', 'parasol-fraud-agent'] ? 'tool ' + request.headers['x-mcp-toolname'] + ' denied for ' : 'not via an approved agent: ') + auth.identity.preferred_username + ' azp=' + (has(auth.identity.azp) ? auth.identity.azp : '-')
        headers:
          x-parasol-caller:
            expression: "'user=' + (has(auth.identity.preferred_username) ? auth.identity.preferred_username : '-') + ' agent=' + (has(auth.identity.azp) ? auth.identity.azp : '-')"
        body:
          expression: |
            has(auth.identity.azp) && auth.identity.azp in ['parasol-claims-agent', 'parasol-fraud-agent']
              ? '{"error": "Forbidden", "message": "Parasol MCP gateway: ' + auth.identity.preferred_username + ' may not call ' + request.headers['x-mcp-toolname'] + '."}'
              : '{"error": "Forbidden", "message": "Parasol MCP gateway: calls must come through an approved agent (got azp=' + (has(auth.identity.azp) ? auth.identity.azp : '-') + ')."}'
