apiVersion: batch/v1
kind: Job
metadata:
  name: parasol-model-registrar
  namespace: observability
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: parasol-model-registrar
      containers:
        - name: register
          image: registry.access.redhat.com/ubi9/python-311:latest
          command: ["/usr/bin/python3", "/scripts/register-model.py"]
          env:
            # The registry's NetworkPolicy only admits the ingress router and RHOAI-generated
            # namespaces on 8443, so in-cluster callers reach it through its public route (hairpin
            # via the router); the kube-rbac-proxy still TokenReviews the SA token on either path.
            - {name: MR_BASE_URL, value: "https://parasol-model-registry-rest.apps.${CLUSTER_DOMAIN}"}
            - {name: MR_INSECURE, value: "1"}
            # Install contract (substituted by register.sh): each model's upstream host is recorded.
            - {name: AGENT_MODEL, value: "${AGENT_MODEL}"}
            - {name: AGENT_ENDPOINT, value: "${AGENT_ENDPOINT}"}
            - {name: JUDGE_MODEL, value: "${JUDGE_MODEL}"}
            # The three external models, registered as served by MaaS (endpoint = MAAS_BASE_URL/models-as-a-service/<name>/v1).
            - {name: MAAS_BASE_URL, value: "https://maas.apps.${CLUSTER_DOMAIN}"}
            - {name: AGENT_MODEL_NAME, value: "${AGENT_MODEL_NAME}"}
            - {name: GUARD_MODEL, value: "${GUARD_MODEL}"}
            - {name: GUARD_MODEL_NAME, value: "${GUARD_MODEL_NAME}"}
            - {name: GUARD_ENDPOINT, value: "${GUARD_ENDPOINT}"}
            - {name: JUDGE_MODEL_NAME, value: "${JUDGE_MODEL_NAME}"}
            - {name: JUDGE_ENDPOINT, value: "${JUDGE_ENDPOINT}"}
            - {name: HOME, value: "/tmp"}
          volumeMounts:
            - {name: scripts, mountPath: /scripts}
      volumes:
        - name: scripts
          configMap: {name: parasol-model-registrar}
