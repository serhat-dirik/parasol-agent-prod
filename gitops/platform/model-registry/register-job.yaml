apiVersion: batch/v1
kind: Job
metadata:
  name: parasol-model-registrar
  namespace: observability
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: parasol-model-registrar
      containers:
        - name: register
          image: registry.access.redhat.com/ubi9/python-311:latest
          command: ["/usr/bin/python3", "/scripts/register-model.py"]
          env:
            # The registry's NetworkPolicy only admits the ingress router and RHOAI-generated
            # namespaces on 8443, so in-cluster callers reach it through its public route (hairpin
            # via the router); the kube-rbac-proxy still TokenReviews the SA token on either path.
            - {name: MR_BASE_URL, value: "https://parasol-model-registry-rest.apps.${CLUSTER_DOMAIN}"}
            - {name: MLFLOW_UI_BASE, value: "https://rh-ai.apps.${CLUSTER_DOMAIN}/mlflow"}
            - {name: MR_INSECURE, value: "1"}
            # Install contract (substituted by register.sh): recorded as model_id / maas_endpoint_host.
            - {name: AGENT_MODEL, value: "${AGENT_MODEL}"}
            - {name: AGENT_ENDPOINT, value: "${AGENT_ENDPOINT}"}
            - {name: HOME, value: "/tmp"}
            # This cluster's golden-set runs (scripts/eval-seed.sh); empty = the reference ids.
            - {name: MLFLOW_EXPERIMENT_ID, value: "${MLFLOW_EXPERIMENT_ID}"}
            - {name: RUN_ID_PRODUCTION, value: "${RUN_ID_PRODUCTION}"}
            - {name: RUN_ID_CANDIDATE, value: "${RUN_ID_CANDIDATE}"}
          volumeMounts:
            - {name: scripts, mountPath: /scripts}
      volumes:
        - name: scripts
          configMap: {name: parasol-model-registrar}
