apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: sign-images
  labels: {app.kubernetes.io/version: "0.1"}
spec:
  description: >-
    cosign-sign all THREE Parasol images (parasol-portal, claims-db, policy-docs) with the cluster
    signing key (the same key Tekton Chains uses, copied into parasol-build as cosign-signing-key).
    Tekton Chains only signs images produced by a Tekton TaskRun (the portal), so claims-db and
    policy-docs - built by BuildConfigs - are signed here. Verifies each signature before returning.
  params:
    - {name: portal-image, type: string}
    - {name: portal-digest, type: string}
    - {name: claims-db-image, type: string, default: "image-registry.openshift-image-registry.svc:5000/parasol-build/claims-db:latest"}
    - {name: policy-docs-image, type: string, default: "image-registry.openshift-image-registry.svc:5000/parasol-build/policy-docs:latest"}
  results:
    - {name: SIGNED, description: comma-separated list of signed images}
  volumes:
    - {name: keys, secret: {secretName: cosign-signing-key}}
    - {name: svcca, configMap: {name: openshift-service-ca.crt}}
  steps:
    - name: sign
      image: quay.io/redhat-appstudio/rhtap-task-runner:latest
      env:
        - {name: SSL_CERT_FILE, value: /svcca/service-ca.crt}
        - {name: COSIGN_PASSWORD, valueFrom: {secretKeyRef: {name: cosign-signing-key, key: cosign.password}}}
      volumeMounts:
        - {name: keys, mountPath: /keys, readOnly: true}
        - {name: svcca, mountPath: /svcca, readOnly: true}
      script: |
        #!/usr/bin/env bash
        set -eu
        TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
        mkdir -p "$HOME/.docker"
        AUTH=$(printf "pipeline:%s" "$TOKEN" | base64 | tr -d '\n')
        printf '{"auths":{"image-registry.openshift-image-registry.svc:5000":{"auth":"%s"}}}' "$AUTH" > "$HOME/.docker/config.json"
        PORTAL="$(params.portal-image)@$(params.portal-digest)"
        CLAIMS="$(params.claims-db-image)"
        DOCS="$(params.policy-docs-image)"
        for IMG in "$PORTAL" "$CLAIMS" "$DOCS"; do
          echo "===== cosign sign $IMG ====="
          cosign sign --key /keys/cosign.key --tlog-upload=false --allow-insecure-registry --yes "$IMG"
        done
        echo "===== verify all three ====="
        for IMG in "$PORTAL" "$CLAIMS" "$DOCS"; do
          cosign verify --key /keys/cosign.pub --insecure-ignore-tlog=true --allow-insecure-registry "$IMG" >/dev/null \
            && echo "VERIFIED $IMG"
        done
        printf "parasol-portal,claims-db,policy-docs" > "$(results.SIGNED.path)"
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: register-model-version
  labels: {app.kubernetes.io/version: "0.1"}
spec:
  description: >-
    Governance: stamp this release's agent-eval result onto the matching ModelVersion of the RHOAI
    Model Registry RegisteredModel parasol-claims-assistant. The served model is an EXTERNAL MaaS
    model (qwen3-14b), so a ModelVersion is the agent CONFIG (prompt version + tools-authpolicy
    sha + model id); this step writes the gate result, pass-rate/score, MLflow run id and prompt@version
    that the agent-eval gate just produced onto that version, so the registry UI shows what the pipeline
    evaluated. Best-effort by design: it never fails the pipeline (the agent-eval gate alone decides
    promotion), it only records provenance. Reuses gitops/platform/model-registry/register-model.py
    from the cloned source. The registry NetworkPolicy admits only the ingress router + RHOAI
    namespaces on 8443, so it is reached through the registry's public route (kube-rbac-proxy still
    TokenReviews the pipeline SA, which holds registry-user via gitops/platform/model-registry/rbac.yaml).
  params:
    - {name: candidate, type: string, default: candidate-shortened}
    - {name: gate, type: string}
    - {name: score, type: string}
    - {name: mlflow-run-id, type: string}
    - {name: prompt-ref, type: string, default: ""}
    - {name: mr-base-url, type: string, default: "https://parasol-model-registry-rest.apps.CLUSTER_DOMAIN"}
    - {name: mlflow-ui-base, type: string, default: "https://rh-ai.apps.CLUSTER_DOMAIN/mlflow"}
    - {name: script-path, type: string, default: "source/gitops/platform/model-registry/register-model.py"}
  results:
    - {name: version-ref, description: "the RegisteredModel:version this run stamped its eval onto"}
  workspaces:
    - {name: source}
  steps:
    - name: stamp
      image: registry.access.redhat.com/ubi9/python-311:latest
      workingDir: $(workspaces.source.path)
      env:
        - {name: MR_BASE_URL, value: "$(params.mr-base-url)"}
        - {name: MLFLOW_UI_BASE, value: "$(params.mlflow-ui-base)"}
        - {name: MR_INSECURE, value: "1"}
        - {name: HOME, value: "/tmp"}
      script: |
        #!/usr/bin/env bash
        set -u
        printf "parasol-claims-assistant:%s" "$(params.candidate)" > "$(results.version-ref.path)"
        echo "Stamping agent-eval result onto model-registry version $(params.candidate): gate=$(params.gate) score=$(params.score) run=$(params.mlflow-run-id)"
        python3 "$(params.script-path)" --patch-eval \
          --version "$(params.candidate)" \
          --gate "$(params.gate)" \
          --score "$(params.score)" \
          --run-id "$(params.mlflow-run-id)" \
          --prompt-ref "$(params.prompt-ref)" \
          || echo "model-registry stamp skipped (non-fatal): registry unreachable or version not registered yet"
