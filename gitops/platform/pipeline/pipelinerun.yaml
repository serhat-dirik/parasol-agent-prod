# Release run of the Parasol secure supply-chain pipeline (not synced by Argo CD; a run is an event).
#   oc create -n parasol-build -f gitops/platform/pipeline/pipelinerun.yaml
# candidate production (the production prompt) passes the agent-eval gate and promotes; the named runs the
# guide shows are created by scripts/pipeline-runs.sh (parasol-portal-release-production and
# parasol-portal-release-candidate-shortened, where the gate blocks the shortened candidate prompt).
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: parasol-portal-release-
  namespace: parasol-build
spec:
  pipelineRef: {name: parasol-portal-secure-build}
  params:
    - name: candidate
      value: production
    - name: prompt-ref
      value: parasol-claims-assistant-system-prompt@production
  timeouts: {pipeline: 1h30m0s}
  taskRunTemplate:
    serviceAccountName: pipeline
  taskRunSpecs:
    # The keyless signature identity is the SPIFFE ID of this service account.
    - {pipelineTaskName: keyless-sign, serviceAccountName: keyless-signer}
  workspaces:
    - name: workspace
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources: {requests: {storage: 2Gi}}
