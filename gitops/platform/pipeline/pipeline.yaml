# Parasol secure supply-chain pipeline (layer 6), namespace parasol-build.
# Reads like the Red Hat tssc reference: init -> clone-repository -> build-container (the portal, from source;
# git-clone and buildah are the Tasks OpenShift Pipelines ships, by the cluster resolver) -> scan + SBOM, a lifecycle
# gate (agent-eval), the Conforma contract, then promote: the released prompt (registered from Git by the gate) is
# pinned as ConfigMap agent-prompt-release and the signed digest on the Argo CD Application env-secured (no Git
# write); Argo CD rolls it out and admission verifies it.
# Signing is not a step: Tekton Chains (a controller outside the pipeline) signs the image build-container produced,
# and its SLSA provenance, keyless with Trusted Artifact Signer (a 10-minute Fulcio certificate for its own SPIFFE
# identity, entries in Rekor). No pipeline step holds a signing key.
# Synced by the Argo CD Application platform-pipeline; PipelineRuns are created by hand (pipelinerun.yaml).
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: parasol-portal-secure-build
  labels:
    pipelines.openshift.io/runtime: quarkus
    pipelines.openshift.io/strategy: docker
spec:
  params:
    - {name: git-url, type: string, default: "https://github.com/serhat-dirik/parasol-agent-prod.git"}
    - {name: revision, type: string, default: "main"}
    - {name: output-image, type: string, default: "image-registry.openshift-image-registry.svc:5000/parasol-build/parasol-portal:signed"}
    - {name: path-context, type: string, default: "source/apps/parasol-portal/app"}
    - {name: dockerfile, type: string, default: "Containerfile"}
    # Agent config the gate evaluates: production (the production prompt, passes) or
    # candidate-shortened (the shortened candidate prompt, blocked). Recorded as the agent version's variant.
    - {name: candidate, type: string, default: "production"}
    # MLflow Prompt Registry entry the gate evaluated; promote records it on the Application.
    - {name: prompt-ref, type: string, default: "parasol-claims-assistant-system-prompt@production"}
    # The prompt's authoring source in the cloned repo; the release registers it as prompt-ref and pins it.
    - {name: prompt-file, type: string, default: "source/gitops/envs/secured/system-prompt.txt"}
  results:
    - {name: IMAGE_URL, value: "$(tasks.build-container.results.IMAGE_URL)"}
    - {name: IMAGE_DIGEST, value: "$(tasks.build-container.results.IMAGE_DIGEST)"}
    - {name: EVAL_SCORE, value: "$(tasks.agent-eval.results.score)"}
    - {name: EVAL_GATE, value: "$(tasks.agent-eval.results.gate)"}
    - {name: MLFLOW_RUN_ID, value: "$(tasks.agent-eval.results.mlflow-run-id)"}
    - {name: AGENT_VERSION, value: "$(tasks.register-agent-version.results.agent-version)"}
    - {name: PROMOTED_DIGEST, value: "$(tasks.promote.results.digest)"}
    - {name: SBOM_COMPONENTS, value: "$(tasks.generate-sbom.results.SBOM_COMPONENTS)"}
    - {name: SBOM_SHA256, value: "$(tasks.generate-sbom.results.SBOM_SHA256)"}
  workspaces:
    - {name: workspace}
  tasks:
    - name: init
      taskRef: {name: init}
      params:
        - {name: image-url, value: "$(params.output-image)"}
    - name: clone-repository
      runAfter: [init]
      when:
        - {input: "$(tasks.init.results.build)", operator: in, values: ["true"]}
      taskRef:
        resolver: cluster
        params: [{name: kind, value: task}, {name: name, value: git-clone}, {name: namespace, value: openshift-pipelines}]
      params:
        - {name: URL, value: "$(params.git-url)"}
        - {name: REVISION, value: "$(params.revision)"}
        - {name: SUBDIRECTORY, value: source}
      workspaces:
        - {name: output, workspace: workspace}
    - name: build-container
      runAfter: [clone-repository]
      taskRef:
        resolver: cluster
        params: [{name: kind, value: task}, {name: name, value: buildah}, {name: namespace, value: openshift-pipelines}]
      params:
        - {name: IMAGE, value: "$(params.output-image)"}
        - {name: DOCKERFILE, value: "$(params.dockerfile)"}
        - {name: CONTEXT, value: "$(params.path-context)"}
        - {name: TLS_VERIFY, value: "false"}   # the internal registry's certificate is from the service CA
      workspaces:
        - {name: source, workspace: workspace}
    - name: scan-image
      runAfter: [build-container]
      taskRef: {name: scan-image}
      params:
        - {name: image, value: "$(params.output-image)"}
        - {name: image-digest, value: "$(tasks.build-container.results.IMAGE_DIGEST)"}
    - name: generate-sbom
      runAfter: [build-container]
      taskRef: {name: generate-sbom}
      params:
        - {name: image, value: "$(params.output-image)"}
        - {name: image-digest, value: "$(tasks.build-container.results.IMAGE_DIGEST)"}
      workspaces:
        - {name: source, workspace: workspace}
    - name: agent-eval
      runAfter: [build-container]
      taskRef: {name: agent-eval-evalhub}   # the golden-set gate as a TrustyAI EvalHub job (provider parasol-agent-gate)
      params:
        - {name: candidate, value: "$(params.candidate)"}
        - {name: prompt-ref, value: "$(params.prompt-ref)"}
        - {name: prompt-file, value: "$(params.prompt-file)"}
      workspaces:
        - {name: source, workspace: workspace}
    # Governance: record the evaluated agent config as an MLflow agent version (parasol-claims-agent x.y.0) with the
    # agent-eval result. Every release, passed or not; never blocks promotion.
    - name: register-agent-version
      runAfter: [agent-eval]
      taskRef: {name: register-agent-version}
      params:
        - {name: candidate, value: "$(params.candidate)"}
        - {name: gate, value: "$(tasks.agent-eval.results.gate)"}
        - {name: score, value: "$(tasks.agent-eval.results.score)"}
        - {name: mlflow-run-id, value: "$(tasks.agent-eval.results.mlflow-run-id)"}
        - {name: prompt-ref, value: "$(params.prompt-ref)"}
        - {name: image-digest, value: "$(tasks.build-container.results.IMAGE_DIGEST)"}
      workspaces:
        - {name: source, workspace: workspace}
    # Conforma: Tekton Chains' keyless signature and SLSA provenance verify (TAS certificate identity + Rekor), and
    # the policy holds.
    - name: verify-conforma
      runAfter: [build-container]
      taskRef: {name: verify-conforma}
      params:
        - {name: image, value: "$(params.output-image)"}
        - {name: image-digest, value: "$(tasks.build-container.results.IMAGE_DIGEST)"}
    - name: promote
      runAfter: [scan-image, generate-sbom, agent-eval, verify-conforma, register-agent-version]
      when:
        - {input: "$(tasks.agent-eval.results.gate)", operator: in, values: ["passed"]}
        - {input: "$(tasks.verify-conforma.results.verified)", operator: in, values: ["true"]}
      taskRef: {name: promote}
      params:
        - {name: image, value: "$(params.output-image)"}
        - {name: image-digest, value: "$(tasks.build-container.results.IMAGE_DIGEST)"}
        - {name: prompt-ref, value: "$(params.prompt-ref)"}
        - {name: prompt-sha256, value: "$(tasks.agent-eval.results.prompt-sha256)"}
        - {name: agent-version, value: "$(tasks.register-agent-version.results.agent-version)"}
        - {name: agent-version-id, value: "$(tasks.register-agent-version.results.agent-version-id)"}
        - {name: mlflow-run-id, value: "$(tasks.agent-eval.results.mlflow-run-id)"}
        - {name: model-only-passed, value: "$(tasks.agent-eval.results.model-only-passed)"}
      workspaces:
        - {name: source, workspace: workspace}
  finally:
    - name: show-sbom
      taskRef: {name: show-sbom}
      params:
        - {name: IMAGE_URL, value: "$(tasks.build-container.results.IMAGE_URL)"}
        - {name: IMAGE_DIGEST, value: "$(tasks.build-container.results.IMAGE_DIGEST)"}
        - {name: SBOM_SHA256, value: "$(tasks.generate-sbom.results.SBOM_SHA256)"}
        - {name: SBOM_COMPONENTS, value: "$(tasks.generate-sbom.results.SBOM_COMPONENTS)"}
    - name: show-summary
      taskRef: {name: summary}
      params:
        - {name: pipelinerun-name, value: "$(context.pipelineRun.name)"}
        - {name: git-url, value: "$(params.git-url)"}
        - {name: image-url, value: "$(params.output-image)"}
        - {name: build-task-status, value: "$(tasks.build-container.status)"}
