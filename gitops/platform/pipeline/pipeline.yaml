# Parasol secure supply-chain pipeline (layer 6), namespace parasol-build.
# Reads like the Red Hat tssc reference: init -> clone-repository -> build-container (the portal,
# from source) -> scan + SBOM, a lifecycle gate (agent-eval), keyless (Trusted Artifact Signer) and
# keyed (cluster cosign key) signatures, the Conforma contract, then promote: a commit that pins the
# signed digest into the secured overlay, which Argo CD rolls out and admission verifies.
# Synced by the Argo CD Application platform-pipeline; PipelineRuns are created by hand (pipelinerun.yaml).
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: parasol-portal-secure-build
  labels:
    pipelines.openshift.io/runtime: quarkus
    pipelines.openshift.io/strategy: docker
spec:
  params:
    - {name: git-url, type: string, default: "https://github.com/serhat-dirik/parasol-agent-prod.git"}
    - {name: revision, type: string, default: "main"}
    - {name: output-image, type: string, default: "image-registry.openshift-image-registry.svc:5000/parasol-build/parasol-portal:signed"}
    - {name: path-context, type: string, default: "source/apps/parasol-portal/app"}
    - {name: dockerfile, type: string, default: "Containerfile"}
    # Agent config version the gate evaluates (v1 = current prompt, passes; v2 = simplified, blocked).
    - {name: candidate, type: string, default: "v1"}
    # MLflow Prompt Registry entry the gate evaluated and the promotion commit references.
    - {name: prompt-ref, type: string, default: "parasol-claims-assistant-system-prompt@1"}
  results:
    - {name: IMAGE_URL, value: "$(tasks.build-container.results.IMAGE_URL)"}
    - {name: IMAGE_DIGEST, value: "$(tasks.build-container.results.IMAGE_DIGEST)"}
    - {name: EVAL_SCORE, value: "$(tasks.agent-eval.results.score)"}
    - {name: EVAL_GATE, value: "$(tasks.agent-eval.results.gate)"}
    - {name: MLFLOW_RUN_ID, value: "$(tasks.agent-eval.results.mlflow-run-id)"}
    - {name: REGISTERED_MODEL_VERSION, value: "$(tasks.register-model-version.results.version-ref)"}
    - {name: SIGNED_IMAGES, value: "$(tasks.sign-images.results.SIGNED)"}
    - {name: KEYLESS_SIGNED_IMAGES, value: "$(tasks.keyless-sign.results.SIGNED)"}
    - {name: PROMOTION_COMMIT, value: "$(tasks.promote.results.commit)"}
    - {name: SBOM_COMPONENTS, value: "$(tasks.generate-sbom.results.SBOM_COMPONENTS)"}
  workspaces:
    - {name: workspace}
  tasks:
    - name: init
      taskRef: {name: init}
      params:
        - {name: image-url, value: "$(params.output-image)"}
    - name: clone-repository
      runAfter: [init]
      when:
        - {input: "$(tasks.init.results.build)", operator: in, values: ["true"]}
      taskRef: {name: git-clone}
      params:
        - {name: url, value: "$(params.git-url)"}
        - {name: revision, value: "$(params.revision)"}
      workspaces:
        - {name: output, workspace: workspace}
    - name: build-container
      runAfter: [clone-repository]
      taskRef: {name: buildah}
      params:
        - {name: IMAGE, value: "$(params.output-image)"}
        - {name: DOCKERFILE, value: "$(params.dockerfile)"}
        - {name: CONTEXT, value: "$(params.path-context)"}
      workspaces:
        - {name: source, workspace: workspace}
    - name: scan-image
      runAfter: [build-container]
      taskRef: {name: scan-image}
      params:
        - {name: image, value: "$(params.output-image)"}
        - {name: image-digest, value: "$(tasks.build-container.results.IMAGE_DIGEST)"}
    - name: generate-sbom
      runAfter: [build-container]
      taskRef: {name: generate-sbom}
      params:
        - {name: image, value: "$(params.output-image)"}
        - {name: image-digest, value: "$(tasks.build-container.results.IMAGE_DIGEST)"}
      workspaces:
        - {name: source, workspace: workspace}
    - name: agent-eval
      runAfter: [build-container]
      taskRef: {name: agent-eval}
      params:
        - {name: candidate, value: "$(params.candidate)"}
      workspaces:
        - {name: source, workspace: workspace}
    # Governance: stamp the agent-eval result (gate, score, MLflow run id, prompt@version) onto the
    # matching RHOAI Model Registry ModelVersion. Consumes agent-eval's results; never blocks promotion.
    - name: register-model-version
      runAfter: [agent-eval]
      taskRef: {name: register-model-version}
      params:
        - {name: candidate, value: "$(params.candidate)"}
        - {name: gate, value: "$(tasks.agent-eval.results.gate)"}
        - {name: score, value: "$(tasks.agent-eval.results.score)"}
        - {name: mlflow-run-id, value: "$(tasks.agent-eval.results.mlflow-run-id)"}
        - {name: prompt-ref, value: "$(params.prompt-ref)"}
      workspaces:
        - {name: source, workspace: workspace}
    - name: verify-enterprise-contract
      runAfter: [sign-images, keyless-sign]
      taskRef: {name: verify-enterprise-contract}
      params:
        - {name: image, value: "$(params.output-image)"}
        - {name: image-digest, value: "$(tasks.build-container.results.IMAGE_DIGEST)"}
    - name: sign-images
      runAfter: [build-container]
      taskRef: {name: sign-images}
      params:
        - {name: portal-image, value: "$(params.output-image)"}
        - {name: portal-digest, value: "$(tasks.build-container.results.IMAGE_DIGEST)"}
    # Keyless signature: SPIFFE JWT-SVID -> Fulcio certificate -> Rekor entry (runs as SA keyless-signer).
    - name: keyless-sign
      runAfter: [build-container]
      taskRef: {name: keyless-sign-images}
      params:
        - {name: portal-image, value: "$(params.output-image)@$(tasks.build-container.results.IMAGE_DIGEST)"}
    - name: promote
      runAfter: [scan-image, agent-eval, verify-enterprise-contract]
      when:
        - {input: "$(tasks.agent-eval.results.gate)", operator: in, values: ["passed"]}
        - {input: "$(tasks.verify-enterprise-contract.results.verified)", operator: in, values: ["true"]}
      taskRef: {name: promote}
      params:
        - {name: image, value: "$(params.output-image)"}
        - {name: image-digest, value: "$(tasks.build-container.results.IMAGE_DIGEST)"}
        - {name: prompt-ref, value: "$(params.prompt-ref)"}
        - {name: model-ref, value: "parasol-claims-assistant:$(params.candidate)"}
      workspaces:
        - {name: source, workspace: workspace}
  finally:
    - name: show-sbom
      taskRef: {name: show-sbom}
      params:
        - {name: IMAGE_URL, value: "$(tasks.build-container.results.IMAGE_URL)"}
    - name: show-summary
      taskRef: {name: summary}
      params:
        - {name: pipelinerun-name, value: "$(context.pipelineRun.name)"}
        - {name: git-url, value: "$(params.git-url)"}
        - {name: image-url, value: "$(params.output-image)"}
        - {name: build-task-status, value: "$(tasks.build-container.status)"}
