apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The pipeline Tasks and Pipeline live in parasol-build alongside the BuildConfigs.
# Operators (gitops/platform/pipeline/operators) and the admission webhook/policy
# (gitops/platform/pipeline/admission) are cluster-scoped / other namespaces and are
# applied directly, not from this kustomization. The build/ and eval/ files are plain
# build context and gate data fetched by the pipeline's git-clone, not k8s manifests.
namespace: parasol-build
resources:
  - tasks.yaml
  - pipeline.yaml
