# Secure supply-chain operators for the lifecycle gate (layer 6).
# - Trusted Artifact Signer (rhtas): Rekor + Fulcio for keyless image signing.
# - Sigstore policy-controller: admission that refuses unsigned images.
# Installed AllNamespaces into openshift-operators (global OperatorGroup).
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: rhtas-operator
  namespace: openshift-operators
spec:
  channel: stable
  name: rhtas-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: policy-controller-operator
  namespace: openshift-operators
spec:
  channel: stable
  name: policy-controller-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
