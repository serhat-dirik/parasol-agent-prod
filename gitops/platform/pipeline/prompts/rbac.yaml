apiVersion: v1
kind: ServiceAccount
metadata:
  name: parasol-prompt-registrar
  namespace: observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prompt-registrar-mlflow-edit
  namespace: parasol-secured
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mlflow-operator-mlflow-edit
subjects:
  - kind: ServiceAccount
    name: parasol-prompt-registrar
    namespace: observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prompt-registrar-mlflow-view
  namespace: parasol-secured
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mlflow-operator-mlflow-view
subjects:
  - kind: ServiceAccount
    name: parasol-prompt-registrar
    namespace: observability
