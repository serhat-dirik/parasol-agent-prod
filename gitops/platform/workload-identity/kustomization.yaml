# SPIRE/SPIFFE workload identity (Zero Trust Workload Identity Manager). Applied by
# scripts/supply-chain.sh once the operator (gitops/bootstrap/operators/supply-chain.yaml) is up:
#   kustomize build gitops/platform/workload-identity | envsubst '$CLUSTER_DOMAIN' | oc apply -f -
# The pipeline's keyless signer gets its SPIFFE ID from here (gitops/platform/tas/clusterspiffeid-signer.yaml).
# 40-test-workload.yaml (an SVID proof pod) is kept for reference but not applied.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - 10-zero-trust-manager.yaml
  - 20-spire.yaml
  - 30-clusterspiffeid.yaml
  - 50-oidc-discovery.yaml
