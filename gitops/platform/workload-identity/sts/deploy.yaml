apiVersion: v1
kind: Namespace
metadata:
  name: parasol-sts-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sts
  namespace: parasol-sts-demo
  labels: { app: sts }
spec:
  replicas: 1
  selector:
    matchLabels: { app: sts }
  template:
    metadata:
      labels: { app: sts }
    spec:
      containers:
        - name: sts
          image: registry.access.redhat.com/ubi9/python-311:latest
          command: ["python3", "/app/sts.py"]
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 3
          volumeMounts:
            - name: code
              mountPath: /app
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
      volumes:
        - name: code
          configMap: { name: sts-code }
---
apiVersion: v1
kind: Service
metadata:
  name: sts
  namespace: parasol-sts-demo
spec:
  selector: { app: sts }
  ports:
    - port: 8080
      targetPort: 8080
