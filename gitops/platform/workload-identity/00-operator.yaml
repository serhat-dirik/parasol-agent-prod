# Red Hat OpenShift Zero Trust Workload Identity Manager (SPIRE/SPIFFE).
# Installed imperatively (like the other operator subscriptions in gitops/bootstrap/operators),
# NOT wired into Argo, to keep this stream additive and isolated from the wave-1 rollout.
# Operator package: openshift-zero-trust-workload-identity-manager, channel stable-v1 (v1.1.1).
apiVersion: v1
kind: Namespace
metadata:
  name: zero-trust-workload-identity-manager
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: zero-trust-workload-identity-manager
  namespace: zero-trust-workload-identity-manager
spec: {}  # AllNamespaces: the owned CRDs (ClusterSPIFFEID, SpireServer, ...) are cluster-scoped
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: openshift-zero-trust-workload-identity-manager
  namespace: zero-trust-workload-identity-manager
spec:
  channel: stable-v1
  installPlanApproval: Automatic
  name: openshift-zero-trust-workload-identity-manager
  source: redhat-operators
  sourceNamespace: openshift-marketplace
