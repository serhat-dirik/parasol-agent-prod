# Scrape the secured portal's /q/metrics (parasol_agent_tokens_total{...,user}, model calls) so the
# per-user token-spend alert and the console dashboards see the portal, not just the REST agent.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: parasol-portal
  namespace: parasol-secured
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  selector:
    matchLabels: {app: portal}
  endpoints:
    - port: http
      path: /q/metrics
      interval: 15s
