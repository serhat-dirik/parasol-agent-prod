# The "3am" alert: the assistant burning tokens far above the normal interactive rate, attributed to
# the user driving it. Demo 3 beat 3: ParasolAssistantTokenSpendHigh fires with the user and namespace.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: parasol-agent-alerts
  namespace: parasol-secured
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  groups:
    - name: parasol-agent
      rules:
        - alert: ParasolAssistantTokenSpendHigh
          # Per user: a single account looping off-topic requests (the night shift) crosses the
          # threshold on its own. The portal tags the token counter with the caller's username;
          # until then this still fires on the namespace aggregate (user empty).
          expr: sum by (namespace, user) (rate(parasol_agent_tokens_total[2m])) * 60 > 20000
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "Assistant token spend high for user {{ $labels.user }} in {{ $labels.namespace }}"
            description: "User {{ $labels.user }} is driving the assistant at {{ $value | humanize }} tokens/min, far above normal interactive load. Possible runaway loop or denial-of-wallet. Disable the user in Keycloak and/or revoke model access via GitOps (envs/secured/kill-switch), then inspect the trace in Observe > Traces / MLflow."
        - alert: ParasolAssistantToolDenied
          expr: increase(http_server_requests_seconds_count{job=~"parasol.*", status="403"}[5m]) > 3
          for: 0m
          labels:
            severity: info
          annotations:
            summary: "Repeated tool denials from the MCP gateway for the Parasol assistant"
