# The "3am" alert: the assistant burning tokens far above the normal interactive rate, attributed to
# the user driving it and the agent acting for them. Scenario 3: fires naming user, agent and namespace.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: parasol-agent-alerts
  namespace: parasol-secured
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  groups:
    - name: parasol-agent
      rules:
        - alert: ParasolAssistantTokenSpendHigh
          # Per user: a single account looping heavy requests (the night shift) crosses the threshold on
          # its own. Threshold 5000 tokens/min is well above normal single-user interactive load
          # (an adjuster runs a few hundred to low-thousands/min) and below the measured night-shift rate
          # (~9000/min for nina.contractor). The portal tags the counter with the caller's username.
          expr: sum by (namespace, user, agent) (rate(parasol_agent_tokens_total[2m])) * 60 > 5000
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "Assistant token spend high for user {{ $labels.user }} via agent {{ $labels.agent }} in {{ $labels.namespace }}"
            description: "Agent {{ $labels.agent }} on behalf of user {{ $labels.user }} is spending {{ $value | humanize }} tokens/min, far above normal interactive load. Possible runaway loop or denial-of-wallet. Disable the user in Keycloak, or switch on the kill switch on the Argo CD Application env-secured; the traces are in MLflow (workspace parasol-secured, filter by user)."
        - alert: ParasolAssistantToolDenied
          expr: increase(http_server_requests_seconds_count{job=~"parasol.*", status="403"}[5m]) > 3
          for: 0m
          labels:
            severity: info
          annotations:
            summary: "Repeated tool denials from the MCP gateway for the Parasol assistant"
