# The "3am" alert: the assistant burning tokens far above the normal interactive rate, attributed to
# the user driving it and the agent acting for them. Scenario 3: fires naming user, agent and namespace.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: parasol-agent-alerts
  namespace: parasol-secured
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  groups:
    - name: parasol-agent
      rules:
        - alert: ParasolAssistantTokenSpendHigh
          # Denial-of-wallet, per user and agent: a burst above 5000 tokens/min (peak of the 2m rate in the
          # last 10 min) that ALSO ran the user into the MaaS usage limit (a 429 in the last 10 min).
          # Rate alone cannot tell the night shift (~9000/min for 2-3 min, nina.contractor) from staff
          # asking a few questions back to back (one turn is 4-8k tokens, so 8-12k/min over 2m); the
          # exhausted budget can. The portal tags both counters with the caller's username.
          # The 429 counter is created at the user's first refusal with value 1, so increase() alone misses a
          # first 429 (no earlier sample); "unless ... offset 10m" catches a counter born in the last 10 min.
          expr: |
            max_over_time((sum by (namespace, user, agent) (rate(parasol_agent_tokens_total[2m])) * 60)[10m:30s]) > 5000
            and on (namespace, user, agent)
            (
              sum by (namespace, user, agent) (increase(parasol_agent_rejections_total{reason="usage_limit"}[10m])) > 0
              or
              sum by (namespace, user, agent) (parasol_agent_rejections_total{reason="usage_limit"}
                unless parasol_agent_rejections_total{reason="usage_limit"} offset 10m) > 0
            )
          for: 30s
          # keep it up long enough to be the morning report, not a blip
          keep_firing_for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Assistant token spend high for user {{ $labels.user }} via agent {{ $labels.agent }} in {{ $labels.namespace }}"
            description: "Agent {{ $labels.agent }} on behalf of user {{ $labels.user }} is spending {{ $value | humanize }} tokens/min, far above normal interactive load. Possible runaway loop or denial-of-wallet. Switch the user off (scripts/kill-switch.sh user <name> off), the agent (scripts/kill-switch.sh agent <agent> off), or every Parasol model key (scripts/kill-switch.sh parasol off); the traces are in MLflow (workspace parasol-secured, filter by user)."
        - alert: ParasolAssistantToolDenied
          expr: increase(http_server_requests_seconds_count{job=~"parasol.*", status="403"}[5m]) > 3
          for: 0m
          labels:
            severity: info
          annotations:
            summary: "Repeated tool denials from the MCP gateway for the Parasol assistant"
---
# Someone other than the release tried to change the released prompt (ConfigMap parasol-secured/agent-prompt-release)
# and admission policy parasol-released-prompt-writer refused it (gitops/envs/secured/prompt-pin-policy.yaml).
# The metric is the API server's (namespace "default"), so the platform Prometheus evaluates this rule.
# Who tried: the API server audit log, or the refusal message the client received.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: parasol-released-prompt
  namespace: openshift-monitoring
spec:
  groups:
    - name: parasol-released-prompt
      rules:
        - alert: ParasolReleasedPromptChangeRefused
          # "unless ... offset 10m" catches a counter born in the last 10 min (its first refusal), which increase() misses.
          expr: |
            sum(increase(apiserver_validating_admission_policy_check_total{policy="parasol-released-prompt-writer",enforcement_action="deny"}[10m])) > 0
            or
            sum(apiserver_validating_admission_policy_check_total{policy="parasol-released-prompt-writer",enforcement_action="deny"}
              unless apiserver_validating_admission_policy_check_total{policy="parasol-released-prompt-writer",enforcement_action="deny"} offset 10m) > 0
          for: 0m
          keep_firing_for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Refused attempt to change the Parasol assistant's released system prompt"
            description: "Only the release pipeline may change ConfigMap parasol-secured/agent-prompt-release; another identity tried and was refused. The audit log names who."
