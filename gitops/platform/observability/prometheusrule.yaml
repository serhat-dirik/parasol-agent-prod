# The "3am" alert: the assistant burning tokens far above the normal interactive rate, attributed to
# the user driving it and the agent acting for them. Scenario 3: fires naming user, agent and namespace.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: parasol-agent-alerts
  namespace: parasol-secured
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  groups:
    - name: parasol-agent
      rules:
        - alert: ParasolAssistantTokenSpendHigh
          # Denial-of-wallet, per user and agent: a burst above 5000 tokens/min (peak of the 2m rate in the
          # last 10 min) that ALSO ran the user into the MaaS usage limit (a 429 in the last 10 min).
          # Rate alone cannot tell the night shift (~9000/min for 2-3 min, nina.contractor) from staff
          # asking a few questions back to back (one turn is 4-8k tokens, so 8-12k/min over 2m); the
          # exhausted budget can. The portal tags both counters with the caller's username.
          expr: |
            max_over_time((sum by (namespace, user, agent) (rate(parasol_agent_tokens_total[2m])) * 60)[10m:30s]) > 5000
            and on (namespace, user, agent)
            sum by (namespace, user, agent) (increase(parasol_agent_rejections_total{reason="usage_limit"}[10m])) > 0
          for: 30s
          # keep it up long enough to be the morning report, not a blip
          keep_firing_for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Assistant token spend high for user {{ $labels.user }} via agent {{ $labels.agent }} in {{ $labels.namespace }}"
            description: "Agent {{ $labels.agent }} on behalf of user {{ $labels.user }} is spending {{ $value | humanize }} tokens/min, far above normal interactive load. Possible runaway loop or denial-of-wallet. Disable the user in Keycloak, switch the agent off (scripts/agent-switch.sh), or take every agent offline (scripts/kill-switch.sh off); the traces are in MLflow (workspace parasol-secured, filter by user)."
        - alert: ParasolAssistantToolDenied
          expr: increase(http_server_requests_seconds_count{job=~"parasol.*", status="403"}[5m]) > 3
          for: 0m
          labels:
            severity: info
          annotations:
            summary: "Repeated tool denials from the MCP gateway for the Parasol assistant"
