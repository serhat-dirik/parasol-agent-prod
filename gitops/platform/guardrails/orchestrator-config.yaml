# chat_generation = the model the agent talks to, i.e. the MaaS endpoint. The agent sends its own
# Authorization header (its MaaS key) and the orchestrator passes it through (passthrough_headers).
# MAAS_HOST / MAAS_PORT are set by bootstrap.sh from $MAAS_ENDPOINT. TLS to an external HTTPS host:
# VERIFY the tls block form against the 3.5 docs (a named tls config with ca_path is the documented shape).
apiVersion: v1
kind: ConfigMap
metadata:
  name: guardrails-orchestrator-config
data:
  config.yaml: |
    chat_generation:
      service:
        hostname: MAAS_HOST
        port: MAAS_PORT
        tls: maas-upstream
    detectors:
      regex:
        type: text_contents
        service:
          hostname: "127.0.0.1"
          port: 8080
        chunker_id: whole_doc_chunker
        default_threshold: 0.5
      prompt_injection:
        type: text_contents
        service:
          hostname: prompt-injection-detector-predictor
          port: 80
        chunker_id: whole_doc_chunker
        default_threshold: 0.5
    tls:
      - maas-upstream:
          ca_path: /etc/ssl/certs/ca-bundle.crt
    passthrough_headers:
      - authorization
      - content-type
