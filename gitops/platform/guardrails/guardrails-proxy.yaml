# OpenAI-compatible front for the Guardrails Orchestrator, used instead of the gateway sidecar.
# Why: in RHOAI 3.5.1 the gateway sidecar cannot relay tool-calling turns (it panics on tool_call
# responses without `content`), and the orchestrator rejects input detection when the last message
# is a tool result (422). The proxy therefore:
#   1. runs the detectors through the orchestrator's /api/v2/text/detection/content on every tool
#      result and user message (this is where the poisoned retrieved passage is seen);
#   2. on a detection, answers with a refusal and no tool call (the model never sees the passage);
#   3. otherwise forwards the request to OpenShift AI MaaS (MAAS_URL) and returns its response
#      unchanged. Not through the orchestrator's chat endpoint: that one turns structured tool calls
#      into text, and it logs request headers (the agent's MaaS key) at INFO. Detection calls carry
#      no Authorization header.
# The rules (patterns, topics, PII types, what each one does) are in the ConfigMap guardrails-rules,
# mounted at /rules: one screen in the console (ConfigMaps > guardrails-rules) shows the presenter the
# whole policy. Each detection is logged with user, agent, detector, score, action and trace id (the
# portal sends W3C traceparent + baggage enduser.id / gen_ai.agent.name on the model call) and counted
# on /metrics as parasol_guardrails_detections_total{detector,action,user,agent} plus
# parasol_guardrails_score{detector,action,user,agent} (last score), scraped by the PodMonitor below.
# Labels app=guardrails + component=guardrails-proxy: the agent's existing egress rule to
# app=guardrails covers it; guardrails-service selects component=guardrails, so it is not mixed in.
apiVersion: v1
kind: ConfigMap
metadata:
  name: guardrails-proxy
data:
  proxy.py: |
    import json, os, re, ssl, sys, threading, time, urllib.parse, urllib.request, urllib.error
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    RULES = os.environ.get("RULES_DIR", "/rules")
    def rules(name, default):
        try:
            with open(os.path.join(RULES, name)) as f:
                return json.load(f)
        except FileNotFoundError:
            return default

    # A1 PII masking preset (input): applied to the user's message before it reaches the model.
    # The matched text is redacted in place and the portal shows a "personal data masked" chip.
    PII = [(label, re.compile(rx)) for label, rx in rules("pii.json", {}).items()]

    # Demo 3 topic guardrail: a non-insurance request (the night-shift essays) gets a polite refusal.
    # ponytail: deterministic keyword list for the scripted inputs; swap for a classifier if it misfires.
    TOPIC = [re.compile(p) for p in rules("topic.json", [])]

    # Output rules (defence in depth for the knowledge base): a marker that must never reach a caller outside
    # the named group. Checked on the assistant's final answer; group names come from the portal's baggage.
    OUTPUT = {name: (re.compile(r["pattern"]), r["allow_group"]) for name, r in rules("output.json", {}).items()}

    def groups_of(headers):
        for item in (headers.get("baggage") or "").split(","):
            k, _, v = item.split(";")[0].partition("=")
            if k.strip() == "enduser.groups":
                return {g for g in urllib.parse.unquote(v.strip()).split("|") if g}
        return set()

    def output_hits(text, groups):
        if not isinstance(text, str):
            return []
        return [{"detector_id": name, "detection_type": "output", "score": 1.0, "text": m.group(0)}
                for name, (rx, allow) in OUTPUT.items() if allow not in groups for m in [rx.search(text)] if m]

    # Per-detection counters for /metrics: (detector, action, user, agent) -> [count, last score].
    HITS, HITS_LOCK = {}, threading.Lock()

    def who(headers):
        # user + agent from W3C baggage, trace id from traceparent (both set by the portal's OTel SDK)
        bag = {}
        for item in (headers.get("baggage") or "").split(","):
            k, _, v = item.split(";")[0].partition("=")
            if k.strip():
                bag[k.strip()] = urllib.parse.unquote(v.strip())
        tp = (headers.get("traceparent") or "").split("-")
        return (bag.get("enduser.id", "-"), bag.get("gen_ai.agent.name", "-"),
                tp[1] if len(tp) == 4 else "-")

    def record(ctx, action, hits):
        user, agent, trace = ctx
        for h in hits:
            det = h.get("detector_id") or h.get("detection_type") or "?"
            score = h.get("score") if h.get("score") is not None else 1.0
            print(f"guardrail action={action} detector={det} score={score:g} user={user} agent={agent} "
                  f"trace={trace} text={str(h.get('text'))[:80]!r}", flush=True)
            with HITS_LOCK:
                c = HITS.setdefault((det, action, user, agent), [0, 0.0])
                c[0] += 1; c[1] = score

    def metrics_text():
        out = ["# TYPE parasol_guardrails_detections_total counter",
               "# TYPE parasol_guardrails_score gauge"]
        esc = lambda v: str(v).replace("\\", "\\\\").replace('"', '\\"')
        with HITS_LOCK:
            for (det, action, user, agent), (n, score) in sorted(HITS.items()):
                lab = f'detector="{esc(det)}",action="{action}",user="{esc(user)}",agent="{esc(agent)}"'
                out += [f"parasol_guardrails_detections_total{{{lab}}} {n}", f"parasol_guardrails_score{{{lab}}} {score:g}"]
        return "\n".join(out) + "\n"

    # The portal's OpenAI client drops unknown top-level fields, so the guardrails signal rides on the
    # FIRST LINE of the assistant message as a sentinel the portal strips and turns into a banner/chip.
    def sentinel(action, msg, detectors=None, score=None, masked=None):
        parts = ["action=" + action]
        if detectors:
            parts.append("detectors=" + ",".join(detectors))
        if score is not None:
            parts.append("score=" + ("%g" % score))
        if masked:
            parts.append("masked=" + ",".join(masked))
        parts.append("msg=" + msg)
        return "❦GUARDRAILS " + ";".join(parts) + "❧"

    ORCH = os.environ.get("ORCHESTRATOR_URL", "https://guardrails-service:8032")
    CA = os.environ.get("ORCHESTRATOR_CA", "/etc/service-ca/service-ca.crt")
    DETECTORS = rules("detectors.json", {})
    MAAS = os.environ["MAAS_URL"].rstrip("/")
    CTX = ssl.create_default_context(cafile=CA)
    PUBLIC = ssl.create_default_context()
    MAAS_CTX = CTX if ".svc" in MAAS else PUBLIC   # in-cluster MaaS gateway: service-CA certificate

    def post(url, body, auth=None, ctx=CTX, retries=2):
        # Transient upstream failures (connection reset, timeout, or a 5xx) on the tool-calling turn are
        # retried with a short backoff so a one-off blip never surfaces as a raw 500 to the portal.
        h = {"content-type": "application/json"}
        if auth:
            h["authorization"] = auth
        data = json.dumps(body).encode()
        last = (502, {"error": {"code": 502, "message": "upstream unavailable"}})
        for attempt in range(retries + 1):
            req = urllib.request.Request(url, data, h)
            try:
                with urllib.request.urlopen(req, context=ctx, timeout=120) as r:
                    return r.status, json.loads(r.read())
            except urllib.error.HTTPError as e:
                raw = e.read() or b"{}"
                try:
                    out = json.loads(raw)
                except ValueError:   # gateway errors (429, 5xx) can be plain text: pass the status through
                    out = {"error": {"code": e.code, "message": raw.decode(errors="replace")[:300]}}
                if e.code >= 500 and attempt < retries:   # transient upstream: retry
                    print(f"upstream {e.code} from {url.rsplit('/',2)[-1]}, retrying ({attempt+1})", flush=True)
                    last = (e.code, out); time.sleep(0.5 * (attempt + 1)); continue
                return e.code, out
            except (urllib.error.URLError, TimeoutError, OSError) as e:   # reset / DNS / timeout: not an HTTP reply
                reason = str(getattr(e, "reason", e))[:200]
                last = (502, {"error": {"code": 502, "message": "upstream connection error: " + reason}})
                if attempt < retries:
                    print(f"upstream connection error ({reason}), retrying ({attempt+1})", flush=True)
                    time.sleep(0.5 * (attempt + 1)); continue
                return last
        return last

    def tool_texts(messages):
        return [m.get("content") for m in messages if m.get("role") == "tool"]

    def last_user(messages):
        users = [m.get("content") for m in messages if m.get("role") == "user"]
        return users[-1] if users else None

    def detect_texts(items):
        # run the orchestrator's regex detectors over each text (shows in the orchestrator metrics)
        hits = []
        for t in items:
            if not t:
                continue
            t = t if isinstance(t, str) else json.dumps(t)
            code, r = post(ORCH + "/api/v2/text/detection/content", {"content": t, "detectors": DETECTORS})
            if code != 200:
                print(f"detector call failed {code}: {r}", flush=True)
                continue
            hits += r.get("detections") or []
        return hits

    def topic_hits(text):
        if not isinstance(text, str):
            return []
        return [{"detector_id": "topic", "detection_type": "topic", "score": 1.0, "text": p.pattern}
                for p in TOPIC if p.search(text)]

    def names_score(hits):
        names = sorted({h.get("detector_id") or h.get("detection_type", "?") for h in hits})
        return names, max([h.get("score") or 0 for h in hits] or [1.0])

    def mask_pii(messages):
        # Redact PII in the latest user message; return the labels masked (for the portal chip).
        masked = []
        for m in messages:
            if m.get("role") != "user" or not isinstance(m.get("content"), str):
                continue
            for label, rx in PII:
                m["content"], n = rx.subn("[" + label + " redacted]", m["content"])
                if n:
                    masked.append(label)
        return sorted(set(masked))

    def block(req, hits, assistant_text, banner):
        # Turn stops; the chat shows assistant_text. Banner (amber) carries the sentinel on line 1.
        names, score = names_score(hits)
        content = sentinel("block", banner, names, score) + "\n" + assistant_text
        return {"id": "guardrails-block", "object": "chat.completion", "model": req.get("model"),
                "choices": [{"index": 0, "finish_reason": "stop",
                             "message": {"role": "assistant", "content": content}}],
                "usage": {"prompt_tokens": 0, "completion_tokens": 0, "total_tokens": 0},
                "detections": hits,
                "guardrails": {"action": "block", "detectors": names, "score": score, "message": banner}}

    class H(BaseHTTPRequestHandler):
        def _send(self, code, body):
            data = json.dumps(body).encode()
            self.send_response(code)
            self.send_header("content-type", "application/json")
            self.send_header("content-length", str(len(data)))
            self.end_headers()
            self.wfile.write(data)

        def do_GET(self):
            if self.path == "/metrics":
                data = metrics_text().encode()
                self.send_response(200)
                self.send_header("content-type", "text/plain; version=0.0.4")
                self.send_header("content-length", str(len(data)))
                self.end_headers()
                return self.wfile.write(data)
            self._send(200, {"status": "ok"})

        def do_POST(self):
            if not self.path.endswith("/chat/completions"):
                return self._send(404, {"message": "not found"})
            req = json.loads(self.rfile.read(int(self.headers.get("content-length", 0))) or b"{}")
            messages = req.get("messages", [])
            user = last_user(messages)
            ctx = who(self.headers)
            # Hard BLOCK (turn stops): an injection phrase the USER typed, or an off-topic request.
            ui = detect_texts([user]) if user else []
            if ui:
                record(ctx, "block", ui)
                return self._send(200, block(req, ui,
                    "I can't act on instructions embedded in that request. No action was taken.",
                    "prompt injection in your message"))
            th = topic_hits(user)
            if th:
                record(ctx, "block", th)
                return self._send(200, block(req, th,
                    "I can only help with Parasol insurance claims and policies, so I can't help with that.",
                    "off-topic request refused"))
            # Document / tool-result path: FLAG and CONTINUE. The detection fires on the retrieved document
            # independently of the model; the model still summarises; the payout is stopped by the gateway.
            flag = detect_texts(tool_texts(messages))
            masked = mask_pii(messages)   # PII in the user message is redacted in place -> forwarded masked
            code, r = post(MAAS + "/chat/completions", req, self.headers.get("authorization"), MAAS_CTX)
            # Output rule: a confidential marker in the answer to a caller outside the allowed group -> withheld.
            try:
                answer = r["choices"][0]["message"].get("content")
            except (KeyError, IndexError, TypeError, AttributeError):
                answer = None
            oh = output_hits(answer, groups_of(self.headers))
            if oh:
                record(ctx, "block", oh)
                out = block(req, oh, "That answer contained material marked for claims managers only, so it was withheld.",
                            "confidential document withheld")
                out["usage"] = r.get("usage") or out["usage"]   # the model call did happen: keep its token count
                return self._send(200, out)
            if isinstance(r, dict) and (flag or masked):
                try:
                    msg = r["choices"][0]["message"]
                    body = msg.get("content") or ""
                except (KeyError, IndexError, TypeError):
                    msg, body = None, None
                if flag:
                    record(ctx, "flag", flag)
                    names, score = names_score(flag)
                    r["guardrails"] = {"action": "flag", "detectors": names, "score": score,
                                       "detections": flag, "masked": masked or None,
                                       "message": "document contains instructions addressed to the assistant"}
                    if msg is not None:
                        msg["content"] = sentinel("flag", "document contains instructions addressed to the assistant",
                                                  names, score, masked) + "\n" + body
                elif masked:
                    record(ctx, "mask", [{"detector_id": "pii", "score": 1.0, "text": ",".join(masked)}])
                    r["guardrails"] = {"action": "mask", "detectors": ["pii"], "masked": masked,
                                       "message": "personal data masked"}
                    if msg is not None:
                        msg["content"] = sentinel("mask", "personal data masked", masked=masked) + "\n" + body
            self._send(code, r)

        def log_message(self, fmt, *args):  # request line only; never headers (the MaaS key)
            print(fmt % args, file=sys.stderr, flush=True)

    if __name__ == "__main__":
        assert who({"baggage": "enduser.id=rebecca,gen_ai.agent.name=parasol-claims-agent",
                    "traceparent": "00-abc-def-01"}) == ("rebecca", "parasol-claims-agent", "abc")
        record(("selftest", "selftest", "-"), "flag", [{"detector_id": "regex", "score": 1.0, "text": "start-up self-test"}])
        assert 'parasol_guardrails_detections_total{detector="regex",action="flag",user="selftest",agent="selftest"} 1' in metrics_text()
        HITS.clear()
        assert tool_texts([{"role": "user", "content": "q"}, {"role": "tool", "content": "doc"}]) == ["doc"]
        assert last_user([{"role": "user", "content": "a"}, {"role": "user", "content": "b"}]) == "b"
        _m = [{"role": "user", "content": "mail me at a@b.com, card 4111 1111 1111 1111, id 784-1990-1234567-1"}]
        assert mask_pii(_m) == ["Emirates ID", "email", "payment card"], mask_pii(_m)
        assert "redacted" in _m[0]["content"] and "4111" not in _m[0]["content"]
        s = sentinel("flag", "doc note", ["regex"], 1.0)
        assert s.startswith("❦GUARDRAILS ") and s.endswith("❧") and "action=flag" in s and "score=1" in s
        OUTPUT["selftest-marker"] = (re.compile(r"(?i)confidential\W+claims\W+managers?\W+only"), "claims-managers")
        g = groups_of({"baggage": "enduser.id=rebecca,enduser.groups=adjusters%7Cdevelopers"})
        assert g == {"adjusters", "developers"}, g
        assert output_hits("Plan: CONFIDENTIAL \u2014 Claims managers only. Team B...", g)
        assert not output_hits("Plan: CONFIDENTIAL \u2014 Claims managers only.", {"claims-managers"})
        assert not output_hits("Nothing I can share.", g)
        del OUTPUT["selftest-marker"]
        TOPIC.append(re.compile(r"(?i)\bessay\b"))
        assert topic_hits("write me a 2000-word essay") and not topic_hits("approve the payout")
        ThreadingHTTPServer(("0.0.0.0", 8080), H).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: guardrails-proxy
  labels: {app: guardrails, component: guardrails-proxy}
spec:
  replicas: 1
  selector:
    matchLabels: {app: guardrails, component: guardrails-proxy}
  template:
    metadata:
      labels: {app: guardrails, component: guardrails-proxy}
    spec:
      containers:
        - name: proxy
          image: registry.access.redhat.com/ubi9/python-312:latest
          command: ["python3", "-u", "/app/proxy.py"]
          env:
            - {name: ORCHESTRATOR_URL, value: "https://guardrails-service.parasol-secured.svc:8032"}
            - {name: MAAS_URL, value: "https://maas-default-gateway-openshift-default.openshift-ingress.svc.cluster.local/models-as-a-service/qwen3-14b/v1"}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /health, port: 8080}
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {cpu: 200m, memory: 128Mi}
          volumeMounts:
            - {name: app, mountPath: /app}
            - {name: rules, mountPath: /rules}
            - {name: service-ca, mountPath: /etc/service-ca}
      volumes:
        - name: app
          configMap: {name: guardrails-proxy}
        - name: rules
          configMap: {name: guardrails-rules}
        - name: service-ca
          configMap: {name: openshift-service-ca.crt}
---
# /metrics (attributed detections) for the Parasol dashboard's guardrail panel.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: guardrails-proxy
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  selector:
    matchLabels: {component: guardrails-proxy}
  podMetricsEndpoints:
    - port: http
      path: /metrics
      interval: 15s
---
apiVersion: v1
kind: Service
metadata:
  name: guardrails-proxy
spec:
  selector: {app: guardrails, component: guardrails-proxy}
  ports:
    - {name: http, port: 8080, targetPort: 8080}
---
# Additive to the env's `guardrails` policy (ingress only from the agent): the orchestrator also
# accepts the proxy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: orchestrator-from-proxy
spec:
  podSelector:
    matchLabels: {app: guardrails, component: guardrails}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {component: guardrails-proxy}
