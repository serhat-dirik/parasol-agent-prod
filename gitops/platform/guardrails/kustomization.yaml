apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: parasol-secured
# The secured model path's guardrails glue (guardrails-proxy: NeMo rails before and after each MaaS call; rules
# in gitops/platform/guardrails-nemo) and guardrails-rules (read by the MCP tool scanner). The TrustyAI
# Guardrails Orchestrator and its detectors below are no longer on the request path (v2).
resources:
  - limitrange.yaml
  - regex-detector.yaml
  - detector-prompt-injection.yaml
  - orchestrator-config.yaml
  - gateway-config.yaml
  - orchestrator.yaml
  - guardrails-rules.yaml
  - guardrails-proxy.yaml
