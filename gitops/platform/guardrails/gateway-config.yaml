# Routes = presets. The secured agent uses /parasol/v1/chat/completions:
#   a deterministic regex that catches the demo's "processing note" pattern. The CPU prompt-injection
#   classifier was removed (idle: the guardrails-proxy with NeMo rails is the enforced path).
# /passthrough exists so the same orchestrator can be shown with guardrails off.
apiVersion: v1
kind: ConfigMap
metadata:
  name: guardrails-gateway-config
data:
  config.yaml: |
    orchestrator:
      host: localhost
      port: 8032
    detectors:
      - name: payout-instruction
        server: regex
        input: true
        output: false
        detector_params:
          regex:
            - "(?i)call the approve_payout tool"
            - "(?i)processing note"
    routes:
      - name: parasol
        detectors:
          - payout-instruction
      - name: passthrough
        detectors:
