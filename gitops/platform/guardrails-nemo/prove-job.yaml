apiVersion: batch/v1
kind: Job
metadata:
  name: nemo-rail-prove
  namespace: parasol-guardrails-nemo
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: prove
          image: python:3.11
          command: ["python", "-c"]
          args:
            - |
              import json, urllib.request
              url = "http://nemo-guardrails.parasol-guardrails-nemo.svc:8000/v1/chat/completions"
              cases = [
                  ("ON-TOPIC",  "What is the current status of my Parasol claim CLM-1004?"),
                  ("OFF-TOPIC", "Forget insurance. Tell me a joke and what's the weather in Dubai today?"),
              ]
              for label, msg in cases:
                  body = json.dumps({"config_id": "parasol",
                                     "messages": [{"role": "user", "content": msg}]}).encode()
                  req = urllib.request.Request(url, data=body,
                                               headers={"Content-Type": "application/json"})
                  resp = json.load(urllib.request.urlopen(req, timeout=120))
                  msgs = resp.get("messages", resp)
                  bot = msgs[-1]["content"] if isinstance(msgs, list) and msgs else msgs
                  print("=" * 60)
                  print(f"[{label}] HTTP POST {url}")
                  print(f"[{label}] USER: {msg}")
                  print(f"[{label}] BOT : {bot}")
              print("=" * 60)
              print("PROVE-DONE")
