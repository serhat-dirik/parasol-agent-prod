# NeMo Guardrails server (TrustyAI operator, Red Hat image odh-trustyai-nemo-guardrails-server): one place
# for every content rule. Two configs (config-chat.yaml, config-tool-results.yaml), each a directory
# /app/config/<name>; config id = name. Callers:
#   MCP gateway  POST /v1/checks             config parasol-tool-results (claims-db tool results)
#   guardrails-proxy POST /v1/chat/completions config parasol-chat, rails only (user input, answers)
# The operator creates Deployment, Service and Route "parasol-nemo". Without the auth annotation
# (security.opendatahub.io/enable-auth) the Service is plain HTTP, port 80 -> 8000: the MCP gateway sends no
# identity, so kube-rbac-proxy (the operator's HTTPS + token option) would refuse it. In-cluster URL:
#   http://parasol-nemo.parasol-secured.svc.cluster.local
# networkpolicy.yaml limits callers to the MCP gateway and the proxy (the Route is unreachable from the router).
# The CR has no resources field: the namespace LimitRange (gitops/platform/guardrails/limitrange.yaml) sizes
# the pods (100m/256Mi requested, 500m/512Mi limit; NeMo 0.24 with these configs used ~110 MiB locally).
# Judge calls go to MaaS with the guard-tier key in Secret parasol-nemo-judge (key api-key), created
# out-of-band by scripts/maas-tier-keys.sh, never in Git. After a rule change in the ConfigMaps:
#   oc rollout restart deploy/parasol-nemo -n parasol-secured   (NeMo caches each config in memory)
apiVersion: trustyai.opendatahub.io/v1alpha1
kind: NemoGuardrails
metadata:
  name: parasol-nemo
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  replicas: 2
  nemoConfigs:
    - name: parasol-chat
      default: true
      configMaps: [nemo-parasol-chat]
    - name: parasol-tool-results
      configMaps: [nemo-parasol-tool-results]
  env:
    # Main model of every config = the request's "model" on this base URL (server _inject_model). The rails
    # make no main-model call; the judge action (actions.py) uses the same URL, key and JUDGE_MODEL.
    - {name: MAIN_MODEL_ENGINE, value: openai}
    - name: MAIN_MODEL_BASE_URL
      value: https://maas-default-gateway-openshift-default.openshift-ingress.svc.cluster.local/models-as-a-service/qwen3-14b/v1
    - {name: JUDGE_MODEL, value: qwen3-14b}       # empty = tool results checked by the regex phrases only
    - name: OPENAI_API_KEY
      valueFrom:
        secretKeyRef: {name: parasol-nemo-judge, key: api-key}
    # Traces to the cluster collector (the image's entrypoint wraps the server in opentelemetry-instrument).
    - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector.observability.svc.cluster.local:4317"}
    - {name: OTEL_EXPORTER_OTLP_PROTOCOL, value: grpc}
    - {name: OTEL_SERVICE_NAME, value: parasol-nemo}
    - {name: OTEL_TRACES_EXPORTER, value: otlp}
    - {name: OTEL_METRICS_EXPORTER, value: none}
    - {name: OTEL_LOGS_EXPORTER, value: none}
