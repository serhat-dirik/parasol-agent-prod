# Same public host the rest of the demo uses (sso.apps.<domain>: issuer URLs, AuthPolicies, scripts).
# The hostname is set by the platform-keycloak-instance Argo Application; TLS ends at route.yaml.
apiVersion: k8s.keycloak.org/v2alpha1
kind: Keycloak
metadata:
  name: keycloak
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  instances: 1
  db:
    vendor: postgres
    host: keycloak-db
    database: keycloak
    usernameSecret: {name: keycloak-db, key: username}
    passwordSecret: {name: keycloak-db, key: password}
  http:
    httpEnabled: true
  hostname:
    hostname: https://sso.apps.CLUSTER_DOMAIN
    strict: false
  proxy:
    headers: xforwarded
  ingress:
    enabled: false
  resources:
    requests: {cpu: 250m, memory: 768Mi}
    limits: {cpu: "1", memory: 1536Mi}
