apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# A Red Hat build of Keycloak instance for clusters that do not ship one. bootstrap.sh wires this
# (Argo Application platform-keycloak-instance) only when namespace keycloak has no Keycloak CR, so a
# lab-provided instance is reused instead. The realm itself is gitops/platform/keycloak.
# Secret keycloak-db (username/password) is generated by bootstrap.sh, never committed; RHBK writes the
# initial admin login to Secret keycloak-initial-admin.
namespace: keycloak
resources:
  - postgres.yaml
  - keycloak.yaml
  - route.yaml
