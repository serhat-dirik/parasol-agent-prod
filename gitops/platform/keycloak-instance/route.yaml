# Edge-terminated route on the router's wildcard certificate; Keycloak serves plain HTTP behind it
# (http.httpEnabled + proxy headers xforwarded).
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: keycloak
spec:
  host: sso.apps.CLUSTER_DOMAIN
  to: {kind: Service, name: keycloak-service}
  port: {targetPort: http}
  tls: {termination: edge, insecureEdgeTerminationPolicy: Redirect}
