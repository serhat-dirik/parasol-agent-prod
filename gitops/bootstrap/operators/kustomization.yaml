apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Operators the demo needs. Applied by bootstrap.sh BEFORE Argo CD takes over (Subscriptions are
# cluster-level plumbing; Argo syncs everything else). OpenShift GitOps itself is installed by bootstrap.sh.
resources:
  - namespaces.yaml
  - rhcl.yaml
  - mcp-gateway.yaml
  - keycloak.yaml
  - rhoai.yaml
  - observability.yaml
  - pipelines.yaml
