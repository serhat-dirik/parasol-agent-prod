apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Operators the demo needs. bootstrap.sh feeds this to scripts/ensure-operators.py BEFORE Argo CD takes
# over: per package it reports "already installed" (any namespace) or installs it, never adding a second
# OperatorGroup to a namespace. OpenShift GitOps itself is installed by bootstrap.sh.
resources:
  - namespaces.yaml
  - rhcl.yaml
  - mcp-gateway.yaml
  - keycloak.yaml
  - rhoai.yaml
  - observability.yaml
  - pipelines.yaml
  - cert-manager.yaml
  - supply-chain.yaml
