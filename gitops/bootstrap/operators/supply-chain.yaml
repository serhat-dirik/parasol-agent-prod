# Supply chain (guide 07): Trusted Artifact Signer (Fulcio/Rekor/TUF for keyless signing), the Sigstore
# policy-controller (admission), and Zero Trust Workload Identity Manager (SPIRE: the pipeline's keyless
# signing identity is a SPIFFE JWT-SVID). Operands: scripts/supply-chain.sh.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: rhtas-operator
  namespace: openshift-operators
spec:
  channel: stable
  installPlanApproval: Automatic
  name: rhtas-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
---
# Own namespace, not openshift-operators: its webhook Service selects control-plane=controller-manager,
# which there also matches the Tempo and OpenTelemetry operator pods, so admission calls land on the
# wrong pod (x509: certificate is valid for tempo-operator-controller-service).
apiVersion: v1
kind: Namespace
metadata:
  name: openshift-policy-controller
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: openshift-policy-controller
  namespace: openshift-policy-controller
spec: {}  # AllNamespaces
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: policy-controller-operator
  namespace: openshift-policy-controller
spec:
  channel: stable
  installPlanApproval: Automatic
  name: policy-controller-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
---
apiVersion: v1
kind: Namespace
metadata:
  name: zero-trust-workload-identity-manager
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: zero-trust-workload-identity-manager
  namespace: zero-trust-workload-identity-manager
spec: {}  # AllNamespaces: the owned CRDs (ClusterSPIFFEID, SpireServer, ...) are cluster-scoped
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: openshift-zero-trust-workload-identity-manager
  namespace: zero-trust-workload-identity-manager
spec:
  channel: stable-v1
  installPlanApproval: Automatic
  name: openshift-zero-trust-workload-identity-manager
  source: redhat-operators
  sourceNamespace: openshift-marketplace
