# Red Hat Connectivity Link (Kuadrant): AuthPolicy, RateLimitPolicy, TokenRateLimitPolicy and, from 1.5, the
# GA MCP gateway (MCPGatewayExtension, MCPServerRegistration, MCPVirtualServer, mcp.kuadrant.io/v1). From 1.5
# the operator deploys Authorino, Limitador, DNS and the MCP gateway controller itself (KuadrantControlPlane),
# so there are no separate dependency Subscriptions and no separate mcp-gateway package.
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: kuadrant
  namespace: kuadrant-system
spec:
  upgradeStrategy: Default
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: rhcl-operator
  namespace: kuadrant-system
spec:
  channel: stable-1.5
  installPlanApproval: Automatic
  name: rhcl-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  # The operator also serves the gateways' policy plugin; at the default 500Mi it is OOM-killed under this demo's
  # policies, and a gateway pod that starts meanwhile answers 503 until restarted (scripts/reset.sh checks).
  config:
    resources:
      requests: {cpu: 200m, memory: 512Mi}
      limits: {cpu: "1", memory: 1Gi}
