apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-guardrails
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: parasol
  destination: {server: https://kubernetes.default.svc, namespace: parasol-secured}
  source:
    repoURL: ${REPO_URL}
    targetRevision: ${REPO_REVISION}
    path: gitops/platform/guardrails
    kustomize:
      patches:
        - target: {kind: Deployment, name: guardrails-proxy}   # the agent model's MaaS path (tests guard the order)
          patch: |-
            - {op: test, path: /spec/template/spec/containers/0/env/2/name, value: MAAS_URL}
            - op: replace
              path: /spec/template/spec/containers/0/env/2/value
              value: https://maas-default-gateway-openshift-default.openshift-ingress.svc.cluster.local/models-as-a-service/${AGENT_MODEL_NAME}/v1
        - target: {kind: ConfigMap, name: guardrails-orchestrator-config}
          patch: |-
            - op: replace
              path: /data/config.yaml
              value: |
                chat_generation:
                  service:
                    hostname: ${AGENT_HOST}
                    port: ${AGENT_PORT}
                    tls: maas-upstream
                detectors:
                  regex:
                    type: text_contents
                    service: {hostname: regex-detector, port: 8080}
                    chunker_id: whole_doc_chunker
                    default_threshold: 0.5
                tls:   # a map; the orchestrator requires cert_path. No key_path = no client auth; CA = system bundle
                  maas-upstream:
                    cert_path: /etc/ssl/certs/ca-bundle.crt
                    client_ca_cert_path: /etc/ssl/certs/ca-bundle.crt
                passthrough_headers: [authorization, content-type]
  # Admission (policy-controller) resolves image tags to digests in parasol-secured; without this the
  # Deployments would read OutOfSync after every sync (see env-secured.yaml).
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jqPathExpressions:
        - '.spec.template.spec.containers[].image'
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, RespectIgnoreDifferences=true, ServerSideApply=true]
