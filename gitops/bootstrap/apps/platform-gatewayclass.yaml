apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-gatewayclass
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: parasol
  destination: {server: https://kubernetes.default.svc, namespace: openshift-ingress}
  source:
    repoURL: ${REPO_URL}
    targetRevision: ${REPO_REVISION}
    path: gitops/platform/gatewayclass
    kustomize:
      patches: []
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, RespectIgnoreDifferences=true, ServerSideApply=true]
