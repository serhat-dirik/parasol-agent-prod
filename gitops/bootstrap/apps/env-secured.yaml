apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: env-secured
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  project: parasol
  destination: {server: https://kubernetes.default.svc, namespace: parasol-secured}
  source:
    repoURL: ${REPO_URL}
    targetRevision: ${REPO_REVISION}
    path: gitops/envs/secured
    kustomize:
      patches:
        - target: {kind: ConfigMap, name: agent-config}
          patch: |-
            - op: replace
              path: /data/model
              value: qwen3-14b   # secured portal runs on the injection-obeying model; the controls (not model luck) stop the payout
            - op: replace
              path: /data/claimsDbMcpUrl
              value: https://mcp.apps.${CLUSTER_DOMAIN}/mcp
            - op: replace
              path: /data/policyDocsMcpUrl
              value: https://mcp.apps.${CLUSTER_DOMAIN}/mcp
            - op: replace
              path: /data/tokenUrl
              value: https://sso.apps.${CLUSTER_DOMAIN}/realms/parasol/protocol/openid-connect/token
            - op: replace
              path: /data/fraudCheckMcpUrl
              value: https://mcp.apps.${CLUSTER_DOMAIN}/mcp
        - target: {kind: Route, name: portal}
          patch: |-
            - op: replace
              path: /spec/host
              value: portal.apps.${CLUSTER_DOMAIN}
        # In-cluster calls to the public *.apps hosts (Keycloak, MCP gateway) leave through the ingress
        # address; bootstrap.sh derives it (INGRESS_CIDR) from the cluster's Infrastructure object.
        - target: {kind: NetworkPolicy, name: parasol-agent-ingress-vip}
          patch: |-
            - op: replace
              path: /spec/egress/0/to/0/ipBlock/cidr
              value: ${INGRESS_CIDR}
        - target: {kind: NetworkPolicy, name: portal-ingress-vip}
          patch: |-
            - op: replace
              path: /spec/egress/0/to/0/ipBlock/cidr
              value: ${INGRESS_CIDR}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, RespectIgnoreDifferences=true, ServerSideApply=true]
