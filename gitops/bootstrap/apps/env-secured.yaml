apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: env-secured
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  project: parasol
  destination: {server: https://kubernetes.default.svc, namespace: parasol-secured}
  source:
    repoURL: ${REPO_URL}
    targetRevision: ${REPO_REVISION}
    path: gitops/envs/secured
    kustomize:
      patches:
        - target: {kind: ConfigMap, name: agent-config}
          patch: |-
            - op: replace
              path: /data/model
              value: qwen3-14b   # secured portal runs on the injection-obeying model; the controls (not model luck) stop the payout
            - op: replace
              path: /data/claimsDbMcpUrl
              value: https://mcp.apps.${CLUSTER_DOMAIN}/mcp
            - op: replace
              path: /data/policyDocsMcpUrl
              value: https://mcp.apps.${CLUSTER_DOMAIN}/mcp
            - op: replace
              path: /data/tokenUrl
              value: https://sso.apps.${CLUSTER_DOMAIN}/realms/parasol/protocol/openid-connect/token
            - op: replace
              path: /data/fraudCheckMcpUrl
              value: https://mcp.apps.${CLUSTER_DOMAIN}/mcp
        # The agents' projected ServiceAccount tokens are client assertions for the parasol realm: their
        # audience must be the realm issuer.
        - target: {kind: Deployment, name: "^(portal|parasol-agent|fraud-check)$"}
          patch: |-
            - op: replace
              path: /spec/template/spec/volumes/0/projected/sources/0/serviceAccountToken/audience
              value: https://sso.apps.${CLUSTER_DOMAIN}/realms/parasol
        - target: {kind: Route, name: portal}
          patch: |-
            - op: replace
              path: /spec/host
              value: portal.apps.${CLUSTER_DOMAIN}
        # In-cluster calls to the public *.apps hosts (Keycloak, MCP gateway) leave through the ingress
        # address; bootstrap.sh derives it (INGRESS_CIDR) from the cluster's Infrastructure object.
        - target: {kind: NetworkPolicy, name: parasol-agent-ingress-vip}
          patch: |-
            - op: replace
              path: /spec/egress/0/to/0/ipBlock/cidr
              value: ${INGRESS_CIDR}
        - target: {kind: NetworkPolicy, name: portal-ingress-vip}
          patch: |-
            - op: replace
              path: /spec/egress/0/to/0/ipBlock/cidr
              value: ${INGRESS_CIDR}
  # Admission (policy-controller, policy.rhtas.com) resolves image tags to digests in parasol-secured,
  # so the :latest images of the other workloads would differ from Git forever (OutOfSync, selfHeal
  # loop). Ignore that field except on the portal container, whose image is the promoted pin.
  # The promoted pin itself (spec.source.kustomize.images/replicas) is set by the release pipeline,
  # not here; bootstrap.sh keeps it when it re-applies this file.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jqPathExpressions:
        - '.spec.template.spec.containers[] | select(.name != "portal") | .image'
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, RespectIgnoreDifferences=true, ServerSideApply=true]
