apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: env-free
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: parasol
  destination: {server: https://kubernetes.default.svc, namespace: parasol-free}
  source:
    repoURL: ${REPO_URL}
    targetRevision: ${REPO_REVISION}
    path: gitops/envs/free
    kustomize:
      patches:
        - target: {kind: ConfigMap, name: agent-config}
          patch: |-
            - op: replace
              path: /data/endpoint
              value: ${AGENT_ENDPOINT}
            - op: replace
              path: /data/model
              value: ${AGENT_MODEL}   # unsecured portal uses an injection-obeying model to show the risk live
        - target: {kind: Route, name: portal-free}
          patch: |-
            - op: replace
              path: /spec/host
              value: portal-free.apps.${CLUSTER_DOMAIN}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, RespectIgnoreDifferences=true, ServerSideApply=true]
