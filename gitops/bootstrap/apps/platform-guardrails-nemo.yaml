# NeMo Guardrails with the Parasol configs (parasol-chat, parasol-tool-results), in parasol-secured.
# After platform-guardrails (wave 4: the namespace LimitRange that sizes the NeMo pods). The judge key
# Secret parasol-nemo-judge is created by scripts/maas-tier-keys.sh (bootstrap step 9), never in Git;
# until it exists the NeMo pods wait in CreateContainerConfigError and the MCP gateway fails closed.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-guardrails-nemo
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: parasol
  destination: {server: https://kubernetes.default.svc, namespace: parasol-secured}
  source:
    repoURL: ${REPO_URL}
    targetRevision: ${REPO_REVISION}
    path: gitops/platform/guardrails-nemo
    kustomize:
      patches:
        - target: {kind: NemoGuardrails, name: parasol-nemo}   # the judge runs on the agent model (tests guard the order)
          patch: |-
            - {op: test, path: /spec/env/1/name, value: MAIN_MODEL_BASE_URL}
            - op: replace
              path: /spec/env/1/value
              value: https://maas-default-gateway-openshift-default.openshift-ingress.svc.cluster.local/models-as-a-service/${AGENT_MODEL_NAME}/v1
            - {op: test, path: /spec/env/2/name, value: JUDGE_MODEL}
            - {op: replace, path: /spec/env/2/value, value: "${AGENT_MODEL}"}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
