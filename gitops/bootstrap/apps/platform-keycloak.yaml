apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-keycloak
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: parasol
  destination: {server: https://kubernetes.default.svc, namespace: keycloak}
  source:
    repoURL: ${REPO_URL}
    targetRevision: ${REPO_REVISION}
    path: gitops/platform/keycloak
    kustomize:
      patches:
        - target: {kind: Keycloak, name: keycloak}
          patch: |-
            - op: replace
              path: /spec/hostname/hostname
              value: keycloak.apps.${CLUSTER_DOMAIN}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, RespectIgnoreDifferences=true, ServerSideApply=true]
