apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: env-thirdparty
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: parasol
  destination: {server: https://kubernetes.default.svc, namespace: parasol-thirdparty}
  source:
    repoURL: ${REPO_URL}
    targetRevision: ${REPO_REVISION}
    path: gitops/envs/thirdparty
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
