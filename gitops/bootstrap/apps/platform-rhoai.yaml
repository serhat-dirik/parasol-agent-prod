apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-rhoai
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: parasol
  destination: {server: https://kubernetes.default.svc, namespace: models-as-a-service}
  source:
    repoURL: ${REPO_URL}
    targetRevision: ${REPO_REVISION}
    path: gitops/platform/rhoai
    kustomize:
      patches:
        - target: {kind: ExternalProvider}
          patch: |-
            - op: replace
              path: /spec/baseURL
              value: ${MAAS_ENDPOINT}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, RespectIgnoreDifferences=true, ServerSideApply=true]
