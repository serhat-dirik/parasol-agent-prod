apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-rhoai
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: parasol
  destination: {server: https://kubernetes.default.svc, namespace: models-as-a-service}
  source:
    repoURL: ${REPO_URL}
    targetRevision: ${REPO_REVISION}
    path: gitops/platform/rhoai
    kustomize:
      patches:
        - target: {kind: ExternalModel, name: qwen3-14b}   # the agent model: AGENT_ENDPOINT's host + AGENT_MODEL
          patch: |-
            - op: replace
              path: /spec/endpoint
              value: ${AGENT_HOST}
            - op: replace
              path: /spec/targetModel
              value: ${AGENT_MODEL}
        - target: {kind: ExternalModel, name: gpt-oss-120b}   # the judge: JUDGE_ENDPOINT's host + JUDGE_MODEL
          patch: |-
            - op: replace
              path: /spec/endpoint
              value: ${JUDGE_HOST}
            - op: replace
              path: /spec/targetModel
              value: ${JUDGE_MODEL}
        - target: {kind: ConfigMap, name: parasol-model-names}   # MaaS object names (DNS-1123 forms of the model ids)
          patch: |-
            - op: replace
              path: /data/agent
              value: ${AGENT_MODEL_NAME}
            - op: replace
              path: /data/judge
              value: ${JUDGE_MODEL_NAME}
        - target: {kind: Gateway, name: maas-default-gateway}   # external listener = the MaaS API URL the dashboard uses
          patch: |-
            - op: replace
              path: /spec/listeners/0/hostname
              value: maas.apps.${CLUSTER_DOMAIN}
        - target: {kind: Route, name: maas-default-gateway}
          patch: |-
            - op: replace
              path: /spec/host
              value: maas.apps.${CLUSTER_DOMAIN}
  # The owner of a MaaSSubscription is an operator switch at run time (scripts/kill-switch.sh tier|parasol
  # moves its groups aside and back): Git creates it, self-heal must not undo a switched-off tier.
  ignoreDifferences:
    - {group: maas.opendatahub.io, kind: MaaSSubscription, jsonPointers: [/spec/owner]}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, RespectIgnoreDifferences=true, ServerSideApply=true]
