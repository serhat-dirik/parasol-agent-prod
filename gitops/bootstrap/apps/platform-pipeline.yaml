apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-pipeline
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    # Tekton's webhook fills defaults (computeResources, taskRef kind); diff after admission.
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: parasol
  destination: {server: https://kubernetes.default.svc, namespace: parasol-build}
  source:
    repoURL: ${REPO_URL}
    targetRevision: ${REPO_REVISION}
    path: gitops/platform/pipeline
    kustomize:
      patches: []
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=false, RespectIgnoreDifferences=true, ServerSideApply=true]
