apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# "v3": the same secured environment with the retry bug shipped. One question becomes up to 200 model
# calls. Used for the 3am clip: token metric climbs, the MaaS stage allowance runs out (429), the alert fires.
resources:
  - ../secured
patches:
  - target: {kind: ConfigMap, name: agent-config}
    patch: |-
      - op: replace
        path: /data/version
        value: v3-secured
      - op: add
        path: /data/retryMax
        value: "200"
  # The agent reads the ConfigMap as env at start: change the pod template so the switch rolls the pod.
  - target: {kind: Deployment, name: parasol-agent}
    patch: |-
      - op: add
        path: /spec/template/metadata/annotations
        value: {parasol.io/build: v3-secured}
  # One looping request runs for minutes: keep the router from cutting it at the 30 s default.
  - target: {kind: Route, name: parasol-agent}
    patch: |-
      - op: add
        path: /metadata/annotations
        value: {haproxy.router.openshift.io/timeout: 20m}
