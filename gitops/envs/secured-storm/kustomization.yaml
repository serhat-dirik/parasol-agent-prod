apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# "v3": the same secured environment with the retry bug shipped. One question becomes up to 200 model
# calls. Used for the 3am clip: token metric climbs, the MaaS stage allowance runs out (429), the alert fires.
resources:
  - ../secured
patches:
  - target: {kind: ConfigMap, name: agent-config}
    patch: |-
      - op: replace
        path: /data/version
        value: v3-secured
      - op: add
        path: /data/retryMax
        value: "200"
