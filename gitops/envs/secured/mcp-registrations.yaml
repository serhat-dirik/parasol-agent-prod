# Layer 3: the servers exist for agents only through the gateway. Each HTTPRoute attaches to the
# internal "mcps" listener; each MCPServerRegistration tells the broker to federate the route's tools.
# The registration NAME (namespaced) is the resource_access key in Keycloak: parasol-secured/claims-db.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: claims-db
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  parentRefs:
    - {group: gateway.networking.k8s.io, kind: Gateway, name: mcp-gateway, namespace: gateway-system, sectionName: mcps}
  hostnames: [claims-db.mcp.local]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - {group: "", kind: Service, name: claims-db, port: 8080, weight: 1}
---
apiVersion: mcp.kuadrant.io/v1alpha1
kind: MCPServerRegistration
metadata:
  name: claims-db
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: claims-db
    namespace: parasol-secured
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: policy-docs
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  parentRefs:
    - {group: gateway.networking.k8s.io, kind: Gateway, name: mcp-gateway, namespace: gateway-system, sectionName: mcps}
  hostnames: [policy-docs.mcp.local]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - {group: "", kind: Service, name: policy-docs, port: 8080, weight: 1}
---
apiVersion: mcp.kuadrant.io/v1alpha1
kind: MCPServerRegistration
metadata:
  name: policy-docs
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: policy-docs
    namespace: parasol-secured
---
# The agent reaches the MCP gateway and Keycloak by their public hosts (mcp.apps / sso.apps), which in-cluster DNS
# resolves to the bare-metal ingress VIP (host network, so no namespaceSelector matches it). Only port 443 on that VIP.
# Cluster-specific: oc get infrastructure cluster -o jsonpath='{.status.platformStatus.baremetal.ingressIPs}'
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: parasol-agent-ingress-vip
spec:
  podSelector:
    matchLabels: {app: parasol-agent}
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock: {cidr: 10.10.10.101/32}
      ports:
        - {protocol: TCP, port: 443}
---
# One gateway URL, two tool sets: the agent's claims-db and policy-docs clients each send
# X-Mcp-Virtualserver: parasol-secured/<name> (agent-identity-patch.yaml). tools/list is still filtered per identity.
apiVersion: mcp.kuadrant.io/v1alpha1
kind: MCPVirtualServer
metadata:
  name: claims-db
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  # approve_payout is deliberately ABSENT from tools/list for EVERY identity (Read-Propose-Act, A2):
  # no chat model should see it, so the model always proposes and the real write happens only on the
  # portal's Approve button (a direct tools/call with the manager's token). It stays backend-federated
  # (the MCPServerRegistration discovers it), so claims-managers can still CALL it via tools/call -
  # verified: that path is independent of this list. The tool:approve_payout role on claims-managers in
  # Keycloak is what authorizes that call (unchanged). rebecca's forced call is still 403.
  description: Claims tools
  tools: [get_claim, list_claims_by_status, get_claim_history, get_claim_documents]
---
apiVersion: mcp.kuadrant.io/v1alpha1
kind: MCPVirtualServer
metadata:
  name: policy-docs
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  description: Policy document tools
  tools: [search_policies, get_policy, list_policies]
