# Layer 3: the servers exist for agents only through the gateway. Each HTTPRoute attaches to the
# internal "mcps" listener; each MCPServerRegistration tells the broker to federate the route's tools.
# The registration NAME (namespaced) is the resource_access key in Keycloak: parasol-secured/claims-db.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: claims-db
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  parentRefs:
    - {name: mcp-gateway, namespace: gateway-system, sectionName: mcps}
  hostnames: [claims-db.mcp.local]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - {name: claims-db, port: 8080}
---
apiVersion: mcp.kuadrant.io/v1alpha1
kind: MCPServerRegistration
metadata:
  name: claims-db
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: claims-db
    namespace: parasol-secured
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: policy-docs
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  parentRefs:
    - {name: mcp-gateway, namespace: gateway-system, sectionName: mcps}
  hostnames: [policy-docs.mcp.local]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - {name: policy-docs, port: 8080}
---
apiVersion: mcp.kuadrant.io/v1alpha1
kind: MCPServerRegistration
metadata:
  name: policy-docs
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: policy-docs
    namespace: parasol-secured
