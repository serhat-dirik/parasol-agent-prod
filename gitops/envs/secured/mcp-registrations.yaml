# Layer 3: the servers exist for agents only through the gateway. Each HTTPRoute attaches to the
# internal "mcps" listener; each MCPServerRegistration tells the broker to federate the route's tools.
# The registration NAME (namespaced) is the resource_access key in Keycloak: parasol-secured/claims-db.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: claims-db
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  parentRefs:
    - {group: gateway.networking.k8s.io, kind: Gateway, name: mcp-gateway, namespace: gateway-system, sectionName: mcps}
  hostnames: [claims-db.mcp.local]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - {group: "", kind: Service, name: claims-db, port: 8080, weight: 1}
---
apiVersion: mcp.kuadrant.io/v1
kind: MCPServerRegistration
metadata:
  name: claims-db
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    # sha256 of the reviewed tool definitions; a change without updating this pin raises MCPToolDefinitionDrift
    parasol.example/tools-sha256: bd7433a37df16fcf5297654bbf84bad00b94eb766e7df0f545803b5d5a481049
    # Every claims-db tool result (customer documents) is checked by NeMo config parasol-tool-results before
    # the agent sees it; a hit returns "blocked by guardrails" as an error result (Showcase 2).
    mcp.kuadrant.io/guardrails-config-ids: parasol-tool-results
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: claims-db
    namespace: parasol-secured
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: policy-docs
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  parentRefs:
    - {group: gateway.networking.k8s.io, kind: Gateway, name: mcp-gateway, namespace: gateway-system, sectionName: mcps}
  hostnames: [policy-docs.mcp.local]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - {group: "", kind: Service, name: policy-docs, port: 8080, weight: 1}
---
apiVersion: mcp.kuadrant.io/v1
kind: MCPServerRegistration
metadata:
  name: policy-docs
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    # sha256 of the reviewed tool definitions; a change without updating this pin raises MCPToolDefinitionDrift
    parasol.example/tools-sha256: 435e8efd0b1159001ac2e0b67d43a03f1afbe82ffe9291782d2e203ff5959d04
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: policy-docs
    namespace: parasol-secured
---
# One gateway URL, two tool sets: the agent's claims-db and policy-docs clients each send
# X-Mcp-Virtualserver: parasol-secured/<name> (agent-identity-patch.yaml). tools/list is still filtered per identity.
apiVersion: mcp.kuadrant.io/v1
kind: MCPVirtualServer
metadata:
  name: claims-db
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  # Two-stage approval: the model may APPROVE a claim (approve_claim: UnderReview -> Ready for payment, no money
  # moves; Keycloak tool:approve_claim, adjusters and claims-managers). release_payment is deliberately ABSENT from
  # tools/list for EVERY identity: no chat model sees the tool that moves money, the payment is released only on the
  # portal's Release payment button (a direct tools/call with the claims manager's token; tool:release_payment,
  # claims-managers only). Backend-federated tools stay callable via tools/call independent of this list.
  # approve_payout (one-step payout) is granted to nobody here and claims-db refuses it in secured.
  description: Claims tools
  tools: [get_claim, list_claims_by_status, get_claim_history, get_claim_documents, approve_claim]
---
apiVersion: mcp.kuadrant.io/v1
kind: MCPVirtualServer
metadata:
  name: policy-docs
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  description: Policy document tools
  tools: [search_policies, get_policy, list_policies]
