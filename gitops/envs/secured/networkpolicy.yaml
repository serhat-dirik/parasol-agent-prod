# Layer 1: default deny, then exactly the paths the design needs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# DNS for everyone.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: openshift-dns}
      ports:
        - {protocol: UDP, port: 5353}
        - {protocol: TCP, port: 5353}
---
# The agent: ingress from the router (people), egress to the MCP gateway, Keycloak, the guardrails proxy, OTel,
# each by its in-cluster Service. No egress rule to claims-db or policy-docs (the agent CANNOT bypass the MCP
# gateway) and none to the cluster ingress (no path to the MaaS gateway around the guardrails proxy).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: parasol-agent
spec:
  podSelector:
    matchLabels: {app: parasol-agent}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {network.openshift.io/policy-group: ingress}
    - from:
        - namespaceSelector:
            matchLabels: {network.openshift.io/policy-group: monitoring}
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: gateway-system}
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: keycloak}
    - to:   # the model, only through the guardrails proxy, which alone reaches MaaS (layer 5)
        - podSelector:
            matchLabels: {component: guardrails-proxy}
      ports:
        - {protocol: TCP, port: 8080}
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: observability}
---
# The MCP servers: ingress ONLY from the MCP gateway data plane and from the Gateway pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-servers
spec:
  podSelector:
    matchExpressions:
      - {key: app, operator: In, values: [claims-db, policy-docs]}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: gateway-system}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: mcp-system}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: openshift-ingress}
    - from:
        - namespaceSelector:
            matchLabels: {network.openshift.io/policy-group: monitoring}
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: observability}
---
# Guardrails (orchestrator + proxy): from the agent, to the detectors in this namespace, to the platform's
# MaaS gateway (openshift-ingress, which alone holds the upstream provider keys) and OTel. No egress to the
# internet: a guardrails pod cannot call a model the platform has not registered either.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: guardrails
spec:
  podSelector:
    matchLabels: {app: guardrails}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: parasol-agent}
    - from:
        - namespaceSelector:
            matchLabels: {network.openshift.io/policy-group: monitoring}
  egress:
    - to:   # orchestrator <-> regex detector
        - podSelector: {}
    - to:   # the in-cluster MaaS gateway (maas-default-gateway in openshift-ingress)
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: openshift-ingress}
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: observability}
