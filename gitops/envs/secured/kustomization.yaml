apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The layered sandbox. Same images, same code. What changes is around the agent:
#  1 isolation      namespace + ResourceQuota + NetworkPolicy (agent reaches only the gateway, guardrails, DNS)
#  2 identity       the agent carries the caller's Keycloak token to the MCP gateway (and has its own service identity)
#  3 tool authz     MCP servers are reachable ONLY through the MCP gateway; per-tool AuthPolicy; filtered tool list
#  4 guardrails     the model endpoint is the Guardrails Orchestrator gateway (prompt-injection + regex), then MaaS
#  5 model governance  MaaS subscription + auth policy (see platform/rhoai/maas.yaml), stage quota
#  6 lifecycle gate (Clip E, stretch)
#  7 observability + control  OTel traces to Tempo, token metrics + alert, kill-switch component below
namespace: parasol-secured
resources:
  - namespace.yaml
  - quota.yaml
  - networkpolicy.yaml
  - mcp-registrations.yaml
  - fraud-check.yaml       # V3: the fraud-check agent (2nd MCP server behind the gateway, agent-to-agent)
  - portal.yaml            # Stream P: the secured claims portal (login, gated writes, guardrails)
  - portal-networkpolicy.yaml  # Stream P: the portal's layer-1 egress (kill switch patches this)
  - ../base
# Stream P: the secured portal runs a PINNED, SIGNED digest. The secure pipeline (Stream L) patches
# only the digest value below after it signs and promotes the image; parasol-free stays on :latest.
images:
  - name: image-registry.openshift-image-registry.svc:5000/parasol-build/parasol-portal
    digest: sha256:bb44e473f883ad13bb154218e5ab15558d3f310a05ba75c96e6ca738d6a6d843
components: []   # add ./kill-switch here to revoke the agent's access via a Git commit
patches:
  - path: agent-identity-patch.yaml
    target: {kind: Deployment, name: parasol-agent}
  - path: sandbox-patch.yaml
    target: {kind: Deployment}
configMapGenerator:
  - name: agent-config
    literals:
      - endpoint=http://model-gateway-openshift-default.parasol-model-gateway.svc:8080/v1   # rate-limited model gateway -> guardrails-proxy -> MaaS
      - model=MAAS_MODEL
      - claimsDbMcpUrl=https://mcp.apps.CLUSTER_DOMAIN/mcp
      - policyDocsMcpUrl=https://mcp.apps.CLUSTER_DOMAIN/mcp
      - claimsDbApiUrl=http://claims-db:8080        # Stream P: direct REST read for the portal UI (not via the MCP gateway)
      - version=v1-secured
      - promptVersion=parasol-claims-assistant-system-prompt@1   # G2: MLflow Prompt Registry version the secured portal runs
      - tokenUrl=https://sso.apps.CLUSTER_DOMAIN/realms/parasol/protocol/openid-connect/token
    files:
      - safetyRules=safety-rules.txt
generatorOptions:
  disableNameSuffixHash: true
