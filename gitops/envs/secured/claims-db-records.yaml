# Record-level access on claims-db (Scenario 3, "Records, not just documents"): the server verifies the
# on-behalf-of token the gateway forwards and returns only the claims assigned to the user (claims-managers:
# all). It fetches Keycloak's signing keys (JWKS) from Keycloak's in-cluster Service. The same rule covers the
# portal UI's reads of the REST API (ClaimsApiResource).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: claims-db-jwks
spec:
  podSelector:
    matchLabels: {app: claims-db}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: keycloak}
---
# parasol_claims_access_denied_total{tool,user,agent} for the dashboard's Gateway decisions row.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: claims-db
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  selector:
    matchLabels: {app: claims-db}
  podMetricsEndpoints:
    - port: http
      path: /q/metrics
      interval: 30s
