# Layer 1: a runaway agent cannot starve the cluster.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: parasol-secured
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 10Gi
    limits.cpu: "10"      # + knowledge base (server, database, ingestion job)
    limits.memory: 16Gi
    pods: "15"
# Headroom: steady state about 6.9 CPU limits (app pods 500m, knowledge-base and the orchestrator 1 CPU +
# sidecar), so a rolling update of the largest Deployment (orchestrator, 1.5 CPU) still fits under 10.
