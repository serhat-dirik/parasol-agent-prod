# Layer 2: the agent has its OWN identity (ServiceAccount claims-agent -> Keycloak client
# parasol-claims-agent) and acts ON BEHALF OF the caller: it exchanges the caller's token at Keycloak,
# so the gateway sees sub = Rebecca or Marcus and azp = parasol-claims-agent. No password, no secret.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: parasol-agent
spec:
  template:
    spec:
      automountServiceAccountToken: false
      serviceAccountName: claims-agent
      containers:
        - name: parasol-agent
          env:
            - name: MCP_AUTH_TOKEN_URL
              valueFrom: {configMapKeyRef: {name: agent-config, key: tokenUrl}}
            - {name: MCP_AUTH_AGENT_ID, value: parasol-claims-agent}
            - {name: MCP_AUTH_ASSERTION_FILE, value: /var/run/secrets/parasol/agent/token}
            # Both MCP clients point at the one gateway URL; each selects its MCPVirtualServer so the model
            # sees every tool once (otherwise: "Duplicated definition for tool"). The tool list is not cached:
            # the gateway filters it per caller token, so the first caller must not fix it for all.
            - name: JAVA_TOOL_OPTIONS
              value: >-
                -Dquarkus.langchain4j.mcp.claims-db.header.X-Mcp-Virtualserver=parasol-secured/claims-db
                -Dquarkus.langchain4j.mcp.policy-docs.header.X-Mcp-Virtualserver=parasol-secured/policy-docs
                -Dquarkus.langchain4j.mcp.claims-db.cache-tool-list=false
                -Dquarkus.langchain4j.mcp.policy-docs.cache-tool-list=false
          volumeMounts:
            - {name: agent-token, mountPath: /var/run/secrets/parasol/agent, readOnly: true}
      volumes:
        # Projected ServiceAccount token: the agent's credential at Keycloak (client assertion). Rotated by
        # the kubelet; the audience is set to the realm issuer by the env-secured Argo Application.
        - name: agent-token
          projected:
            sources:
              - serviceAccountToken: {audience: https://sso.apps.CLUSTER_DOMAIN/realms/parasol, expirationSeconds: 3600, path: token}
