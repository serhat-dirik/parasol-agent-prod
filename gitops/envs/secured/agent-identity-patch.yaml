# Layer 2: the agent has a service identity (user "dev": read-only tools) for discovery and
# readiness, and forwards the caller's own token on every request, so the gateway sees Rebecca or Marcus.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: parasol-agent
spec:
  template:
    spec:
      automountServiceAccountToken: false
      containers:
        - name: parasol-agent
          env:
            - name: MCP_AUTH_TOKEN_URL
              valueFrom: {configMapKeyRef: {name: agent-config, key: tokenUrl}}
            - {name: MCP_AUTH_CLIENT_ID, value: parasol-agent}
            - name: MCP_AUTH_USERNAME
              valueFrom: {secretKeyRef: {name: agent-service-identity, key: username}}
            - name: MCP_AUTH_PASSWORD
              valueFrom: {secretKeyRef: {name: agent-service-identity, key: password}}
            # Both MCP clients point at the one gateway URL; each selects its MCPVirtualServer so the model
            # sees every tool once (otherwise: "Duplicated definition for tool").
            - name: JAVA_TOOL_OPTIONS
              value: >-
                -Dquarkus.langchain4j.mcp.claims-db.header.X-Mcp-Virtualserver=parasol-secured/claims-db
                -Dquarkus.langchain4j.mcp.policy-docs.header.X-Mcp-Virtualserver=parasol-secured/policy-docs
