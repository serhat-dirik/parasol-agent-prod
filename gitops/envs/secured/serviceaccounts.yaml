# The agents' workload identities. Each agent pod mounts a short-lived projected token of its own
# ServiceAccount (audience = the parasol realm) and presents it to Keycloak as a client assertion
# (federated client authentication through the realm's Kubernetes identity provider 'openshift-sa'):
#   claims-agent -> Keycloak client parasol-claims-agent (the portal's claims assistant, parasol-agent)
#   fraud-agent  -> Keycloak client parasol-fraud-agent  (the fraud-check agent)
# No client secret exists anywhere. The API token itself is still not mounted (sandbox-patch.yaml).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: claims-agent
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fraud-agent
