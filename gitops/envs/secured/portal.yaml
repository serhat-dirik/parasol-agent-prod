# The Parasol claims portal, secured: same image as parasol-free, with the controls around it.
#  - login with Keycloak (quarkus-oidc web-app) from Secret parasol-portal-oidc
#  - the model call goes to the rate-limited model-gateway -> guardrails-proxy -> MaaS (agent-config endpoint)
#  - the MCP tools are reached ONLY through the MCP gateway, carrying the caller's token (per-tool AuthPolicy)
#  - the system prompt is the RELEASED prompt (ConfigMap agent-prompt-release, pinned by the release); traces go to the OTel collector
# The pod spec references the image by NAME ONLY: the kustomize images digest pin (below, patched by the
# secure pipeline) is what resolves it, so the signed digest is what admission verifies.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal
  labels: {app: portal}
spec:
  replicas: 1
  # Secured CPU is tight (limits.cpu ~7600m/8000m). A default rolling surge would add a second
  # 1000m portal pod and be quota-rejected, so roll with no surge (take the old pod down first).
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 0, maxUnavailable: 1}
  selector:
    matchLabels: {app: portal}
  template:
    metadata:
      labels: {app: portal}
    spec:
      serviceAccountName: claims-agent
      containers:
        - name: portal
          image: image-registry.openshift-image-registry.svc:5000/parasol-build/parasol-portal
          imagePullPolicy: Always
          env:
            # --- model path: the rate-limited model gateway, not the upstream MaaS directly ---
            - name: QUARKUS_LANGCHAIN4J_OPENAI_PARASOL_CHAT_BASE_URL
              valueFrom: {configMapKeyRef: {name: agent-config, key: endpoint}}
            - name: QUARKUS_LANGCHAIN4J_OPENAI_PARASOL_CHAT_CHAT_MODEL_MODEL_NAME
              valueFrom: {configMapKeyRef: {name: agent-config, key: model}}
            # ponytail: single staff key for now; Stream G is minting per-tier keys and a
            # ModelAuthProvider will select contractor vs staff by Keycloak group. Replace when G confirms.
            - name: QUARKUS_LANGCHAIN4J_OPENAI_PARASOL_CHAT_API_KEY
              valueFrom: {secretKeyRef: {name: maas-credentials, key: GENAI_API_KEY}}
            # per-tier keys (Stream G): PortalModelAuth presents the contractor key for the
            # contractors group and the staff key otherwise, so the night-shift storm drains only its bucket
            - name: STAFF_MAAS_KEY
              valueFrom: {secretKeyRef: {name: maas-portal-keys, key: STAFF_MAAS_KEY}}
            - name: CONTRACTOR_MAAS_KEY
              valueFrom: {secretKeyRef: {name: maas-portal-keys, key: CONTRACTOR_MAAS_KEY}}
            # --- login: Keycloak OIDC web-app (Secret created by Stream I in both namespaces) ---
            - name: QUARKUS_OIDC_CLIENT_ID
              valueFrom: {secretKeyRef: {name: parasol-portal-oidc, key: client-id}}
            - name: QUARKUS_OIDC_CREDENTIALS_SECRET
              valueFrom: {secretKeyRef: {name: parasol-portal-oidc, key: client-secret}}
            - {name: QUARKUS_OIDC_APPLICATION_TYPE, value: web-app}
            # The server side of the login (code -> token, signing keys, refresh) goes to Keycloak's in-cluster
            # Service (this pod has no route through the cluster ingress); the BROWSER is still sent to the public
            # sso host (authorization and logout endpoints below). No discovery: Keycloak's discovery document
            # names its public endpoints. The issuer checked is the public realm URL every token carries.
            - name: QUARKUS_OIDC_AUTH_SERVER_URL
              valueFrom: {configMapKeyRef: {name: agent-config, key: realmUrl}}
            - name: OIDC_PUBLIC_ISSUER
              valueFrom: {configMapKeyRef: {name: agent-config, key: issuer}}
            - {name: QUARKUS_OIDC_DISCOVERY_ENABLED, value: "false"}
            - {name: QUARKUS_OIDC_TOKEN_ISSUER, value: "$(OIDC_PUBLIC_ISSUER)"}
            - {name: QUARKUS_OIDC_AUTHORIZATION_PATH, value: "$(OIDC_PUBLIC_ISSUER)/protocol/openid-connect/auth"}
            - {name: QUARKUS_OIDC_END_SESSION_PATH, value: "$(OIDC_PUBLIC_ISSUER)/protocol/openid-connect/logout"}
            - {name: QUARKUS_OIDC_TOKEN_PATH, value: protocol/openid-connect/token}
            - {name: QUARKUS_OIDC_JWKS_PATH, value: protocol/openid-connect/certs}
            # Behind the TLS-terminating router: trust X-Forwarded-Proto so OIDC builds https:// redirect URIs
            - {name: QUARKUS_HTTP_PROXY_PROXY_ADDRESS_FORWARDING, value: "true"}
            - {name: QUARKUS_OIDC_AUTHENTICATION_FORCE_REDIRECT_HTTPS_SCHEME, value: "true"}
            # --- tools: both MCP clients go through the one gateway, each selecting its virtual server ---
            - name: CLAIMS_DB_MCP_URL
              valueFrom: {configMapKeyRef: {name: agent-config, key: claimsDbMcpUrl}}
            - name: POLICY_DOCS_MCP_URL
              valueFrom: {configMapKeyRef: {name: agent-config, key: policyDocsMcpUrl}}
            - name: CLAIMS_DB_API_URL
              valueFrom: {configMapKeyRef: {name: agent-config, key: claimsDbApiUrl}}
            # V3: the fraud-check agent reached through the same one gateway, per-identity authz
            - name: FRAUD_CHECK_MCP_URL
              valueFrom: {configMapKeyRef: {name: agent-config, key: fraudCheckMcpUrl}}
            # RAG: the knowledge base through the same gateway; retrieval runs as the user
            - name: KNOWLEDGE_BASE_MCP_URL
              valueFrom: {configMapKeyRef: {name: agent-config, key: knowledgeBaseMcpUrl}}
            - name: JAVA_TOOL_OPTIONS
              value: >-
                -Dquarkus.langchain4j.mcp.claims-db.header.X-Mcp-Virtualserver=parasol-secured/claims-db
                -Dquarkus.langchain4j.mcp.policy-docs.header.X-Mcp-Virtualserver=parasol-secured/policy-docs
                -Dquarkus.langchain4j.mcp.claims-db.cache-tool-list=false
                -Dquarkus.langchain4j.mcp.policy-docs.cache-tool-list=false
                -Dquarkus.langchain4j.mcp.fraud-check.header.X-Mcp-Virtualserver=parasol-secured/fraud-check
                -Dquarkus.langchain4j.mcp.fraud-check.cache-tool-list=false
                -Dquarkus.langchain4j.mcp.knowledge-base.header.X-Mcp-Virtualserver=parasol-secured/knowledge-base
                -Dquarkus.langchain4j.mcp.knowledge-base.cache-tool-list=false
            # Agent identity: the claims assistant acts ON BEHALF OF the logged-in user. Each MCP call carries a
            # token exchanged at Keycloak (sub = the user, azp = parasol-claims-agent, roles = user's AND the
            # agent's ceiling), authenticated by this pod's ServiceAccount token (no client secret).
            - name: MCP_AUTH_TOKEN_URL
              valueFrom: {configMapKeyRef: {name: agent-config, key: tokenUrl}}
            - {name: MCP_AUTH_AGENT_ID, value: parasol-claims-agent}
            - {name: MCP_AUTH_ASSERTION_FILE, value: /var/run/secrets/parasol/agent/token}
            # the whole system prompt, read on every turn from the RELEASED prompt (ConfigMap agent-prompt-release,
            # written only by the release's promote; promptVersion next to it names the registry version)
            - {name: AGENT_SYSTEM_PROMPT_FILE, value: /etc/parasol/prompt/systemPrompt}
            # A2 Read-Propose-Act: route writes through the local propose tool (secured only; free leaves this unset)
            - {name: PORTAL_PROPOSE_ENABLED, value: "true"}
            - name: AGENT_ENV
              valueFrom: {configMapKeyRef: {name: agent-config, key: env}}
            # prompt version this deployment runs, logged by the portal (MLflow Prompt Registry ref)
            - name: AGENT_PROMPT_VERSION
              valueFrom: {configMapKeyRef: {name: agent-config, key: promptVersion, optional: true}}
            # model client timeout under the router's 30 s, so the kill switch yields a fast 502
            - {name: QUARKUS_LANGCHAIN4J_OPENAI_PARASOL_CHAT_TIMEOUT, value: "25s"}
            # --- observability: traces to the OTel collector (gRPC 4317), mirroring parasol-agent exactly.
            # quarkus.otel.enabled is build-time (true in the image); sdk.disabled is the runtime toggle. ---
            - {name: QUARKUS_OTEL_SDK_DISABLED, value: "false"}
            # Quarkus-native key (QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT maps to quarkus.otel.exporter.otlp.endpoint);
            # the standard OTEL_EXPORTER_OTLP_ENDPOINT is not honored here, so the exporter fell back to localhost.
            - {name: QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT, value: http://otel-collector.observability.svc.cluster.local:4317}
          volumeMounts:
            - {name: agent-token, mountPath: /var/run/secrets/parasol/agent, readOnly: true}
            - {name: system-prompt, mountPath: /etc/parasol/prompt, readOnly: true}
          ports:
            - {name: http, containerPort: 8080}
          # tcpSocket (like free): the pod is Ready once HTTP is up; the MCP gateway path is exercised
          # by the chat, not gated at readiness (the gateway ping needs a per-user token we only have per request).
          readinessProbe:
            tcpSocket: {port: 8080}
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests: {cpu: 250m, memory: 384Mi}
            limits: {cpu: "1", memory: 1Gi}
      volumes:
        # Projected ServiceAccount token: the agent's credential at Keycloak (client assertion). Rotated by
        # the kubelet; the audience is set to the realm issuer by the env-secured Argo Application.
        - name: agent-token
          projected:
            sources:
              - serviceAccountToken: {audience: https://sso.apps.CLUSTER_DOMAIN/realms/parasol, expirationSeconds: 3600, path: token}
        # keep after agent-token: the env-secured Application patches volumes/0 (the token audience)
        # the released prompt: not in Git (Argo CD neither writes nor prunes it), pinned by the release next to
        # the image digest. Required: until a release has pinned a prompt the portal does not start (fail closed;
        # it runs 0 replicas until the first promote anyway).
        - name: system-prompt
          configMap:
            name: agent-prompt-release
            items: [{key: systemPrompt, path: systemPrompt}, {key: promptVersion, path: promptVersion}]
---
apiVersion: v1
kind: Service
metadata:
  name: portal
spec:
  selector: {app: portal}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: portal
  annotations:
    # The secured chat now chains get_claim_documents -> fraud_check -> propose_payout on qwen3-14b;
    # three sequential model turns exceed the router's default 30s, so allow the full flow to finish.
    haproxy.router.openshift.io/timeout: 120s
spec:
  # Explicit host so it matches the Keycloak redirect URI registered for the portal client.
  host: portal.apps.CLUSTER_DOMAIN   # set by the env-secured Argo Application
  to: {kind: Service, name: portal}
  port: {targetPort: http}
  tls: {termination: edge, insecureEdgeTerminationPolicy: Redirect}
