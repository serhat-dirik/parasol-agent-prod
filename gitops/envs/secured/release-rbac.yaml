# The release's promote task (parasol-build/pipeline) reads the prompt the secured portal runs (ConfigMap
# agent-config, key systemPrompt) and refuses to pin a digest when it is not the registered prompt-ref.
# Read-only, this one ConfigMap.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: parasol-release-prompt-check}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [agent-config]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: parasol-release-prompt-check}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: parasol-release-prompt-check}
subjects: [{kind: ServiceAccount, name: pipeline, namespace: parasol-build}]
