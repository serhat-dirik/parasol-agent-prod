# The release's promote task (parasol-build/pipeline) pins the released prompt for the secured portal: it
# writes ConfigMap agent-prompt-release (the registered text the gate evaluated), which the portal mounts.
# Create cannot be scoped by name; read and update are, to this one ConfigMap.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: parasol-release-prompt-pin}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [create]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [agent-prompt-release]
    verbs: [get, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: parasol-release-prompt-pin}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: parasol-release-prompt-pin}
subjects: [{kind: ServiceAccount, name: pipeline, namespace: parasol-build}]
