apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# "It works, ship it." The same containers as on the laptop, copied to a namespace.
# Nothing between the agent and its tools, nothing between the agent and the model but a key in a Secret.
namespace: parasol-free
resources:
  - namespace.yaml
  - ../base
  - portal.yaml
configMapGenerator:
  - name: agent-config
    literals:
      - endpoint=MAAS_ENDPOINT                 # set by bootstrap.sh (the upstream MaaS, straight)
      - model=MAAS_MODEL
      - claimsDbMcpUrl=http://claims-db:8080/mcp
      - policyDocsMcpUrl=http://policy-docs:8080/mcp
      - knowledgeBaseMcpUrl=http://knowledge-base:8080/mcp
      - claimsDbApiUrl=http://claims-db:8080
      - env=free   # environment label on metrics and traces
      # no safetyRules: the prompt exactly as it was written on the laptop
      # Scenario 6: someone plugged a vendor MCP server (currency conversion) into the assistant. No review, no registration.
      - thirdPartyMcpUrl=http://currency-converter.parasol-thirdparty.svc:8080/mcp
generatorOptions:
  disableNameSuffixHash: true
