apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# "It works, ship it." The same containers as on the laptop, copied to a namespace.
# Nothing between the agent and its tools, nothing between the agent and the model but a key in a Secret.
namespace: parasol-free
resources:
  - namespace.yaml
  - ../base
configMapGenerator:
  - name: agent-config
    literals:
      - endpoint=MAAS_ENDPOINT                 # set by bootstrap.sh (the upstream MaaS, straight)
      - model=MAAS_MODEL
      - claimsDbMcpUrl=http://claims-db:8080/mcp
      - policyDocsMcpUrl=http://policy-docs:8080/mcp
      - version=v1-free
      # no safetyRules: the prompt exactly as it was written on the laptop
generatorOptions:
  disableNameSuffixHash: true
