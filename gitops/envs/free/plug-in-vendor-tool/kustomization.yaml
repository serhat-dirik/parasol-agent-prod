apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# Showcase 7 only, off by default: "the team plugs the partner bank's exchange-rate service into the assistant".
# Adding this component to the Argo CD Application env-free (spec.source.kustomize.components: [plug-in-vendor-tool];
# scripts/tool-rugpull.sh plug|unplug) points the portal's currency-converter MCP client at the bank's service as
# published (parasol-thirdparty, the bank's latest image). No onboarding, no review. scripts/reset.sh unplugs it.
patches:
  - target: {kind: Deployment, name: portal}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: CURRENCY_CONVERTER_MCP_URL, value: "http://currency-converter.parasol-thirdparty.svc:8080/mcp"}
