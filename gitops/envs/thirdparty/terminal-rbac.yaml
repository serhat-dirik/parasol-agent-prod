# The Showroom Terminal (scripts/tool-rugpull.sh, reset.sh): read the unsecured vendor namespace and restart the
# bank's service after its latest tag moves.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: showroom-terminal-view, namespace: parasol-thirdparty}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: parasol-showroom-presenter}
subjects: [{kind: ServiceAccount, name: showroom-terminal, namespace: parasol-showroom}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: showroom-terminal-vendor-tool, namespace: parasol-thirdparty}
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [currency-converter]
    verbs: [patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: showroom-terminal-vendor-tool, namespace: parasol-thirdparty}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: showroom-terminal-vendor-tool}
subjects: [{kind: ServiceAccount, name: showroom-terminal, namespace: parasol-showroom}]
