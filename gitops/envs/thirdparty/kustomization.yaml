apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Scenario 6: software Parasol did not write. A vendor MCP server that runs in the cluster but is not
# part of the governed tool path: nothing here registers it on the MCP gateway.
namespace: parasol-thirdparty
resources:
  - namespace.yaml
  - referencegrant.yaml
  - terminal-rbac.yaml
  - ../../../apps/mcp-servers/currency-converter
