# Parasol Insurance - fraud-check MCP server
# A second agent behind the MCP gateway. Exposes one tool (fraud_check) over MCP; the claims
# assistant calls it agent-to-agent through the gateway (V3). It reads the claim record and the
# uploaded documents from the claims-db read API and returns a deterministic risk verdict.
quarkus.application.name=fraud-check

quarkus.http.host=0.0.0.0
quarkus.http.port=8080
# Local dev: claims-db runs on 8081, policy-docs 8082, so this one takes 8083.
%dev.quarkus.http.port=8083

# ---------------------------------------------------------------------------
# claims-db read API. In parasol-secured the Service is http://claims-db:8080; the
# fraud-check pod reaches it directly (its own NetworkPolicy allows that one hop). This is
# the data source of truth - the fraud-check agent keeps no copy of the claims dataset.
# ---------------------------------------------------------------------------
quarkus.rest-client.claims-db.url=${CLAIMS_DB_API_URL:http://localhost:8081}
quarkus.rest-client.claims-db.scope=jakarta.inject.Singleton

# A document total this many times the claim record (or more) is flagged HIGH risk. The
# CLM-1004 estimate is AED 84,000 against a record of 8,400 - a 10x inflation. Tunable so the
# threshold is a knob, not a magic number buried in code.
fraud.inflation-threshold=1.5

# ---------------------------------------------------------------------------
# Observability (on by default under /q): health probes + Prometheus metrics.
# ---------------------------------------------------------------------------
quarkus.micrometer.binder.http-server.enabled=true

# OpenTelemetry: a fraud_check call becomes its own span. Exporter OFF until a collector exists;
# the deployment turns it on to the collector via env.
quarkus.otel.sdk.disabled=true
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:}
