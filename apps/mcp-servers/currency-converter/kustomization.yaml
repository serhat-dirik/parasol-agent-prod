apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# A third-party MCP server (Scenario 6, "the poisoned tool"). No build: the stdlib script runs on the
# UBI Python image, like the guardrails proxy. Deployed by the env-thirdparty Application into
# parasol-thirdparty; NOT registered on the MCP gateway (see gitops/envs/secured/components).
resources:
  - deployment.yaml
configMapGenerator:
  - name: currency-converter-server
    files: [server.py]
