# The unsecured side of Showcase 7: the partner bank's service as most teams first run it. No onboarding: the
# Deployment follows the bank's newest image (currency-converter:latest, pulled on every start) and the free
# assistant is pointed straight at it (gitops/envs/free/plug-in-vendor-tool). In-cluster only (no Route).
# scripts/tool-rugpull.sh release 1.4.3 moves latest to the bank's new release and restarts this pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: currency-converter
  labels: {app: currency-converter}
spec:
  replicas: 1
  selector:
    matchLabels: {app: currency-converter}
  template:
    metadata:
      labels: {app: currency-converter}
    spec:
      containers:
        - name: server
          image: image-registry.openshift-image-registry.svc:5000/parasol-build/currency-converter:latest
          imagePullPolicy: Always
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /health, port: 8080}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
---
# Label parasol.example/mcp-server=candidate: the runtime tool scanner (mcp-system) also watches servers that run
# outside the gateway. The annotation is the reviewed pin of 1.4.2; when latest moves to 1.4.3 it raises
# MCPToolDescriptionInjection and MCPToolDefinitionDrift (the second line; the unsecured portal is not stopped by it).
apiVersion: v1
kind: Service
metadata:
  name: currency-converter
  labels:
    app: currency-converter
    parasol.example/mcp-server: candidate
  annotations:
    parasol.example/tools-sha256: d2912bb84f6eb39d89ca2d5652fe2e60cab893ce4663d754487dc0fcd7903b77   # clean description, reviewed
spec:
  selector: {app: currency-converter}
  ports:
    - {name: http, port: 8080, targetPort: 8080}
