# Identify the portal as "parasol-portal" in traces (Tempo/MLflow) and metrics, not the artifactId.
quarkus.application.name=parasol-portal

# Default LangChain4J configuration
quarkus.langchain4j.parasol-chat.chat-model.provider=openai
quarkus.langchain4j.log-requests=true
quarkus.langchain4j.log-responses=true

# OpenAI (MaaS). Temperature 0 for deterministic, reproducible tool-calling demos.
quarkus.langchain4j.openai.parasol-chat.chat-model.temperature=0
quarkus.langchain4j.openai.parasol-chat.timeout=600s
quarkus.langchain4j.openai.parasol-chat.chat-model.model-name=parasol-chat
quarkus.langchain4j.openai.parasol-chat.base-url=https://localhost:8000/v1
quarkus.tls.trust-all=true

# ===========================================================================
# The chat assistant is the agent: the claims-db + policy-docs MCP servers as tools.
# URLs are runtime config (direct to the servers in free; the MCP gateway in secured).
# ===========================================================================
quarkus.langchain4j.mcp.claims-db.transport-type=streamable-http
quarkus.langchain4j.mcp.claims-db.url=${CLAIMS_DB_MCP_URL:http://localhost:8081/mcp}
quarkus.langchain4j.mcp.claims-db.tool-execution-timeout=60s
quarkus.langchain4j.mcp.policy-docs.transport-type=streamable-http
quarkus.langchain4j.mcp.policy-docs.url=${POLICY_DOCS_MCP_URL:http://localhost:8082/mcp}
quarkus.langchain4j.mcp.policy-docs.tool-execution-timeout=60s
quarkus.langchain4j.mcp.claims-db.log-requests=false
quarkus.langchain4j.mcp.policy-docs.log-requests=false

# Prompt hardening + version (AGENT_SAFETY_RULES empty = the laptop prompt).
agent.safety-rules=${AGENT_SAFETY_RULES:}
agent.version=${AGENT_VERSION:dev}
# MLflow Prompt Registry version this deployment runs (set in secured; "unset" in free).
agent.prompt-version=${AGENT_PROMPT_VERSION:unset}

# Per-tier MaaS keys (secured only; both empty in free -> the single api-key above is used).
# PortalModelAuth selects by the caller's Keycloak group so only policyholders drain their bucket.
maas.key.staff=${STAFF_MAAS_KEY:}
maas.key.policyholder=${POLICYHOLDER_MAAS_KEY:}

# The portal reads claims/timeline/documents from the claims-db REST API (not its own H2).
quarkus.rest-client.claims-db-api.url=${CLAIMS_DB_API_URL:http://localhost:8081}

# ===========================================================================
# Login with Keycloak (OIDC web-app). auth-server-url / client-id / credentials.secret come
# from env (QUARKUS_OIDC_*), set from the parasol-portal-oidc Secret in each namespace.
# Request the groups scope so the top bar can show the role.
# ===========================================================================
quarkus.oidc.application-type=${QUARKUS_OIDC_APPLICATION_TYPE:web-app}
quarkus.oidc.authentication.scopes=profile,email,groups
quarkus.oidc.authentication.user-info-required=false
# RP-initiated logout so users can switch accounts (clears the Keycloak SSO session, not just the
# local cookie). The top bar links to /logout; Keycloak returns to / (post.logout.redirect.uris="+").
quarkus.oidc.logout.path=/logout
quarkus.oidc.logout.post-logout-path=/
# Everything needs a login except health, metrics and the script/REST agent endpoint.
quarkus.http.auth.permission.public.paths=/q/*,/agent/*
quarkus.http.auth.permission.public.policy=permit
quarkus.http.auth.permission.authenticated.paths=/*
quarkus.http.auth.permission.authenticated.policy=authenticated

# Ollama
quarkus.langchain4j.ollama.parasol-chat.timeout=600s
quarkus.langchain4j.ollama.parasol-chat.chat-model.model-id=llama3.2
quarkus.langchain4j.ollama.parasol-chat.chat-model.temperature=0.3
%ollama.quarkus.langchain4j.parasol-chat.chat-model.provider=ollama

# Jlama
# Uncomment to use the un-quantized model
# NOTE: This doesn't work on MacOS nor on GitHub action CI (due to the size of the model)
#quarkus.langchain4j.jlama.parasol-chat.chat-model.model-name=rh-rad-ai-roadshow/parasol-trained-chat
# Use the quantized model by default
quarkus.langchain4j.jlama.parasol-chat.chat-model.model-name=mariofusco/parasol-trained-chat-JQ4
quarkus.langchain4j.jlama.parasol-chat.chat-model.temperature=0.3
%jlama.quarkus.langchain4j.parasol-chat.chat-model.provider=jlama

# Http
quarkus.http.host=0.0.0.0
quarkus.http.port=8005
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.dev-ui.cors.enabled=false
quarkus.dev-ui.hosts=${quarkus.http.host}

# Hibernate
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# Logging
%dev,test.quarkus.log.category."org.parasol".level=DEBUG
%dev,test.quarkus.log.console.level=DEBUG

# Quinoa
quarkus.quinoa.package-manager-install=true
quarkus.quinoa.package-manager-install.node-version=22.2.0
quarkus.quinoa.package-manager-install.npm-version=10.8.1
quarkus.quinoa.build-dir=dist
quarkus.quinoa.enable-spa-routing=true

# H2
%prod.quarkus.datasource.jdbc.url=jdbc:h2:mem:claims;DB_CLOSE_DELAY=-1
%prod.quarkus.datasource.username=sa
%prod.quarkus.datasource.password=sa
%prod.quarkus.hibernate-orm.sql-load-script=import.sql
%prod.quarkus.hibernate-orm.database.generation=drop-and-create

# Websockets
quarkus.websockets-next.server.auto-ping-interval=1m

# OpenTelemetry & Tracing
# OpenTelemetry is BUILT IN (quarkus.otel.enabled is build-time); the EXPORT is toggled at runtime
# by quarkus.otel.sdk.disabled (QUARKUS_OTEL_SDK_DISABLED), like parasol-agent. Default off; secured
# sets QUARKUS_OTEL_SDK_DISABLED=false + OTEL_EXPORTER_OTLP_ENDPOINT so chat spans reach Tempo/MLflow.
quarkus.otel.enabled=true
quarkus.otel.sdk.disabled=${QUARKUS_OTEL_SDK_DISABLED:true}
quarkus.datasource.jdbc.telemetry=false